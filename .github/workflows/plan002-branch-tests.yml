name: Plan 002 branch tests

on:
  push:
    branches:
      - plan002/v1-openrouter-first-replay

jobs:
  policy-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Policy-control tests
        run: python -m pytest -q tests/policy_control
