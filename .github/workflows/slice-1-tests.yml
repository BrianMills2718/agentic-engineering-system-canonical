name: Slice 1 regression tests (manual hosted convenience)

on:
  workflow_dispatch:

# Hosted CI is intentionally optional verification infrastructure.
# Decision 0007 makes local/external execution and exact-blob evidence
# carry-forward first-class verification paths. This workflow is manual-only
# while GitHub Actions funding is unavailable and must never be treated as the
# authority for Plan 001 acceptance.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run repository-context regression tests
        run: python -m pytest -q tests/repository_context
      - name: State external acceptance boundary
        run: |
          echo "::notice::Hosted regression is optional convenience evidence only."
          echo "::notice::Pinned private data-contracts acceptance is a separate local/external boundary."
          echo "::notice::Run with AES_DATA_CONTRACTS_CHECKOUT bound to data-contracts@90c38998e8141bd07e49a77a49ec417aa29beee0 when fresh execution is required by changed relevant blobs."
