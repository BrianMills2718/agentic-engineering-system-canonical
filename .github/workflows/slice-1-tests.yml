name: Slice 1 tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'slice-1/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run repository-context tests
        run: python -m pytest -q tests/repository_context
