    exact_path: tests/greenfield/test_project.py
  kind: test
  purpose: >
    prove minimal initialization and reject unauthorized bootstrap artifacts/private prerequisites
  semantic_justification_refs:
  - SC-GF-001
- id: ART-SRC-PLANNING
