  - drift
  - check
  - running_version
- id: ART-SRC-CHARACTERIZE-PYTHON
  locator:
    exact_path: src/agentic_engineering_system/characterize_python.py
  kind: source
  purpose: >
    Python AST characterization provider for symbols, signatures/types, docstrings and static imports
  semantic_justification_refs:
  - GF-REQ-006
  exports:
  - analyze
  - import_closure
  - parse_export
- id: ART-TEST-CHARACTERIZE
  locator:
    exact_path: tests/greenfield/test_characterize.py
  kind: test
  purpose: >
    revision binding, Python AST extraction, uncertainty and deliberate selected-symbol drift verification
  semantic_justification_refs:
  - SC-GF-006
- id: ART-SRC-EVIDENCE
  locator:
    exact_path: src/agentic_engineering_system/evidence.py
  kind: source
  purpose: >
    observation receipts and criterion evidence-assessment engine
  semantic_justification_refs:
  - GF-REQ-007
  - GF-REQ-008
  exports:
  - assess
  - record
  - freshness
  - load_observations
- id: ART-TEST-EVIDENCE
  locator:
    exact_path: tests/greenfield/test_evidence.py
  kind: test
  purpose: >
    prove pass-like observation is distinct from adequacy and exercise stale/insufficient states
  semantic_justification_refs:
  - SC-GF-007
  - SC-GF-008
- id: ART-TEST-EVIDENCE-CONTROLS
  locator:
    exact_path: tests/greenfield/test_evidence_controls.py
  kind: test
  purpose: >
