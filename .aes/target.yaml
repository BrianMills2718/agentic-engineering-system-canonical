  kind: source
  purpose: >
    planning contract models, target-delta validation and transition-plan validation, including the
    adopted-plan requirement (adopted_plan_ref, .aes/planning.yaml)
  semantic_justification_refs:
  - GF-REQ-004
  - AP-REQ-002
  exports:
