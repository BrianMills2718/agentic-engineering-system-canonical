external_boundaries:
- evidence_requirement_ref: ER-SC-GF-001-01
  boundary: >
    A fresh agent or person with only docs/greenfield/GETTING_STARTED.md and a pin id installs AES
    from the distribution and reaches an initialized, validated project; the orchestrating session
    records the run as an observation. A no-private-access run additionally needs a machine without
    the maintainer's GitHub credentials, because this repository is private.
- evidence_requirement_ref: ER-SC-GF-005-02
  boundary: >
    The orchestrator runs each fresh-agent comparison on one real change (arm A gets `aes context
    <subject>`, arm B the repository only, each in a separate session with no access to the planning
    conversation or proposals/), scores it on a sheet written before either arm's output is seen,
    retains the sheet, both arms' commits and the verdict at exact revisions, and records one
    observation assessing the retained runs against this requirement.
- evidence_requirement_ref: ER-SC-GF-009-01
  boundary: >
    The orchestrator retains whygame5's lifecycle at exact revisions (init commit, target history,
    accepted plans, realization commits, observations, aes status output, fresh-agent context evaluation)
    and records one observation listing them; no test in this repository can establish it.
- evidence_requirement_ref: ER-AP-001-02
  boundary: >
    The orchestrating session installs the hook in AES canonical, makes the three canonical-example
    commits in a scratch branch, quotes each verdict and exit code, runs `aes commit replay` over the
    last 300 commits of AES canonical and personal-vps, and records one observation with the output.
- evidence_requirement_ref: ER-TR-SOURCE-002
  boundary: Independent review of retained native acceptance probe execution trace, validated by Company Planning provider
