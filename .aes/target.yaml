schema_version: aes.v0_2.target.probe0
target_id: agentic-engineering-system-canonical-target
outcomes:
- id: OUT-GF-001
  actor_or_consumer: software_engineer_or_engineering_agent
  statement: A colleague can start a genuinely new software project under AES governance, move from accepted intent through planned realization and implementation to evidence-backed current/gap state, and do so without access to private historical repositories or undocumented AES lineage knowledge.
  non_goals:
  - retrofit_arbitrary_existing_repository
  - universal_language_support
  - universal_framework_abstraction
  - organization_portfolio_orchestration
- id: OUT-AP-001
  actor_or_consumer: brian_and_his_engineering_agents
  statement: >
    Real implementation work in an AES-governed repository lands only under a plan that Company
    Planning adopted; trivial work still lands, decided by measured facts about the change, not by
    the tag an agent types.
  non_goals:
  - judging_commit_prose_with_regex
  - a_stop_hook
  - migrating_other_repositories_in_this_change
normative_items:
- id: GF-REQ-001
  kind: constraint
  outcome_refs:
  - OUT-GF-001
  statement: >
    The supported AES distribution and its required dependencies must be obtainable and documented
    without access to Brian's private historical repositories.
- id: GF-REQ-002
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    Before governed implementation begins, AES must represent accepted normative obligations, success/disproof
    semantics, and what evidence is capable of establishing each exercised criterion.
- id: GF-REQ-003
  kind: invariant
  outcome_refs:
  - OUT-GF-001
  statement: >
    Every durable governed repository artifact must be justified by an accepted exact planned path
    or a bounded accepted artifact-generation rule.
- id: GF-REQ-004
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    AES planning must derive accepted capability requirements, realization boundaries, durable repository
    topology, selected load-bearing symbol commitments where needed, and criterion-linked verification
    topology before governed execution of those commitments.
- id: GF-REQ-005
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    The working context for a governed subject must contain the full applicable normative, success
    and disproof meaning with provenance rather than requiring the acting agent to dereference identifiers
    before understanding its obligations.
- id: GF-REQ-006
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    AES must produce revision-bound structured characterization of the realized repository sufficient
    to compare accepted artifact and selected symbol/signature/type commitments with realized state.
- id: GF-REQ-007
  kind: invariant
  outcome_refs:
  - OUT-GF-001
  statement: >
    Observation result, evidence freshness, evidence adequacy, qualified current, gap, and plan
    completion must remain semantically distinct.
- id: GF-REQ-008
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    AES must derive qualified current state and gap state from accepted target plus revision-bound
    realized observations and evidence assessments, preserving missing, stale, error, contradictory
    and insufficient-evidence conditions rather than rendering them green.
- id: GF-REQ-009
  kind: constraint
  outcome_refs:
  - OUT-GF-001
  statement: >
    Greenfield-MVP acceptance must be established on a genuinely fresh consumer project governed
    by AES from inception; success on AES canonical's existing repository alone is insufficient.
- id: NI-AES-HIST
  kind: constraint
  outcome_refs:
  - OUT-GF-001
  statement: >
    v0.1 code is retained, not deleted. Phase 7a dispositioned it: the eight empty v0.1 component
    placeholders were moved with history to archive/v0.1-placeholders/ (historical); repository_context/
    (the installed console script aes-repo-context, tested by tests/repository_context/) and the package
    __init__.py are retained, each a planned artifact of this target so the no-orphan rule holds. They
    carry no v0.2 obligation; changing them is v0.1 maintenance, not v0.2 work.
- id: AP-REQ-001
  kind: constraint
  outcome_refs:
  - OUT-AP-001
  statement: >
    Every commit message's first line carries one of [Plan #N], [Goal <id>], [Trivial], [Unplanned]
    or [Shaping <id>] (git's own merge, fixup and squash messages excepted), and the rule checks the
    tag against facts: an adopted receipt for the named plan, the staged diff's measured size and
    paths, an Emergency trailer, or the plan's proposals folder.
- id: AP-REQ-002
  kind: constraint
  outcome_refs:
  - OUT-AP-001
  statement: >
    In a repository that requires adopted plans, a target change is accepted only for a proposal whose
    adopted_plan_ref names a Company Planning plan adopted for its current bytes; a proposal that
    names a plan is checked the same way in any repository.
- id: TR-REQ-001
  kind: constraint
  outcome_refs:
  - OUT-AP-001
  statement: "Every proposal declares whether its work runs a model, agent or pipeline (trace_review); a proposal declaring traced work adds or changes a success criterion with an evidence requirement of kind trace_review; an observation assessing a trace_review requirement carries a TraceReview record whose reviewer is not the author, and may SUPPORT only when every trace step was read and no checked decision was wrong.\n Supporting standing additionally requires a fresh invocation of the configured Company Planning source-bound review provider against retained trace bytes, exact criterion/revision linkage and reviewer identity. Missing provider, partial coverage, altered bytes or fabricated citations leave standing insufficient; review completeness never changes a failed run verdict."
- id: ADOPT-REQ-001
  kind: behavior
  outcome_refs:
  - OUT-GF-001
  statement: >
    aes adopt writes .aes/legacy_baseline.json listing every tracked file under the governed roots at
    a named revision with its blob hash (minus files the target already plans), initializing the
    project first when it has no .aes/. Baseline files the target does not plan are legacy, not
    orphans, in topology, characterize and reconcile; a file in neither is still an orphan. A commit
    that modifies a legacy file is an unplanned legacy edit under the commit rule's mode (observe logs
    it, enforce refuses it), except Git's own messages and [Unplanned] emergencies. aes plan accept
    removes baseline entries the target now plans or Git no longer tracks. aes status shows the
    legacy share and how many legacy files changed since adoption.
success_criteria:
- id: SC-GF-001
  statement: >
    A fresh user with no access to Brian's other private repositories can install/configure the
    supported AES distribution and initialize a new governed project using only distributed material
    and declared dependencies.
  target_refs:
  - OUT-GF-001
  - GF-REQ-001
  disproof: >
    Successful initialization requires copying undeclared files, private-repo access, or undocumented
    historical knowledge.
  evidence_requirements:
  - id: ER-SC-GF-001-01
    kind: runtime_observation
    requirement: >
      A clean-user run from the supported distribution and documented dependencies reaches initialized
      governed-project state without private repository access.
- id: SC-GF-002
  statement: >
    Before governed implementation, every exercised normative item is linked to explicit success/disproof
    semantics and each exercised criterion states what evidence can establish it.
  target_refs:
  - GF-REQ-002
  disproof: >
    An implemented obligation exists only in conversation, code, or an unowned checklist, or a criterion
    has no evidence requirement.
  evidence_requirements:
  - id: ER-SC-GF-002-01
    kind: deterministic_test
    requirement: >
      Validate the accepted target model for resolvable normative-to-criterion and criterion-to-evidence-requirement
      links.
- id: SC-GF-003
  statement: >
    The accepted realization topology accounts for every durable governed artifact by exact path
    or bounded accepted generation rule and gives every artifact a semantic purpose.
  target_refs:
  - GF-REQ-003
  - GF-REQ-004
  disproof: >
    A durable governed artifact can exist without an accepted exact path, applicable bounded generation
    rule, or semantic justification.
  evidence_requirements:
  - id: ER-SC-GF-003-01
    kind: deterministic_test
    requirement: >
      A repository-topology check rejects an intentionally introduced orphan durable artifact.
  - id: ER-SC-GF-003-02
    kind: deterministic_test
    requirement: >
      The same check accepts the unchanged planned topology and correctly handles at least one
      bounded generation rule if the authentic consumer naturally requires such a rule.
- id: SC-GF-004
  statement: >
    Before governed execution, each exercised evidence requirement is mapped to a concrete verification
    subject or an explicit external/human observation boundary.
  target_refs:
  - GF-REQ-004
  disproof: >
    Implementation starts while an exercised criterion has no concrete route to obtaining its required
    evidence.
  evidence_requirements:
  - id: ER-SC-GF-004-01
    kind: deterministic_test
    requirement: >
      Validate criterion evidence requirements against the accepted verification topology.
- id: SC-GF-005
  statement: >
    A fresh implementing agent receives the complete applicable normative, success and disproof
    text with provenance in the bounded working context for the selected subject.
  target_refs:
  - GF-REQ-005
  disproof: >
    The context exposes only identifiers/links, omits a load-bearing obligation, or requires broad
    repository archaeology before the agent can understand what must be preserved.
  evidence_requirements:
  - id: ER-SC-GF-005-01
    kind: deterministic_test
    requirement: >
      Generated/projected context contains exact applicable semantic text and provenance for the
      selected governed subject.
  - id: ER-SC-GF-005-02
    kind: runtime_observation
    requirement: >
      A fresh-agent comparison on one real change, scored against a pre-registered sheet, is run
      and retained at exact revisions with its verdict either way; two such runs (probe 0 on
      whygame5 at ~300 lines, phase 6 on AES itself at ~4,000 governed lines) are the minimum.
- id: SC-GF-006
  statement: >
    At an exact revision AES characterizes the realized repository and mechanically detects missing/undeclared
    durable artifacts plus selected symbol/signature/type drift when such commitments exist.
  target_refs:
  - GF-REQ-006
  disproof: >
    Target-realized comparison requires manual reconstruction of repository contents or silently
    accepts an intentional drift.
  evidence_requirements:
  - id: ER-SC-GF-006-01
    kind: deterministic_test
    requirement: >
      Deliberately mutate one planned artifact or selected symbol commitment and observe a target-realized
      mismatch.
  - id: ER-SC-GF-006-02
    kind: deterministic_test
    requirement: >
      Characterization binds every asserted realized fact to exact repository revision and producer
      identity.
- id: SC-GF-007
  statement: >
    A pass-like observation with insufficient required evidence does not render the associated criterion
    satisfied or its gap closed.
  target_refs:
  - GF-REQ-007
  - GF-REQ-008
  disproof: >
    Any passing test automatically produces criterion satisfaction regardless of the criterion's
    evidence requirements.
  evidence_requirements:
  - id: ER-SC-GF-007-01
    kind: deterministic_test
    requirement: >
      Construct a criterion requiring multiple evidence inputs, provide only one passing observation,
      and verify adequacy remains INSUFFICIENT and standing is not promoted to supported closure.
- id: SC-GF-008
  statement: >
    Material change to an evidence dependency invalidates or stales affected evidence/current state
    until applicable evidence is re-established.
  target_refs:
  - GF-REQ-007
  - GF-REQ-008
  disproof: >
    A materially changed subject can retain green current/gap state solely because older evidence
    once passed.
  evidence_requirements:
  - id: ER-SC-GF-008-01
    kind: deterministic_test
    requirement: >
      Change one material dependency after successful verification and verify affected evidence/current
      becomes stale or otherwise non-current before re-verification.
- id: SC-GF-009
  statement: >
    One complete Greenfield-MVP lifecycle is exercised on a genuinely new consumer project under
    AES governance from inception.
  target_refs:
  - GF-REQ-009
  - OUT-GF-001
  disproof: >
    Acceptance relies only on AES canonical's existing repository, schemas, fixtures, prose review,
    or a pre-existing project requiring retrofit.
  evidence_requirements:
  - id: ER-SC-GF-009-01
    kind: runtime_observation
    requirement: >
      Retain the fresh project's initialization, target, plan, realization, observations/evidence,
      current/gap and fresh-agent context evaluation at exact revisions.
- id: SC-AP-001
  statement: >
    With the commit-message hook installed, a staged change adding a Dockerfile committed as
    "[Unplanned] ..." with no Emergency trailer is judged refuse and names the running-thing file;
    the same change under a [Goal <id>] whose plan is adopted is judged accept; a one-line README
    change under [Trivial] is judged accept; in observe mode every verdict is logged and none blocks.
  target_refs:
  - OUT-AP-001
  - AP-REQ-001
  disproof: >
    The rule accepts or refuses on the tag text alone; or a running-thing file passes as [Trivial];
    or a [Goal] or [Plan] commit is accepted with no adopted receipt, or with a receipt for older
    plan bytes; or observe mode blocks a commit.
  evidence_requirements:
  - id: ER-AP-001-01
    kind: deterministic_test
    requirement: >
      Tests build real Git repositories, install the hooks with `aes hooks install`, stage real
      changes and run real commits, asserting each tag's verdict and reason, observe versus enforce
      exit status, the log line, and replay counts.
  - id: ER-AP-001-02
    kind: runtime_observation
    requirement: >
      In AES canonical with the hook installed, the three canonical-example commits are judged as
      stated (output and exit codes quoted), and `aes commit replay` over the last 300 commits of
      AES canonical and of personal-vps lists personal-vps #87's commit as refuse, with counts.
- id: SC-AP-002
  statement: >
    With require_adopted_plan true, `aes plan validate` and `aes plan accept` refuse a proposal with no
    adopted_plan_ref, one naming a missing plan, and one whose plan changed after adoption, each with
    the reason; the same proposal naming a freshly adopted plan is accepted. With the setting absent,
    a proposal without adopted_plan_ref is accepted as before.
  target_refs:
  - OUT-AP-001
  - AP-REQ-002
  disproof: >
    accept succeeds without an adopted receipt where one is required, or with a receipt for older plan
    bytes; or the default (setting absent) refuses a proposal that does not name a plan.
  evidence_requirements:
  - id: ER-AP-002-01
    kind: deterministic_test
    requirement: >
      Tests run `aes plan validate` and `aes plan accept` in real Git repositories for each case above,
      asserting exit status, the reason text and whether the target and plan file were written.
- id: SC-TR-001
  statement: >
    aes plan validate refuses a proposal with no trace_review declaration and one declaring traced
    work without a trace_review requirement, and accepts the declared and routed case; observation
    loading refuses a trace_review assessment with no record, SUPPORTS with unread steps or a wrong
    checked decision, and a review by the run's author.
  target_refs:
  - TR-REQ-001
  disproof: >
    A proposal without the declaration validates; traced work validates without a trace_review
    requirement; or a trace_review observation SUPPORTS with unread steps, a wrong decision, no record,
    or the author as reviewer.
  evidence_requirements:
  - id: ER-TR-001-01
    kind: deterministic_test
    requirement: >
      tests/greenfield/test_trace_review.py builds real proposals against the frozen whygame5 target
      and real observation files, asserting each refusal's message and each acceptance.
- id: SC-ADOPT-001
  statement: >
    Adopting a real repository lists exactly its tracked governed files with their blobs and status
    reads 100% legacy; the adoption commit passes the installed hooks; an unplanned legacy edit is
    logged in observe and refused in enforce; planning that file removes exactly that path from the
    baseline and its edit is then accepted; a new unplanned file is still an orphan.
  target_refs:
  - ADOPT-REQ-001
  disproof: >
    The baseline misses or adds a tracked governed file or binds a wrong blob; the adoption commit is
    refused as orphans; an unplanned legacy edit lands under enforce; aes plan accept removes any path
    other than the newly planned ones; or a new unplanned file passes the pre-commit hook.
  evidence_requirements:
  - id: ER-ADOPT-001-01
    kind: deterministic_test
    requirement: >
      tests/greenfield/test_adopt.py clones this repository, adopts it with src/ and tests/ as roots,
      and drives the real CLI and installed hooks through each case, asserting baseline membership
      by set equality and the exact path removed.
- id: SC-TR-SOURCE-001
  statement: Native evidence standing refuses unsupported trace-review claims and admits only source-bound complete reviews of passing runs; complete reviews of failed runs retain their failed verdict.
  target_refs:
  - TR-REQ-001
  disproof: A missing provider or review, partial inventory, changed source, false citation, wrong criterion/revision/reviewer binding, or reviewed failure yields supporting standing.
  evidence_requirements:
  - id: ER-TR-SOURCE-001
    kind: deterministic_test
    requirement: Native standing and the real Company Planning validator reject each counterexample and preserve the authentic privacy run failure.
  - id: ER-TR-SOURCE-002
    kind: trace_review
    requirement: An independent reviewer inspects the retained native boundary probe inputs and outputs, including refusals and the reviewed failed privacy run.
components:
- id: RU-AES-RECORDS
  responsibility: >
    Own typed AES record models, strict YAML loading/writing, stable semantic reference resolution
    and structural/semantic validation of canonical project records.
  target_refs:
  - GF-REQ-002
  - SC-GF-002
  planned_artifact_refs:
  - ART-SRC-RECORDS
  - ART-TEST-RECORDS
- id: RU-AES-PROJECT
  responsibility: >
    Initialize and open the minimal .aes project control surface under the accepted initialization
    contract without creating placeholder artifacts.
  target_refs:
  - GF-REQ-001
  - SC-GF-001
  planned_artifact_refs:
  - ART-SRC-PROJECT
  - ART-TEST-PROJECT
- id: RU-AES-PLANNING
  responsibility: >
    Represent, validate and project the AES planning contract: target-realization deltas, accepted
    transition plans, uncertainty/probe semantics, criterion-linked verification topology, and the
    trace-review declaration every proposal makes.
  target_refs:
  - GF-REQ-004
  - SC-GF-004
  - TR-REQ-001
  - SC-TR-001
  planned_artifact_refs:
  - ART-SRC-PLANNING
  - ART-PLANNING-PROTOCOL
  - ART-TEST-PLANNING
  - ART-TEST-TRACE-REVIEW
- id: RU-AES-TOPOLOGY
  responsibility: >
    Compare accepted durable topology and bounded generation rules with the Git-realized repository
    and emit actionable conformance findings.
  target_refs:
  - GF-REQ-003
  - SC-GF-003
  planned_artifact_refs:
  - ART-SRC-TOPOLOGY
  - ART-TEST-TOPOLOGY
  - ART-TEST-SELF-GOVERNANCE
- id: RU-AES-CHARACTERIZE
  responsibility: >
    Produce revision-bound realized-repository characterization for the first Python/Git ecosystem
    without importing target project code or inventing target mappings.
  target_refs:
  - GF-REQ-006
  - SC-GF-006
  planned_artifact_refs:
  - ART-SRC-CHARACTERIZE
  - ART-SRC-CHARACTERIZE-PYTHON
  - ART-TEST-CHARACTERIZE
- id: RU-AES-EVIDENCE
  responsibility: "Represent observations and compute evidence freshness, adequacy and standing independently from pass-like provider results.\n"
  target_refs:
  - GF-REQ-007
  - GF-REQ-008
  - SC-GF-007
  - SC-GF-008
  - TR-REQ-001
  - SC-TR-SOURCE-001
  planned_artifact_refs:
  - ART-SRC-EVIDENCE
  - ART-TEST-EVIDENCE
  - ART-TEST-EVIDENCE-CONTROLS
  - ART-SRC-TRACE-PROVIDER
  - ART-TEST-TRACE-PROVIDER
- id: RU-AES-RECONCILE
  responsibility: >
    Derive qualified current state and target/current gaps from accepted target, realized characterization
    and evidence assessments.
  target_refs:
  - GF-REQ-008
  - SC-GF-007
  - SC-GF-008
  planned_artifact_refs:
  - ART-SRC-RECONCILE
  - ART-TEST-RECONCILE
- id: RU-AES-CONTEXT
  responsibility: >
    Compile the smallest complete subject-specific working context from typed target refs, realized
    state, current/gaps, plan and verification semantics.
  target_refs:
  - GF-REQ-005
  - SC-GF-005
  planned_artifact_refs:
  - ART-SRC-CONTEXT
  - ART-TEST-CONTEXT
- id: RU-AES-CLI
  responsibility: >
    Expose one coherent user/agent command surface that composes the capability units without owning
    their semantics.
  target_refs:
  - OUT-GF-001
  - GF-REQ-009
  - SC-GF-009
  planned_artifact_refs:
  - ART-SRC-CLI
- id: RU-AES-DISTRIBUTION
  responsibility: >
    Own the installable Python distribution boundary, declared dependencies, console entrypoints,
    packaged planning resource, Greenfield getting-started material and clean-install verification.
  target_refs:
  - OUT-GF-001
  - GF-REQ-001
  - GF-REQ-009
  - SC-GF-001
  - SC-GF-009
  planned_artifact_refs:
  - ART-PACKAGING-PYPROJECT
  - ART-DOC-GREENFIELD-GETTING-STARTED
  - ART-SRC-HOOKS
  - ART-TEST-DISTRIBUTION
- id: RU-AES-COMMIT-RULE
  responsibility: >
    Judge a commit message's tag against facts about the staged change and the plan it names, log
    every verdict, replay the same judgement over past commits, and resolve whether a named plan is
    adopted for its current bytes (used by the commit rule and by plan acceptance).
  target_refs:
  - AP-REQ-001
  - SC-AP-001
  - AP-REQ-002
  - SC-AP-002
  planned_artifact_refs:
  - ART-SRC-COMMIT-RULE
  - ART-TEST-COMMIT-RULE
  - ART-TEST-PLAN-RECEIPT
- id: RU-AES-ADOPT
  responsibility: >
    Bring an existing repository under AES without planning its old files: the legacy baseline, its
    effect on topology and the commit rule, its pruning on plan acceptance, and the legacy share in
    status.
  target_refs:
  - ADOPT-REQ-001
  - SC-ADOPT-001
  planned_artifact_refs:
  - ART-SRC-ADOPT
  - ART-TEST-ADOPT
planned_artifacts:
- id: ART-SRC-RECORDS
  locator:
    exact_path: src/agentic_engineering_system/records.py
  kind: source
  purpose: >
    typed record models, strict YAML I/O primitives and semantic ref validation
  semantic_justification_refs:
  - GF-REQ-002
  exports:
  - load_target
  - load_project
  - parse_target
  - validate_target_refs
- id: ART-TEST-RECORDS
  locator:
    exact_path: tests/greenfield/test_records.py
  kind: test
  purpose: >
    structural, duplicate-key, typed-ref and semantic-invariant verification
  semantic_justification_refs:
  - SC-GF-002
- id: ART-SRC-PROJECT
  locator:
    exact_path: src/agentic_engineering_system/project.py
  kind: source
  purpose: >
    initialization contract, project discovery and canonical AES control-surface paths
  semantic_justification_refs:
  - GF-REQ-001
  exports:
  - initialize_project
  - find_project_root
- id: ART-TEST-PROJECT
