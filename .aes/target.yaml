  - compare_topology
- id: ART-TEST-TOPOLOGY
  locator:
    exact_path: tests/greenfield/test_topology.py
  kind: test
  purpose: >
    positive and negative controls for exact paths, orphan files and bounded generation rules
  semantic_justification_refs:
  - SC-GF-003
- id: ART-SRC-CHARACTERIZE
  locator:
    exact_path: src/agentic_engineering_system/characterize.py
  kind: source
  purpose: >
    provider-neutral realized-repository characterization contract and aggregation
  semantic_justification_refs:
  - GF-REQ-006
