    external_boundaries:
      - evidence_requirement_ref: ER-SC-GF-001-01
        boundary: >
          A fresh agent or person with only docs/greenfield/GETTING_STARTED.md and a pin id installs AES
          from the distribution and reaches an initialized, validated project; the orchestrating session
          records the run as an observation. A no-private-access run additionally needs a machine without
          the maintainer's GitHub credentials, because this repository is private.
      - evidence_requirement_ref: ER-SC-GF-005-02
        boundary: >
          A fresh-agent A/B on one real change: arm A gets `aes context <subject>`, arm B the repository
          only, each in a separate session with no access to the planning conversation or proposals/;
          scored by the orchestrator on a sheet written before either arm's output is seen, and recorded
          as an observation.
      - evidence_requirement_ref: ER-SC-GF-009-01
        boundary: >
          The orchestrator retains whygame5's lifecycle at exact revisions (init commit, target history,
          accepted plans, realization commits, observations, aes status output, fresh-agent context evaluation)
          and records one observation listing them; no test in this repository can establish it.
