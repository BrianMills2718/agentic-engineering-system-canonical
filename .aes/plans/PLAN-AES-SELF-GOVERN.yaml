schema_version: aes.v0_2.proposal.probe0
proposal_id: PLAN-AES-SELF-GOVERN
title: 'AES canonical governs itself: the Greenfield MVP target, its topology and its verification routes'
rationale: >
  Roadmap phase 6b (25-roadmap-to-mvp-acceptance.md). The nine SC-GF criteria, their evidence requirements
  and GF-REQ-001..009 are copied from 12-greenfield-mvp-semantic-instance with ids and text preserved
  (evidence kinds mapped onto the loader's three: contract_validation -> deterministic_test, external_consumer_observation
  -> runtime_observation). Components are the RU-AES-* units and planned artifacts the ART-* entries of
  20-realization-topology (capability refs mapped to the GF-REQ items they serve). Every tracked v0.1
  file under the governed root is planned as retained history under NI-AES-HIST until phase 7 dispositions
  it. Every evidence requirement gets a route: a test file for the deterministic ones, an external boundary
  for ER-SC-GF-001-01, ER-SC-GF-005-02 and ER-SC-GF-009-01.
