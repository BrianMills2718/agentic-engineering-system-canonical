[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-system"
dynamic = ["version"]
description = "Canonical Agentic Engineering System"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "ruamel.yaml>=0.18,<0.20",
  # Lockstep (src/lockstep): cog projects plan text into docstrings
  "cogapp>=3.4",
  # `lockstep check arch` runs the generated contracts against the code; `check test-first` runs the tests.
  # Both fail loudly when missing, so a Lockstep install must carry them.
  "import-linter>=2",
  "pytest>=8",
  # `lockstep check prior-art` (and `ship`, which runs it) apply the prior-art record's JSON schema.
  "jsonschema>=4",
]

[project.optional-dependencies]
# The tools the Makefile's test/type targets run. They were previously
# undeclared, so `pip install -e .` left `make aes-check` and `make check`
# without pytest. Declared once here instead of re-listed per caller.
dev = [
  "pytest>=8",
  "mypy>=1.8",
  "pytest-xdist>=3.8",
  "agentic-engineering-system[wiki]",
]
# Lockstep's wiki build (MkDocs reading the plan and the docstrings)
wiki = [
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.26",
  "mkdocs-gen-files>=0.5",
]

[project.scripts]
aes = "agentic_engineering_system.cli:main"
# Lockstep, the planning-and-checking tool (proposals/one-planning-tool/DESIGN.md).
# pcw and pcw-hook are its old names, kept so lifelike and Team-Brains' runner keep working.
lockstep = "lockstep.check:cli"
lockstep-hook = "lockstep.hook:main"
pcw = "lockstep.check:cli"
pcw-hook = "lockstep.hook:main"
# The merge command (moved from scripts/ship.py on 2026-11-20 so uvx installs it from the public repository).
ship = "lockstep.ship:main"

# Registers the `req` marker in any project that installs Lockstep (ported from code2check).
[project.entry-points.pytest11]
lockstep = "lockstep.checks.plugin"

[tool.setuptools.packages.find]
where = ["src"]

# The prior-art record schema ships beside lockstep/prior_art.py.
[tool.setuptools.package-data]
lockstep = ["*.json"]

[tool.setuptools_scm]
# No tags yet: every commit builds as 0.1.devN+g<sha>, so a git-pinned consumer
# sees a new version on each pin bump and pip reinstalls. No fallback_version:
# a build without Git metadata must fail, not ship a version that never moves.
# Only version tags (v1.2.3) set the version; other tags, such as the docs-consolidation
# before-tags, must not (2026-11-11: one broke `uv sync`).
git_describe_command = "git describe --dirty --tags --long --match 'v[0-9]*'"

[tool.pytest.ini_options]
testpaths = ["tests"]
# a linked worktree shares the main checkout's venv; import this tree's source
pythonpath = ["src"]
markers = ["req(capability_scenario): source requirement and scenario exercised", "slow: end-to-end test taking tens of seconds; skipped by make check, run by make check-full"]

[tool.lockstep]
# Folders searched for `Implements:` lines (lockstep check trace and project); scripts/ holds the AES operations code.
source = ["src", "scripts"]
# Non-Python files whose comment lines (`# Implements:`, `{# Implements: ... #}`) count as implementers: the template.
comment_sources = ["copier.yml", "template"]

# Mutation testing (mutmut): what code2-workspace scripts/mutation_report.py mutates each night and which tests it
# runs. Only src/lockstep: scripts/ is imported by its tests through a sys.path change, which mutmut cannot follow.
# Tests run in mutmut's copy (mutants/), which is not a git checkout; the deselected ones need git or installed hooks.
[tool.mutmut]
paths_to_mutate = ["src/lockstep/"]
# its own tests (tests/lockstep/test_lockstep_layout_plan.py) need git, so they are deselected below and its
# mutants would all look untested
do_not_mutate = ["src/lockstep/layout_plan.py"]
pytest_add_cli_args_test_selection = ["tests/lockstep/"]
pytest_add_cli_args = [
  "-m", "not slow", "-p", "no:cacheprovider",
  "--deselect", "tests/lockstep/checks/test_lockstep_check_plugin.py::test_plugin_and_the_ini_marker_can_both_register",
  "--deselect", "tests/lockstep/checks/test_lockstep_doc_projection.py::test_installed_post_edit_hook_refreshes_and_precommit_rejects_stale",
  "--deselect", "tests/lockstep/test_aes_plans_every_file.py",
  "--deselect", "tests/lockstep/test_lockstep_governs_its_own_package.py",
  "--deselect", "tests/lockstep/test_lockstep_layout_plan.py",
  "--deselect", "tests/lockstep/test_lockstep_plan_run.py::test_hidden_tests_outside_worktree_until_last_commit",
  "--deselect", "tests/lockstep/test_lockstep_plan_run.py::test_hidden_test_passing_before_is_flagged",
]
also_copy = ["src", "scripts", "tests", "lockstep.yaml", "openspec", "docs", "prompts", "Makefile"]
mutate_only_covered_lines = true
timeout_multiplier = 3.0
