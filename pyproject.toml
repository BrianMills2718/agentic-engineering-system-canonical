[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-system"
dynamic = ["version"]
description = "Canonical Agentic Engineering System"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "ruamel.yaml>=0.18,<0.20",
]

[project.scripts]
aes-repo-context = "agentic_engineering_system.repository_context.cli:main"
aes = "agentic_engineering_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# No tags yet: every commit builds as 0.1.devN+g<sha>, so a git-pinned consumer
# sees a new version on each pin bump and pip reinstalls. No fallback_version:
# a build without Git metadata must fail, not ship a version that never moves.

[tool.pytest.ini_options]
testpaths = ["tests"]
# a linked worktree shares the main checkout's venv; import this tree's source
pythonpath = ["src"]
