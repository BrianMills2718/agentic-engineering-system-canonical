seams:
  - id: normative_to_code
    participants: [planning, normative_context, repository_context]
    clauses: [AES-CTX-002, AES-CONTRACT-001]
    contract_status: proposed_obligation_not_frozen_schema
    obligation: >
      Bind accepted clauses to declared code locations; resolve exact wording at each
      symbol without rewriting it. Missing bindings are visible, not silently omitted.
    planned_check: tests/normative_context/test_context.py
  - id: planning_to_provider
    participants: [planning, capability_sourcing, execution, policy_control]
    clauses: [AES-CAP-001, AES-CAP-002, AES-PLAN-002, AES-SYS-002]
    contract_status: proposed_obligation_not_frozen_schema
    obligation: >
      Provider selection precedes freezing provider-dependent local APIs.
      Selecting machinery does not transfer policy, plan, or claim authority.
    planned_check: tests/planning/test_handoff.py
  - id: observation_to_gap
    participants: [execution, policy_control, evidence_assessment, gap_reconciliation]
    clauses: [AES-POL-002, AES-EVID-001, AES-PLAN-003]
    contract_status: proposed_obligation_not_frozen_schema
    obligation: >
      ERROR, absent evidence, insufficient evidence, and STALE remain explicit through
      composition. A successful command or completed plan cannot alone close a gap.
    planned_check: tests/gap_reconciliation/test_reconcile.py
  - id: learning_to_intent
    participants: [learning, planning, normative_context, capability_sourcing]
    clauses: [AES-LEARN-001, AES-SYS-002]
    contract_status: proposed_obligation_not_frozen_schema
    obligation: proposals_return_to_native_authorities_and_do_not_self_accept
    planned_check: tests/learning/test_feedback.py

decision_sequence:
  - id: BP-D1
    status: proposed
    aqrs: [AQR-001, AQR-002, AQR-009, AQR-010, AQR-011]
    recommendation: >
      Trial a compact system record plus one component-local record, referencing current
      Markdown authority during migration. Use optional sections instead of a file taxonomy.
    next_test: one_real_code_location_with_verbatim_system_component_and_seam_context
  - id: BP-D2
    status: proposed
    aqrs: [AQR-003, AQR-004, AQR-005, AQR-007, AQR-008, AQR-012]
    recommendation: >
      Treat Component as a scoped planning label, not a universal runtime class.
      Type consequential boundaries and verify real producer/consumer examples; derive
      internal symbols and effective applicability. Structural green is not semantic proof.
    next_test: typed_boundary_positive_negative_and_joint_rule_examples_in_the_pilot
  - id: BP-D3
    status: proposed
    aqrs: [AQR-006]
    recommendation: >
      Trial the AES profile locally using existing Company Planning guidance before any
      upstream edit or fork. Propose only demonstrated generic improvements upstream.
    fork_trigger: sustained_incompatibility_that_cannot_be_expressed_by_a_small_profile
    extension_mechanism: unverified
    next_test: bounded_design_output_contains_the_required_bindings_without_new_document_sprawl

next_bounded_dogfood:
  classification: design_validation_probe_not_Slice1_delivery
  subject: repository_context
  exact_code_source: resolver
  example_symbol: RepositoryContextResolver.resolve
  native_check_source: resolver_tests
  native_check_symbol: test_malformed_authoritative_manifest_blocks_legacy_fallback
  materialization_stage: proposed_not_executed
  behavior_to_observe: >
    From the real code location, obtain verbatim applicable clauses and Plan 001 criteria,
    follow the native check, and see an explicit error when a referenced clause is removed
    or changed. Prove declared-context preservation before adding other component machinery.
  disposition_after_probe: >
    Record findings against BP-D1/BP-D2, then use the chosen layout to materialize the
    full reserved tree. Unresolved areas may have labeled placeholders; they need no
    invented class signatures. Provider adoption and behavioral implementation stay separate.
  exclusions:
    - modifying_or_merging_PR5
    - creating_human_presentation_artifacts
    - modifying_Data_Contracts_Company_Planning_or_AC17
    - selecting_OPA_TOSCA_OWS_SCIP_or_attestation_dependencies
    - claiming_all_semantics_are_verified_by_a_valid_YAML_file
