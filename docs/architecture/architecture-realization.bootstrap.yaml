record_layout_proposal:
  status: proposed_not_migrated
  system_home: docs/architecture/system.yaml
  component_home_rule: src/agentic_engineering_system/<component>/component.yaml
  component_code_rule: >
    Start compactly with one implementation module where coherent. Keep existing
    repository_context files and imports unchanged. Split on semantic or engineering need,
    not an arbitrary line count, one-function-per-file rule, or forced single-file limit.
  authored_sections:
    system: [goal_or_north_star, product_outcomes, journeys, system_requirements, seams]
    component: [purpose, requirements, source_refs, boundary_refs, code_homes, verification_obligations]
  optional_sections: [questions, risks, assumptions, examples, operational_constraints]
  existing_records:
    research: research/
    durable_decisions: docs/decisions/
    change_plans: docs/plans/
    observations: evidence/
  rules:
    - Existing accepted Markdown remains authoritative until an explicit migration decision.
    - New structured prose is authored once; native typed contracts are referenced, not redefined in YAML.
    - PRD, requirements, architecture, and journey are possible views or sections, not mandatory new files.
    - Questions and research are not normative decisions; proposed decisions remain proposed.
    - A future accepted move must preserve clause IDs and wording and retire the old authoritative location atomically.
  blocked_by: [AQR-001, AQR-002, AQR-009, AQR-010, AQR-011]

normative_binding_proposal:
  status: proposed
  references: exact_snapshot_plus_path_plus_clause_id_or_native_selector
  rendering: verbatim_normative_text_with_source_identity
  source_of_text: native_source_not_alignment_foundation_paraphrases
  shared_context:
    clauses: [AES-SYS-002, AES-SYS-003, AES-SYS-004, AES-SYS-005, AES-CAP-002, AES-CONTRACT-001, AES-POL-002, AES-ECON-001]
    source: system
  effective_context_rule: >
    Explicitly declared component membership determines applicability. Each symbol can
    resolve shared clauses plus component clauses plus incident seam obligations plus
    any explicit symbol-specific obligations. No inference from an undeclared directory name.
  inheritance_limit: >
    Applicability is not proof that every symbol implements or satisfies every clause.
    Do not propagate component-level PASS to individual symbols. Binding and behavioral
    adequacy are separate assertions.
  cross_scope_conflicts: expose_and_route_to_AQR_or_accepted_exception_never_silently_override
  componentization: capability_to_component_many_to_many_with_named_responsibility
  context_completeness: >
    Pilot against the complete small normative baseline, not a lossy summarizer.
    Mechanical coverage proves declared applicability only; missing semantic relationships
    still require independent review and behavioral evidence.
  blocked_by: [AQR-003, AQR-004, AQR-005, AQR-008, AQR-012]

state_rules:
  declaration: proposed
  default_source_status: reserved_not_materialized
  default_verification_status: not_run
  default_utility_status: not_observed
  existing_implementation: >
    PR5 is a different snapshot from this research branch. Presence there is recorded
    below; this blueprint does not claim that main or PR6 contains that implementation.
  no_linear_promotion: >
    Planned, stubbed, implemented, verified, and useful are not one interchangeable
    status ladder. Keep declaration, realization, technical evidence, and utility separate.

