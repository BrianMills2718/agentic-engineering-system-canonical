    One compact blueprint aligns component responsibility, source sections, code homes,
    important typed boundaries, and verification obligations. System goals and journeys
    remain visible without requiring one separately authored document per document type.
  draft_gap:
    basis: [alignment, system, resolver, models, resolver_tests]
    variance: >
      The current record enumerates directions and AQRs but lacks component-to-code bindings.
      The inspected implementation files do not yet carry generated normative blocks.
    related_historical_gap_ids: [GAP-AES-005, GAP-AES-007, GAP-AES-015, GAP-AES-016]
    disposition: bounded_design_before_new_implementation
