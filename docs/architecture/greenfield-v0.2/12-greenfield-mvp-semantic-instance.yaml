# Accepted AES v0.2 greenfield architecture. Plain copy of proposals/aes-v0.2-greenfield/12-greenfield-mvp-semantic-instance.candidate.yaml
# (copied, not git mv'd, so the proposal lineage stays in place), accepted by Decision 0010
# (2026-09-25). For AES canonical, .aes/target.yaml is the live authority: where this file and
# the target disagree, this file is wrong. `accepted_amendments` lists what changed from the candidate.
# File names below that are not in this directory refer to proposals/aes-v0.2-greenfield/ (proposal lineage).
schema_version: aes.v0_2.semantic_instance.v0
status: accepted
accepted_by: docs/decisions/0010-greenfield-v0.2-accepted.md
source_proposal: proposals/aes-v0.2-greenfield/12-greenfield-mvp-semantic-instance.candidate.yaml
subject: AES-v0.2-Greenfield-MVP
model: 02-semantic-model.yaml

stage: accepted_target_and_planning_analysis_realized_on_aes_canonical
nonclaim: >
  This instance states the accepted Greenfield-MVP product target (outcome,
  GF-REQ items, SC-GF criteria and evidence requirements) plus the
  failure-mode/capability analysis behind it. It does not itself select
  realization; that selection now exists elsewhere. Realization units, planned
  artifacts, selected symbol commitments, verification subjects and
  provider/mechanism boundaries are accepted in
  docs/architecture/greenfield-v0.2/20-realization-topology.yaml, and for AES
  canonical are live in .aes/target.yaml (components RU-AES-*, planned_artifacts
  with `exports` as the symbol commitments, verification_subjects,
  external_boundaries), with accepted plans under .aes/plans/ and the
  implementation in src/agentic_engineering_system/. The empty families below
  are therefore not restated here, not unselected. The live target copies the
  outcome, GF-REQ-001..009 and SC-GF-001..009 texts from this file
  (whitespace-normalized) and adds NI-AES-HIST, an AES-canonical-only
  constraint on retained v0.1 code that is not part of this product target.
  The failure_modes and capability_requirements are analysis only: the live
  target carries neither family, and its components and planned artifacts
  cite the GF-REQ/SC-GF item a capability serves instead of CAP-GF-* ids.

outcomes:
  - id: OUT-GF-001
    statement: >
      A colleague can start a genuinely new software project under AES governance,
      move from accepted intent through planned realization and implementation to
      evidence-backed current/gap state, and do so without access to private
      historical repositories or undocumented AES lineage knowledge.
    actor_or_consumer: software_engineer_or_engineering_agent
    non_goals:
      - retrofit_arbitrary_existing_repository
      - universal_language_support
      - universal_framework_abstraction
      - organization_portfolio_orchestration

normative_items:
  - id: GF-REQ-001
    kind: constraint
    outcome_refs: [OUT-GF-001]
    statement: >
      The supported AES distribution and its required dependencies must be
      obtainable and documented without access to Brian's private historical
      repositories.

  - id: GF-REQ-002
    kind: behavior
    outcome_refs: [OUT-GF-001]
    statement: >
      Before governed implementation begins, AES must represent accepted
      normative obligations, success/disproof semantics, and what evidence is
      capable of establishing each exercised criterion.

  - id: GF-REQ-003
    kind: invariant
    outcome_refs: [OUT-GF-001]
    statement: >
      Every durable governed repository artifact must be justified by an accepted
      exact planned path or a bounded accepted artifact-generation rule.

  - id: GF-REQ-004
    kind: behavior
    outcome_refs: [OUT-GF-001]
    statement: >
      AES planning must derive accepted capability requirements, realization
      boundaries, durable repository topology, selected load-bearing symbol
      commitments where needed, and criterion-linked verification topology before
      governed execution of those commitments.

  - id: GF-REQ-005
    kind: behavior
    outcome_refs: [OUT-GF-001]
    statement: >
      The working context for a governed subject must contain the full applicable
      normative, success and disproof meaning with provenance rather than requiring
      the acting agent to dereference identifiers before understanding its
      obligations.

  - id: GF-REQ-006
    kind: behavior
    outcome_refs: [OUT-GF-001]
    statement: >
      AES must produce revision-bound structured characterization of the realized
      repository sufficient to compare accepted artifact and selected
      symbol/signature/type commitments with realized state.

  - id: GF-REQ-007
    kind: invariant
    outcome_refs: [OUT-GF-001]
    statement: >
      Observation result, evidence freshness, evidence adequacy, qualified current,
      gap, and plan completion must remain semantically distinct.

  - id: GF-REQ-008
    kind: behavior
    outcome_refs: [OUT-GF-001]
    statement: >
      AES must derive qualified current state and gap state from accepted target
      plus revision-bound realized observations and evidence assessments, preserving
      missing, stale, error, contradictory and insufficient-evidence conditions
      rather than rendering them green.

  - id: GF-REQ-009
    kind: constraint
    outcome_refs: [OUT-GF-001]
    statement: >
      Greenfield-MVP acceptance must be established on a genuinely fresh consumer
      project governed by AES from inception; success on AES canonical's existing
      repository alone is insufficient.

success_criteria:
  - id: SC-GF-001
    target_refs: [OUT-GF-001, GF-REQ-001]
    statement: >
      A fresh user with no access to Brian's other private repositories can
      install/configure the supported AES distribution and initialize a new
      governed project using only distributed material and declared dependencies.
    disproof: >
      Successful initialization requires copying undeclared files, private-repo
      access, or undocumented historical knowledge.
    evidence_requirements:
      - id: ER-SC-GF-001-01
        kind: runtime_observation
        requirement: >
          A clean-user run from the supported distribution and documented
          dependencies reaches initialized governed-project state without private
          repository access.

  - id: SC-GF-002
    target_refs: [GF-REQ-002]
    statement: >
      Before governed implementation, every exercised normative item is linked to
      explicit success/disproof semantics and each exercised criterion states what
      evidence can establish it.
    disproof: >
      An implemented obligation exists only in conversation, code, or an unowned
      checklist, or a criterion has no evidence requirement.
    evidence_requirements:
      - id: ER-SC-GF-002-01
        kind: deterministic_test
        requirement: >
          Validate the accepted target model for resolvable normative-to-criterion
          and criterion-to-evidence-requirement links.

  - id: SC-GF-003
    target_refs: [GF-REQ-003, GF-REQ-004]
    statement: >
      The accepted realization topology accounts for every durable governed
      artifact by exact path or bounded accepted generation rule and gives every
      artifact a semantic purpose.
    disproof: >
      A durable governed artifact can exist without an accepted exact path,
      applicable bounded generation rule, or semantic justification.
    evidence_requirements:
      - id: ER-SC-GF-003-01
        kind: deterministic_test
        requirement: >
          A repository-topology check rejects an intentionally introduced orphan
          durable artifact.
      - id: ER-SC-GF-003-02
        kind: deterministic_test
        requirement: >
          The same check accepts the unchanged planned topology and correctly
          handles at least one bounded generation rule if the authentic consumer
          naturally requires such a rule.

  - id: SC-GF-004
    target_refs: [GF-REQ-004]
    statement: >
      Before governed execution, each exercised evidence requirement is mapped to
      a concrete verification subject or an explicit external/human observation
      boundary.
    disproof: >
      Implementation starts while an exercised criterion has no concrete route to
      obtaining its required evidence.
    evidence_requirements:
      - id: ER-SC-GF-004-01
        kind: deterministic_test
        requirement: >
          Validate criterion evidence requirements against the accepted
          verification topology.

  - id: SC-GF-005
    target_refs: [GF-REQ-005]
    statement: >
      A fresh implementing agent receives the complete applicable normative,
      success and disproof text with provenance in the bounded working context for
      the selected subject.
    disproof: >
      The context exposes only identifiers/links, omits a load-bearing obligation,
      or requires broad repository archaeology before the agent can understand
      what must be preserved.
    evidence_requirements:
      - id: ER-SC-GF-005-01
        kind: deterministic_test
        requirement: >
          Generated/projected context contains exact applicable semantic text and
          provenance for the selected governed subject.
      # Re-scoped 2026-09-25 (24-pre-probe-decisions.md sections 18 and 20; accepted
      # on AES canonical as PLAN-AES-RESCOPE-CONTEXT-AB). Was: "A fresh-agent
      # comparison shows whether bounded projected context reduces reconstruction
      # cost and missed obligations on one real change." Two runs could not
      # distinguish the arms; that discovery claim is recorded as not established.
      - id: ER-SC-GF-005-02
        kind: runtime_observation
        requirement: >
          A fresh-agent comparison on one real change, scored against a pre-registered
          sheet, is run and retained at exact revisions with its verdict either way;
          two such runs (probe 0 on whygame5 at ~300 lines, phase 6 on AES itself at
          ~4,000 governed lines) are the minimum.

  - id: SC-GF-006
    target_refs: [GF-REQ-006]
    statement: >
      At an exact revision AES characterizes the realized repository and
      mechanically detects missing/undeclared durable artifacts plus selected
      symbol/signature/type drift when such commitments exist.
    disproof: >
      Target-realized comparison requires manual reconstruction of repository
      contents or silently accepts an intentional drift.
    evidence_requirements:
      - id: ER-SC-GF-006-01
        kind: deterministic_test
        requirement: >
          Deliberately mutate one planned artifact or selected symbol commitment
          and observe a target-realized mismatch.
      - id: ER-SC-GF-006-02
        kind: deterministic_test
        requirement: >
          Characterization binds every asserted realized fact to exact repository
          revision and producer identity.

  - id: SC-GF-007
    target_refs: [GF-REQ-007, GF-REQ-008]
    statement: >
      A pass-like observation with insufficient required evidence does not render
      the associated criterion satisfied or its gap closed.
    disproof: >
      Any passing test automatically produces criterion satisfaction regardless
      of the criterion's evidence requirements.
    evidence_requirements:
      - id: ER-SC-GF-007-01
        kind: deterministic_test
        requirement: >
          Construct a criterion requiring multiple evidence inputs, provide only
          one passing observation, and verify adequacy remains INSUFFICIENT and
          standing is not promoted to supported closure.

  - id: SC-GF-008
    target_refs: [GF-REQ-007, GF-REQ-008]
    statement: >
      Material change to an evidence dependency invalidates or stales affected
      evidence/current state until applicable evidence is re-established.
    disproof: >
      A materially changed subject can retain green current/gap state solely
      because older evidence once passed.
    evidence_requirements:
      - id: ER-SC-GF-008-01
        kind: deterministic_test
        requirement: >
          Change one material dependency after successful verification and verify
          affected evidence/current becomes stale or otherwise non-current before
          re-verification.

  - id: SC-GF-009
    target_refs: [GF-REQ-009, OUT-GF-001]
    statement: >
      One complete Greenfield-MVP lifecycle is exercised on a genuinely new
      consumer project under AES governance from inception.
    disproof: >
      Acceptance relies only on AES canonical's existing repository, schemas,
      fixtures, prose review, or a pre-existing project requiring retrofit.
    evidence_requirements:
      - id: ER-SC-GF-009-01
        kind: runtime_observation
        requirement: >
          Retain the fresh project's initialization, target, plan, realization,
          observations/evidence, current/gap and fresh-agent context evaluation at
          exact revisions.

failure_modes:
  - id: FM-GF-001
    statement: AES appears distributable but secretly depends on private historical infrastructure.
    consequence: Colleagues cannot reproduce or use the supported lifecycle.
    threatens_refs: [OUT-GF-001, GF-REQ-001, SC-GF-001]
    responses:
      - id: FMR-GF-001-PREVENT
        role: prevent
        required_response_refs: [CAP-GF-INIT]
      - id: FMR-GF-001-DETECT
        role: detect
        required_response_refs: [SC-GF-001]

  - id: FM-GF-002
    statement: Implementation accumulates durable files not justified by accepted topology.
    consequence: Repository structure drifts away from accepted engineering intent.
    threatens_refs: [GF-REQ-003, SC-GF-003]
    responses:
      - id: FMR-GF-002-PREVENT
        role: prevent
        required_response_refs: [CAP-GF-TOPOLOGY]
      - id: FMR-GF-002-DETECT
        role: detect
        required_response_refs: [SC-GF-003]

  - id: FM-GF-003
    statement: Agent receives IDs or links but not the governing semantic text.
    consequence: Agent acts from incomplete context or spends effort reconstructing obligations.
    threatens_refs: [GF-REQ-005, SC-GF-005]
    responses:
      - id: FMR-GF-003-PREVENT
        role: prevent
        required_response_refs: [CAP-GF-CONTEXT]
      - id: FMR-GF-003-DETECT
        role: detect
        required_response_refs: [SC-GF-005]

  - id: FM-GF-004
    statement: A passing verification result is confused with sufficient current evidence.
    consequence: Unsupported target state is rendered green and gaps close falsely.
    threatens_refs: [GF-REQ-007, GF-REQ-008, SC-GF-007]
    responses:
      - id: FMR-GF-004-PREVENT
        role: prevent
        required_response_refs: [CAP-GF-EVIDENCE]
      - id: FMR-GF-004-DETECT
        role: detect
        required_response_refs: [SC-GF-007]

  - id: FM-GF-005
    statement: Greenfield acceptance is accidentally established using retrofit assumptions.
    consequence: AES claims a product capability outside the evidence actually obtained.
    threatens_refs: [GF-REQ-009, SC-GF-009]
    responses:
      - id: FMR-GF-005-PREVENT
        role: prevent
        required_response_refs: [SC-GF-009]

capability_requirements:
  - id: CAP-GF-INIT
    statement: Initialize a fresh AES-governed project from the supported distribution.
    target_refs: [GF-REQ-001, SC-GF-001, FMR-GF-001-PREVENT]

  - id: CAP-GF-TARGET
    statement: Represent and validate accepted outcomes, normative items, criteria and evidence requirements.
    target_refs: [GF-REQ-002, SC-GF-002]

  - id: CAP-GF-PLANNING
    statement: Derive accepted realization and verification topology from target/current/gaps and engineering analysis.
    target_refs: [GF-REQ-004, SC-GF-004]

  - id: CAP-GF-TOPOLOGY
    statement: Materialize and assess durable repository topology against exact paths and bounded generation rules.
    target_refs: [GF-REQ-003, SC-GF-003, FMR-GF-002-PREVENT]

  - id: CAP-GF-CONTEXT
    statement: Project smallest complete subject-specific working context with full semantic text and provenance.
    target_refs: [GF-REQ-005, SC-GF-005, FMR-GF-003-PREVENT]

  - id: CAP-GF-CHARACTERIZE
    statement: Produce revision-bound structured characterization of realized repository state.
    target_refs: [GF-REQ-006, SC-GF-006]

  - id: CAP-GF-EVIDENCE
    statement: Assess observation freshness, adequacy and standing against criterion evidence requirements.
    target_refs: [GF-REQ-007, GF-REQ-008, SC-GF-007, SC-GF-008, FMR-GF-004-PREVENT]

  - id: CAP-GF-RECONCILE
    statement: Derive qualified current and target/current gaps without using plan completion as closure evidence.
    target_refs: [GF-REQ-008, SC-GF-007, SC-GF-008]

provider_bindings: []
realization_units: []
planned_artifacts: []
artifact_generation_rules: []
planned_symbol_commitments: []
verification_subjects: []
plans: []

planning_frontier: []
planning_frontier_resolution:
  provider_bindings: >
    Selected as the first Python/Git source provider (characterize_python.py,
    ART-SRC-CHARACTERIZE-PYTHON) and the mechanism boundaries in
    20-realization-topology.yaml provider_and_mechanism_boundaries; the live
    target has no provider_bindings family.
  realization_units: selected; 20-realization-topology.yaml realization_units, live as .aes/target.yaml components RU-AES-*.
  repository_materialization: >
    Selected; exact-path planned_artifacts in 20-realization-topology.yaml and
    .aes/target.yaml, enforced by `aes topology check` and the pre-commit hook.
    Bounded artifact-generation rules are not realized in the v0.2 MVP
    (topology.py: "not implemented: the first consumer has no file that needs one").
  verification_subjects: selected; one per test file in .aes/target.yaml verification_subjects, plus external_boundaries for ER-SC-GF-001-01, ER-SC-GF-005-02 and ER-SC-GF-009-01.
  first_authentic_greenfield_consumer: selected; BrianMills2718/whygame5, governed by AES from its first commit (24-pre-probe-decisions.md section 2).

accepted_amendments:
  - change: >
      Evidence kinds mapped to the loader vocabulary: ER-SC-GF-002-01,
      ER-SC-GF-004-01 and ER-SC-GF-006-02 contract_validation -> deterministic_test;
      ER-SC-GF-001-01, ER-SC-GF-005-02 and ER-SC-GF-009-01
      external_consumer_observation -> runtime_observation. Ids and requirement
      texts unchanged.
    reason: >
      The target loader has only deterministic_test, runtime_observation and
      human_review; the kinds were mapped rather than widened, and
      .aes/target.yaml carries the mapped kinds.
    source: 24-pre-probe-decisions.md section 17 item 4; src/agentic_engineering_system/records.py:53; .aes/target.yaml success_criteria
  - change: >
      stage and nonclaim rewritten: the instance no longer claims that
      realization is unselected; it points to 20-realization-topology.yaml and
      .aes/target.yaml for the realized units, topology and verification, notes
      NI-AES-HIST as a target-only item, and states that failure_modes and
      capability_requirements are analysis the live target does not carry.
    reason: >
      AES canonical now has ten realized RU-AES-* components, planned artifacts,
      verification subjects and accepted plans; CAP-GF-* justification refs
      were mapped to the GF-REQ items each capability serves because
      capabilities are not a target family.
    source: 24-pre-probe-decisions.md sections 17 (items 3-4) and 20; .aes/target.yaml; .aes/plans/
  - change: >
      planning_frontier emptied and planning_frontier_resolution added, naming
      where each formerly unselected item was selected; bounded
      artifact-generation rules marked not realized in the v0.2 MVP.
    reason: >
      All five frontier items were selected (first consumer whygame5; units,
      topology and verification in file 20 and the live target). topology.py
      does not implement generation rules.
    source: 24-pre-probe-decisions.md sections 2, 8 and 17; src/agentic_engineering_system/topology.py:17-18
