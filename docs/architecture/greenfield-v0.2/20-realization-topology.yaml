# Accepted AES v0.2 greenfield architecture. Plain copy of proposals/aes-v0.2-greenfield/20-realization-topology.candidate.yaml
# (copied, not git mv'd, so the proposal lineage stays in place), accepted by Decision 0010
# (2026-09-25). For AES canonical, .aes/target.yaml is the live authority: where this file and
# the target disagree, this file is wrong. `accepted_amendments` lists what changed from the candidate.
# File names below that are not in this directory refer to proposals/aes-v0.2-greenfield/ (proposal lineage).
schema_version: aes.v0_2.realization_topology.v1
status: accepted
accepted_by: docs/decisions/0010-greenfield-v0.2-accepted.md
source_proposal: proposals/aes-v0.2-greenfield/20-realization-topology.candidate.yaml
basis:
  - 12-greenfield-mvp-semantic-instance.yaml
  - 15-planning-contract.yaml
  - 18-provider-evaluation-round-1.md
  - 19-provider-evaluation-round-2-generic-dependencies.md

# Since roadmap phase 6b (2026-09-25) the live authority for AES canonical's own
# topology is `.aes/target.yaml` (accepted through `aes plan accept
# PLAN-AES-SELF-GOVERN`, then PLAN-AES-RESCOPE-CONTEXT-AB and
# PLAN-AES-ARCHIVE-V01-PLACEHOLDERS). As of phase 7b this file matches the
# target's `components`, `planned_artifacts`, `verification_subjects` and
# `external_boundaries` entry for entry (ids, paths, kinds, justification refs,
# exports); the target's vocabulary is used throughout (24-pre-probe-decisions.md
# section 17 item 4). The four test fixtures and the nine retained v0.1 files are
# listed in their own sections below (fixture_artifacts, retained_v0_1_artifacts). What changed from the candidate is in
# `accepted_amendments` at the end.
purpose: >
  Accepted exact implementation, distribution and verification topology for the
  AES v0.2 Greenfield MVP itself, as realized. For AES canonical the live target
  authority is .aes/target.yaml; this document is the accepted architecture
  description of that topology and must not contradict it.

package_strategy:
  python_distribution: agentic-engineering-system
  python_package: agentic_engineering_system
  rationale: >
    Keep the existing public product/package identity rather than creating a
    version-numbered Python namespace. Existing v0.1 package contents do not
    automatically become v0.2 target merely because they share the package.
  first_supported_project_ecosystem: python_git
  cli: aes
  legacy_cli: aes-repo-context
  final_legacy_cli_disposition: >
    retained: the aes-repo-context console script stays installed from the
    retained repository_context/ package (pyproject.toml [project.scripts]),
    under NI-AES-HIST; it carries no v0.2 obligation.

transition_and_cutover:
  pre_cutover_probe_coexistence:
    allowed: true
    meaning: >
      Bounded implementation probes may temporarily coexist with v0.1 runtime
      artifacts on a branch while v0.1 remains current accepted architecture.
      (Historical: this is how v0.2 was built; phases 0-7a ran under it.)
  final_v0_2_working_tree:
    rule: >
      Historical v0.1 runtime machinery has no automatic right to remain. Before
      v0.2 cutover, every pre-existing durable runtime/governance artifact must be
      explicitly retained as a v0.2 artifact, retained as historical evidence
      with a justified live-tree purpose, or removed with history preserved by
      Git.
    repository_context_disposition: >
      retained (NI-AES-HIST): src/agentic_engineering_system/repository_context/
      (nine files; installed console script aes-repo-context, tested by
      tests/repository_context/, which is outside the governed roots) and the
      package __init__.py stay in the live tree, each a planned artifact
      justified by NI-AES-HIST only, so the no-orphan rule holds. Changing them
      is v0.1 maintenance, not v0.2 work.
    broader_v0_1_governance_mechanism_disposition: >
      dispositioned by aes plan accept PLAN-AES-ARCHIVE-V01-PLACEHOLDERS (phase
      7a): the eight empty v0.1 component placeholders (capability_sourcing,
      evidence_assessment, execution, gap_reconciliation, learning,
      normative_context, planning, policy_control; each only a
      component.placeholder.yaml) were git mv'd with history to
      archive/v0.1-placeholders/ (historical, outside the governed roots) and
      their ART-V01-* entries removed from the target.
  dependency_consequence:
    pyyaml: >
      PyYAML (pinned 6.0.3) remains a declared dependency because the retained
      v0.1 repository_context/manifest.py imports yaml. No v0.2 module imports
      it; it is not part of the Greenfield semantic-core dependency set.
    ruamel_yaml: >
      Realized parser for v0.2 canonical AES YAML records (records.py,
      project.py, planning.py, evidence.py; declared ruamel.yaml>=0.18,<0.20).
  cutover_gate: >
    Do not claim final v0.2 repository conformance while undispositioned v0.1
    durable artifacts remain outside the accepted v0.2 topology.

realization_units:
  - id: RU-AES-RECORDS
    target_refs: [GF-REQ-002, SC-GF-002]
    responsibility: >
      Own typed AES record models, strict YAML loading/writing, stable semantic
      reference resolution and structural/semantic validation of canonical project
      records.
    planned_artifact_refs:
      - ART-SRC-RECORDS
      - ART-TEST-RECORDS

  - id: RU-AES-PROJECT
    target_refs: [GF-REQ-001, SC-GF-001]
    responsibility: >
      Initialize and open the minimal .aes project control surface under the accepted
      initialization contract without creating placeholder artifacts.
    planned_artifact_refs:
      - ART-SRC-PROJECT
      - ART-TEST-PROJECT

  - id: RU-AES-PLANNING
    target_refs: [GF-REQ-004, SC-GF-004]
    responsibility: >
      Represent, validate and project the AES planning contract: target-realization
      deltas, accepted transition plans, uncertainty/probe semantics and
      criterion-linked verification topology.
    planned_artifact_refs:
      - ART-SRC-PLANNING
      - ART-PLANNING-PROTOCOL
      - ART-TEST-PLANNING

  - id: RU-AES-TOPOLOGY
    target_refs: [GF-REQ-003, SC-GF-003]
    responsibility: >
      Compare accepted durable topology and bounded generation rules with the
      Git-realized repository and emit actionable conformance findings.
    planned_artifact_refs:
      - ART-SRC-TOPOLOGY
      - ART-TEST-TOPOLOGY
      - ART-TEST-SELF-GOVERNANCE

  - id: RU-AES-CHARACTERIZE
    target_refs: [GF-REQ-006, SC-GF-006]
    responsibility: >
      Produce revision-bound realized-repository characterization for the first
      Python/Git ecosystem without importing target project code or inventing target
      mappings.
    planned_artifact_refs:
      - ART-SRC-CHARACTERIZE
      - ART-SRC-CHARACTERIZE-PYTHON
      - ART-TEST-CHARACTERIZE

  - id: RU-AES-EVIDENCE
    target_refs: [GF-REQ-007, GF-REQ-008, SC-GF-007, SC-GF-008]
    responsibility: >
      Represent observations and compute evidence freshness, adequacy and standing
      independently from pass-like provider results.
    planned_artifact_refs:
      - ART-SRC-EVIDENCE
      - ART-TEST-EVIDENCE
      - ART-TEST-EVIDENCE-CONTROLS

  - id: RU-AES-RECONCILE
    target_refs: [GF-REQ-008, SC-GF-007, SC-GF-008]
    responsibility: >
      Derive qualified current state and target/current gaps from accepted target,
      realized characterization and evidence assessments.
    planned_artifact_refs:
      - ART-SRC-RECONCILE
      - ART-TEST-RECONCILE

  - id: RU-AES-CONTEXT
    target_refs: [GF-REQ-005, SC-GF-005]
    responsibility: >
      Compile the smallest complete subject-specific working context from typed target
      refs, realized state, current/gaps, plan and verification semantics.
    planned_artifact_refs:
      - ART-SRC-CONTEXT
      - ART-TEST-CONTEXT

  - id: RU-AES-CLI
    target_refs: [OUT-GF-001, GF-REQ-009, SC-GF-009]
    responsibility: >
      Expose one coherent user/agent command surface that composes the capability units
      without owning their semantics.
    planned_artifact_refs:
      - ART-SRC-CLI

  - id: RU-AES-DISTRIBUTION
    target_refs: [OUT-GF-001, GF-REQ-001, GF-REQ-009, SC-GF-001, SC-GF-009]
    responsibility: >
      Own the installable Python distribution boundary, declared dependencies, console
      entrypoints, packaged planning resource, Greenfield getting-started material and
      clean-install verification.
    planned_artifact_refs:
      - ART-PACKAGING-PYPROJECT
      - ART-DOC-GREENFIELD-GETTING-STARTED
      - ART-SRC-HOOKS
      - ART-TEST-DISTRIBUTION

