# The target has no selected-symbol family: symbol commitments are realized as
# name-only `exports` on the eleven v0.2 Python modules (planned_artifacts above),
# which `aes characterize` checks for drift. An export may also commit a signature
# (`name(args) -> ret`, characterize_python.parse_export), but none of the target's
# exports does, so no signature below is a live commitment. `planned_signature_or_type`
# is the candidate's plan, kept for lineage; `realized_as` is the code at phase 7b.
selected_symbol_commitments:
  - id: SYM-AES-PROJECT-INIT
    artifact_ref: ART-SRC-PROJECT
    native_name: initialize_project
    kind: function
    purpose: stable programmatic Greenfield initialization entrypoint
    target_refs: [GF-REQ-001]
    planned_signature_or_type: >
      def initialize_project(root: Path, *, project_id: str, outcome: str, actor: str,
      governed_roots: Sequence[str] = ("src/", "tests/"), architecture_line: str = "AES-v0.2",
      language: str = "python") -> InitResult
    realized_as: >
      as planned, plus a private test-only keyword `_stage_hook`; the architecture_line
      default is the module constant ARCHITECTURE_LINE. Committed in the target as the
      export name `initialize_project` only.

  - id: SYM-AES-RECORDS-LOAD
    artifact_ref: ART-SRC-RECORDS
    native_name: load_target
    kind: function
    purpose: strict canonical target loader and semantic validator entrypoint
    target_refs: [GF-REQ-002]
    planned_signature_or_type: >
      def load_target(path: Path) -> TargetRecord
    realized_as: >
      as planned. Committed in the target as the export name `load_target` only.

  - id: SYM-AES-TOPOLOGY-CHECK
    artifact_ref: ART-SRC-TOPOLOGY
    native_name: check_topology
    kind: function
    purpose: stable target-realized topology validation boundary
    target_refs: [GF-REQ-003]
    planned_signature_or_type: >
      def check_topology(project: ProjectState) -> TopologyReport
    realized_as: >
      def check_topology(root: Path) -> TopologyReport (no ProjectState type; it loads
      .aes/project.yaml under root). Export name `check_topology` only.

  - id: SYM-AES-CHARACTERIZE
    artifact_ref: ART-SRC-CHARACTERIZE
    native_name: characterize_repository
    kind: function
    purpose: stable realized-repository characterization boundary
    target_refs: [GF-REQ-006]
    planned_signature_or_type: >
      def characterize_repository(project: ProjectState) -> RepositoryCharacterization
    realized_as: >
      not realized under this name: the boundary is def characterize(root: Path) ->
      Characterization (with drift/check beside it). Export name `characterize`.

  - id: SYM-AES-EVIDENCE-ASSESS
    artifact_ref: ART-SRC-EVIDENCE
    native_name: assess_criterion
    kind: function
    purpose: stable criterion evidence-assessment boundary
    target_refs: [GF-REQ-007, GF-REQ-008]
    planned_signature_or_type: >
      def assess_criterion(criterion: SuccessCriterion, observations: Sequence[Observation], context: EvidenceContext) -> EvidenceAssessment
    realized_as: >
      not realized under this name: the boundary is def assess(root: Path) ->
      EvidenceReport, which assesses every criterion of the project's target. Export
      name `assess`.

  - id: SYM-AES-RECONCILE
    artifact_ref: ART-SRC-RECONCILE
    native_name: reconcile
    kind: function
    purpose: stable current/gap derivation boundary
    target_refs: [GF-REQ-008]
    planned_signature_or_type: >
      def reconcile(target: TargetRecord, realization: RepositoryCharacterization, assessments: Sequence[EvidenceAssessment]) -> ReconciliationResult
    realized_as: >
      def reconcile(root: Path) -> Reconciliation (loads target, characterization and
      assessments itself). Export name `reconcile` only.

  - id: SYM-AES-CONTEXT-PROJECT
    artifact_ref: ART-SRC-CONTEXT
    native_name: project_context
    kind: function
    purpose: stable governed-subject context projection boundary
    target_refs: [GF-REQ-005]
    planned_signature_or_type: >
      def project_context(project: ProjectState, subject: SubjectRef) -> WorkingContext
    realized_as: >
      def project_context(project_root: Path, subject: str) -> WorkingContext. Export
      name `project_context` only.

  - id: SYM-AES-CLI-MAIN
    artifact_ref: ART-SRC-CLI
    native_name: main
    kind: function
    purpose: stable installed aes console-entrypoint boundary
    target_refs: [OUT-GF-001, GF-REQ-001]
    planned_signature_or_type: >
      def main(argv: Sequence[str] | None = None) -> int
    realized_as: >
      as planned. Export name `main` only.

# One deterministic_test subject per test file, because `aes evidence record` runs a
# file (24 section 17 item 4). Local tests that route ER-SC-GF-001-01 are recorded
# INCONCLUSIVE: a local test is not the clean-user run the requirement names.
verification_subjects:
  - id: VS-GF-RECORDS
    criterion_refs: [SC-GF-002]
    evidence_requirement_refs: [ER-SC-GF-002-01]
    proof_kind: deterministic_test
    proof_role: direct
    locator: tests/greenfield/test_records.py
    purpose: >
      validate target structure, refs and criterion evidence declarations

  - id: VS-GF-INIT-UNIT
    criterion_refs: [SC-GF-001]
    evidence_requirement_refs: [ER-SC-GF-001-01]
    proof_kind: deterministic_test
    proof_role: direct
    locator: tests/greenfield/test_project.py
