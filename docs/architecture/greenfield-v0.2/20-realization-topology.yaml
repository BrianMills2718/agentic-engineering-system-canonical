# Externally established requirements are not verification subjects: the target
# routes them through external_boundaries, and the orchestrating session records
# one observation (evidence kind runtime_observation) per run.
external_boundaries:
  - evidence_requirement_ref: ER-SC-GF-001-01
    boundary: >
      A fresh agent or person with only docs/greenfield/GETTING_STARTED.md and a pin id
      installs AES from the distribution and reaches an initialized, validated project;
      the orchestrating session records the run as an observation. A no-private-access
      run additionally needs a machine without the maintainer's GitHub credentials,
      because this repository is private.

  - evidence_requirement_ref: ER-SC-GF-005-02
    boundary: >
      The orchestrator runs each fresh-agent comparison on one real change (arm A gets
      `aes context <subject>`, arm B the repository only, each in a separate session
      with no access to the planning conversation or proposals/), scores it on a sheet
      written before either arm's output is seen, retains the sheet, both arms' commits
      and the verdict at exact revisions, and records one observation assessing the
      retained runs against this requirement.

  - evidence_requirement_ref: ER-SC-GF-009-01
    boundary: >
      The orchestrator retains whygame5's lifecycle at exact revisions (init commit,
      target history, accepted plans, realization commits, observations, aes status
      output, fresh-agent context evaluation) and records one observation listing them;
      no test in this repository can establish it.

provider_and_mechanism_boundaries:
  planning_reasoning_provider:
    status: portable_protocol_boundary_defined
    invariant: >
      planning_protocol.md is distributed with AES and defines the provider-neutral
      reasoning contract; a human or agent provider may produce proposals without
      requiring private Company Planning access.
  commit_enforcement:
    status: git_pre_commit_adapter_realized
    invariant: >
      topology/record validators are directly runnable. A Git hook or agent hook
      may invoke them but is not the semantic implementation.
    realized_adapter: >
      hooks.py (`aes hooks install`) writes <root>/.githooks/pre-commit, which runs
      `aes target validate` and `aes topology check`, and sets the repository's
      local core.hooksPath (overriding a global one, which it reports). No CI
      adapter is selected.
  working_context_delivery:
    status: explicit_CLI_is_MVP_boundary
    invariant: >
      context.py owns projection content and aes context <subject> is the first
      supported delivery boundary. Native IDE/agent injection remains an adapter.

