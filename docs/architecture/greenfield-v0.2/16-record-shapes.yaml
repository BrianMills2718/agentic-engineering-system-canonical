# Accepted AES v0.2 greenfield architecture. Plain copy of proposals/aes-v0.2-greenfield/16-record-shapes.candidate.yaml
# (copied, not git mv'd, so the proposal lineage stays in place), accepted by Decision 0010
# (2026-09-25). For AES canonical, .aes/target.yaml is the live authority: where this file and
# the target disagree, this file is wrong. `accepted_amendments` lists what changed from the candidate.
# File names below that are not in this directory refer to proposals/aes-v0.2-greenfield/ (proposal lineage).
schema_version: aes.v0_2.record_shapes.v0
status: accepted
accepted_by: docs/decisions/0010-greenfield-v0.2-accepted.md
source_proposal: proposals/aes-v0.2-greenfield/16-record-shapes.candidate.yaml
materialization: 13-greenfield-materialization.md
semantic_model: 02-semantic-model.yaml
planning_contract: 15-planning-contract.yaml

principles:
  - record_shape_is_not_ontology
  - stable_semantic_ids_survive_storage_repartition
  - no_duplicate_mutable_relationship_facts
  - native_authorities_are_referenced_not_copied
  - exact_git_revision_binding_is_external_to_self_referential_authority_bytes

project_record:
  path: .aes/project.yaml
  purpose: operational_AES_adoption_configuration
  realized_model: records.ProjectRecord (strict; unknown fields rejected)
  fields:
    schema_version: required  # aes.v0_2.project.probe0 as written by aes init
    project_id: required
    aes:
      architecture_line: required
      distribution_version: required
      initialized_at: optional  # written by aes init; absent in hand-made projects
    governed_roots: required  # relative directories; the topology check's namespace (D1)
    materialization:  # every key required; aes init writes these defaults
      target_path: .aes/target.yaml
      plans_root: .aes/plans/
      observations_root: .aes/observations/
      generated_root: .aes/generated/  # named, but nothing writes there in the v0.2 MVP
    ecosystem:
      primary_language_or_runtime: required  # aes init --language, default python
  not_realized_in_v0_2_mvp:
    materialization.analysis_path: no analysis record exists; the strict model rejects the key
    ecosystem.supported_adapter_profile: no adapter profiles; the strict model rejects the key
    operational_provider_config_refs:
      purpose: >
        Reference non-normative operational provider configuration when needed.
        Accepted capability provider bindings remain in target authority.
      secrets_allowed_inline: false
      status: no provider configuration exists; the strict model rejects the key
  prohibited_semantic_content:
    - normative_items
    - success_criteria
    - accepted_provider_bindings
    - accepted_repository_topology
    - current
    - gaps
    - secrets

target_record:
  path: .aes/target.yaml
  purpose: canonical_accepted_target_for_Greenfield_MVP
  realized_model: records.TargetRecord (strict; unknown fields rejected)
  fields:
    schema_version: required  # aes.v0_2.target.probe0
    target_id: required
    outcomes: list  # {id, actor_or_consumer, statement, non_goals?, rationale?}
    normative_items: list  # {id, kind, outcome_refs, statement}
    success_criteria: list  # {id, statement, target_refs, disproof, evidence_requirements: [{id, kind, requirement}]}
    components: list  # {id, responsibility, target_refs, planned_artifact_refs}; the realization units (D3)
    planned_artifacts: list  # {id, locator: {exact_path}, kind, purpose, semantic_justification_refs, exports?}
    verification_subjects: list  # {id, criterion_refs, evidence_requirement_refs, proof_kind, proof_role, locator, purpose}
    external_boundaries: optional_list  # {evidence_requirement_ref, boundary}
  vocabularies:
    normative_item_kind: [constraint, behavior, invariant, quality]
    evidence_kind: [deterministic_test, runtime_observation, human_review]  # also verification_subjects.proof_kind
    artifact_kind: [source, test, configuration]
    proof_role: [direct, negative_control]
    mapping_rule: >
      Kinds outside these lists are mapped, not added: contract_validation ->
      deterministic_test, external_consumer_observation -> runtime_observation,
      normative_authority -> source, documentation -> configuration, supporting ->
      direct; CAP-GF-* justification refs name the GF-REQ item the capability serves.
  not_realized_in_v0_2_mvp:
    capability_requirements: not a target family
    provider_bindings: not a target family
    artifact_generation_rules: not realized (every planned artifact has an exact_path)
    realization_units: realized as components
    planned_symbol_commitments: realized as exports on planned_artifacts (see realized_probe0_symbol_commitments)
  ordering_rule: >
    File ordering may be deterministic for reviewability but carries no semantic
    precedence unless a field explicitly defines it.
  minimum_after_first_acceptance:
    outcomes: at_least_one
  validation:
    - IDs_unique_within_project_semantic_namespace  # across all families, nested evidence requirements included
    - all_typed_refs_resolve
    - every_normative_item_reaches_outcome
    - every_success_criterion_reaches_target_fact  # realized as: its target_refs resolve
    - every_success_criterion_has_evidence_requirements
    - every_realization_unit_artifact_ref_resolves  # components.planned_artifact_refs
    - every_planned_artifact_has_exact_path_or_generation_rule  # realized: locator.exact_path is required
    - every_planned_symbol_commitment_reaches_artifact  # by construction: exports nest in the artifact
    - every_verification_subject_reaches_criterion_and_evidence_requirement  # each ER must belong to a criterion in criterion_refs
    - every_evidence_requirement_has_a_route  # a verification subject or one external boundary (SC-GF-004); aes target validate, aes plan validate
    - no_duplicate_mutable_semantic_fact_is_encoded_through_reverse_edges
  validation_not_realized_in_v0_2_mvp:
    - every_provider_binding_reaches_capability
    - every_realization_unit_reaches_target_and_capability  # components reach target refs; there are no capabilities
    - every_generation_rule_is_bounded_and_justified

analysis_record:
  path: .aes/analysis.yaml
  realized: false  # not realized in the v0.2 MVP; no model, command or project.yaml path
  creation_condition: accepted_engineering_analysis_exists
  purpose: accepted_non_target_engineering_analysis
  candidate_fields:
    schema_version: required
    analysis_id: required
    failure_modes: list
    planning_uncertainties: list
    feasibility_findings: list
    provider_landscape_refs: list
  failure_mode_validation:
    - threatened_refs_resolve
    - response_refs_resolve
    - response_roles_are_explicit
  planning_uncertainty_candidate_fields:
    - id
    - question_or_unknown
    - current_known_facts
    - resolution_method
    - stopping_rule
    - downstream_update_if_resolved
  rule: >
    Analysis can justify target changes but is not included in target-current
    conformance merely by residing in a canonical AES record.

plan_record:
  path_pattern: .aes/plans/<proposal_id>.yaml  # proposal ids are named PLAN-<id> by convention
  purpose: accepted_time_bounded_transition
  realized_shape:
    model: planning.AcceptedPlan (a planning.Proposal plus two fields; strict)
    written_by: aes plan accept, which refuses when the file already exists
    fields:
      schema_version: aes.v0_2.proposal.probe0
      proposal_id: required  # [A-Za-z0-9][A-Za-z0-9._-]*; names the file
      title: required
      rationale: required
      closes_gaps: required  # ids of gaps open in the current reconciliation, <kind>:<ref>
      target_delta:
        add: one list per target family, entries in the target's own shape
        change: one list per target family; replaces the whole entry with the same key
        remove: one list of keys per target family
        key: id, or evidence_requirement_ref for external_boundaries
      outside_governed_roots: optional  # [{artifact_ref, reason}]
      accepted_at_revision: HEAD when accepted (40-hex)
      accepted_at: UTC timestamp
    reachability: >
      aes reconcile and aes status report "plans: N accepted, M unreachable" and one
      warning line per accepted plan whose accepted_at_revision is not an ancestor of
      HEAD; it does not fail them. aes plan accept warns on stderr when HEAD is not on
      the default branch.
  candidate_fields_not_realized_in_v0_2_mvp:
    schema_version: required
    plan_id: required
    status: required
    source_semantic_refs:
      trigger_gap_refs: required
      closing_gap_refs: required_before_execution
      affected_target_refs: required
      analysis_refs: optional
    intended_transition: required
    verticals: list
    probes_or_enablers: list
    completion_evidence_requirements: required
    stopping_and_reassessment_rules: required
  target_change_representation:
    rule: >
      Do not invent a second YAML patch language unless needed. Proposed/accepted
      target changes are represented by changes to target.yaml under normal
      version control; the plan records semantic refs/rationale and the governed
      execution base captures the exact accepted repository revision.
    realized: >
      A small delta language was needed: target_delta (add / change / remove, whole
      entries by key). aes plan validate applies it in memory and reports every
      violation; aes plan accept applies it to target.yaml through ruamel round-trip
      and writes the plan file. The change still lands as an edit of target.yaml
      under version control; accept does not commit, and the target and plan are
      committed together.
  execution_revision_binding:
    rule: >
      The plan file does not embed the Git commit SHA containing itself. Execution
      custody/receipts bind the accepted plan and target bytes to the exact base
      revision after commit creation.
    realized: >
      accepted_at_revision is the base (HEAD before the accepting commit), not the
      commit containing the plan. Execution custody/receipts are not realized in the
      v0.2 MVP.

observation_record:
  path_pattern: .aes/observations/<observation-id>.yaml
  purpose: retained_revision_or_subject_bound_observation
  realized_model: evidence.ObservationRecord (strict)
  fields:
    schema_version: required  # aes.v0_2.observation.probe0
    observation_id: required  # unique across the directory
    subject_refs: required  # declared target ids
    subject_revision_or_external_identity: required  # subject_revision (40-hex commit) and/or external_identity; at least one
    dependency_paths: optional  # repository paths the result depends on
    dependency_basis: optional  # see realized_probe0_observation_dependency_basis
    dependency_target_refs: optional  # see realized_probe0_observation_dependency_target_refs
    control: optional  # see realized_probe0_observation_negative_control
    observer:
      identity: required
      version: required_when_available
    method: required
    execution_state: COMPLETED_or_ERROR
    result_or_error: required  # exactly one of result (mapping) or error; ERROR requires error and carries no assessments
    produced_at: required
    retained_artifact_refs: optional
    assessments: optional  # [{evidence_requirement_ref, assessment: SUPPORTS|REFUTES|INCONCLUSIVE, basis, assessor: {identity, version}}]
    superseded_by: optional  # observation_id of the replacing record, which must exist; never itself
  rules:
    - append_only_after_retention  # records are never deleted; the one later edit is adding superseded_by
    - observation_does_not_claim_criterion_sufficiency  # assessments are per evidence requirement, never per criterion
    - external_or_large_native_artifacts_may_be_digest_referenced_not_copied
  freshness:
    computed: at read time from Git, never stored
    states:
      UNREACHABLE: >
        checked first: subject_revision (control.base_revision for a negative control)
        is not an ancestor of HEAD, or is absent from this clone
      UNKNOWN: no subject_revision or no dependency at all (external subjects, human review)
      STALE: a dependency path changed between the observed revision and HEAD, or a dependency_target_refs entry changed or disappeared
      CURRENT: otherwise
    counting: only CURRENT, non-superseded assessments count toward standing; superseded records are counted separately

evidence_assessment_record:
  materialization: retained_inside_observation_assessment_receipt  # decided; one assessment per evidence requirement
  realized: >
    Assessments are retained inside the observation (assessments list). Freshness and
    criterion standing (SUPPORTED | REFUTED | INSUFFICIENT, D2 conjunction) are
    recomputed from observations plus the target on every call and are not retained.
  options_considered:
    - retained_inside_observation_assessment_receipt
    - separate_retained_assessment_record
    - generated_and_reproducible_from_observations_plus_criterion_policy
  semantic_required_fields:
    - criterion_or_claim_refs
    - observation_refs_optional
    - freshness
    - adequacy
    - standing
    - assessor_identity
    - assessor_version_when_applicable
    - assessment_basis
  rule: >
    The final materialization choice must preserve assessor provenance and make
    stale/insufficient/unassessed states inspectable.

generated_current:
  candidate_path: .aes/generated/current.yaml
  realized: false  # not realized in the v0.2 MVP; nothing writes under .aes/generated/
  realized_instead: >
    aes reconcile / aes status compute qualified current state and gaps from the HEAD
    characterization, evidence standing, the target and the accepted plans on every
    call and print them; nothing is written, so no gap closes through reconcile's own state.
  authority: none
  required_provenance_inputs:
    - target_content_identity
    - realized_characterization_identity
    - evidence_assessment_identity_or_inputs
  rule: >
    Generated current never becomes canonical merely because it is committed.

generated_gaps:
  candidate_path: .aes/generated/gaps.yaml
  realized: false  # not realized in the v0.2 MVP; nothing writes under .aes/generated/
  authority: none
  required_provenance_inputs:
    - target_content_identity
    - current_projection_identity
  may_include:
    - gap_id
    - target_refs
    - current_refs
    - variance
    - state
    - active_plan_refs
  rule: >
    Active plan refs are navigation only. Plan state cannot force gap closed.

generated_semantic_graph:
  candidate_path: .aes/generated/semantic-graph.yaml
  realized: false  # not realized in the v0.2 MVP; nothing writes under .aes/generated/
  authority: none
  inputs:
    - typed_target_refs
    - plan_refs
    - realized_observed_relationships
    - evidence_refs
    - derived_relationship_rules
  edge_semantic_class_required:
    - INTENDED
    - OBSERVED
    - DERIVED
  rule: no_manual_duplicate_edge_authority

revision_and_content_identity:
  authoritative_records:
    stable_identity: semantic_ids_plus_repository_path
    exact_revision: supplied_by_repository_execution_context
    optional_content_digest: useful_for_cross_revision_or_external_receipts
  observations:
    exact_subject_revision_or_external_identity: required
  generated_projections:
    must_bind_to_input_identities: true
  reason: >
    A file cannot safely embed the final Git commit hash of the commit that
    contains those exact bytes without a self-reference problem. Revision
    binding therefore occurs in the surrounding repository/receipt context.

schema_strategy:
  status: realized_as_pydantic_models  # JSON Schema not adopted in the v0.2 MVP
  candidate: JSON_Schema_2020_12_for_YAML_loaded_data
  realized: >
    Strict Pydantic models (extra fields forbidden) over a ruamel YAML 1.2 loader with
    duplicate keys rejected, plus records.validate_target_refs and
    planning.route_violations for cross-record semantic invariants. There is no lenient mode.
  required_validator_behaviors:
    - reject_duplicate_YAML_mapping_keys
    - reject_unknown_fields_when_strictness_is_intended
    - validate_typed_ref_resolution_beyond_JSON_Schema
    - validate_cross_record_semantic_invariants
  nonclaim: JSON_Schema_alone_is_sufficient_for_semantic_validation

# Appended 2026-09-25 (roadmap phase 3, 24-pre-probe-decisions.md section 13).
realized_probe0_symbol_commitments:
  status: realized_in_probe0_differs_from_candidate_above
  shape: >
    Probe 0 does not have a separate planned_symbol_commitments family. A
    planned_artifacts entry carries an optional `exports: [entry, ...]`, each
    entry `name` (the top-level public symbol exists) or
    `name(args) -> ret` (it exists with that signature, compared after
    parsing both sides and re-rendering with ast.unparse).
  validation:
    - exports_only_on_kind_source_with_a_py_exact_path
    - each_entry_is_an_identifier_or_a_parseable_function_header
    - no_duplicate_export_names_within_one_artifact
  reason: >
    One consumer, one language: a commitment always belongs to exactly one
    file, so nesting it under that file's artifact satisfies
    every_planned_symbol_commitment_reaches_artifact by construction.
  wrong_when: >
    A commitment needs its own identity (referenced by a criterion or a
    verification subject), or spans files; then promote to the separate family.

realized_probe0_characterization:
  schema_version: aes.v0_2.characterization.probe0
  fields: [schema_version, subject_revision, dirty, producer, governed_roots, files, produced_at]
  file_fields: [path, blob_sha, size, python]
  python_fields: [module, symbols, imports, parse_error]
  note: >
    Facts are read from the HEAD tree; `dirty` records that the working tree
    or index differs. Every field except produced_at is deterministic for one
    revision. This is the realized_characterization_identity input that
    generated_current names; its content digest is left to RECONCILE.

realized_probe0_observation_dependency_basis:
  field: dependency_basis
  shape: {locator: path, discovered: [paths], declared: [paths]}
  rule: dependency_paths equals the sorted union of the three; a mismatch fails the load.

# Appended 2026-09-25 (roadmap phase 6a, 24-pre-probe-decisions.md section 16).
realized_probe0_observation_dependency_target_refs:
  field: dependency_target_refs
  shape: [target ids]
  rule: >
    STALE when a referenced entry (the id's whole mapping, nested evidence
    requirements included, strictly loaded at both revisions and compared as
    canonical JSON) differs between the observed revision and HEAD or is gone
    at HEAD; an id absent at the observed revision fails loudly. The target
    file in dependency_paths is the coarse form and keeps file-level staleness.
realized_probe0_observation_negative_control:
  field: control
  shape: {kind: negative, base_revision: 40-hex, mutation: text, expected_outcome: detected, observed_outcome: detected|missed}
  rules:
    - freshness_is_computed_from_base_revision_not_subject_revision
    - base_revision_is_on_a_branch_and_an_ancestor_of_subject_revision
    - observed_outcome_detected_allows_SUPPORTS_or_INCONCLUSIVE_missed_allows_only_REFUTES
    - result_exit_code_0_cannot_claim_detected
realized_probe0_producer_version:
  fields: [characterization.producer.version, reconciliation.producer.version, observation observer/assessor version from aes evidence record, aes --version]
  rule: >
    Installed distribution version, plus " (running: <git describe --always --dirty>)"
    when the executing module is tracked by a Git checkout; "not installed (running: ...)"
    without a distribution; neither determinable fails.

accepted_amendments:
  - change: candidate_path / candidate_path_pattern renamed path / path_pattern for project, target, analysis, plan and observation records; candidate_fields renamed fields where realized.
    reason: those paths are real (.aes/ in this repository), except analysis, which is marked realized false.
    source: ls .aes/; project.py; planning.py; evidence.py
  - change: project_record fields match records.ProjectRecord (governed_roots and aes.initialized_at added, materialization keys and primary_language_or_runtime required); analysis_path, supported_adapter_profile and operational_provider_config_refs moved to not_realized_in_v0_2_mvp.
    reason: the strict model requires or rejects exactly these keys.
    source: records.py ProjectRecord; 24-pre-probe-decisions.md section 12
  - change: target_record fields match records.TargetRecord (components, external_boundaries added; entry shapes stated); capability_requirements, provider_bindings, artifact_generation_rules moved to not_realized; realization_units -> components; planned_symbol_commitments -> exports.
    reason: the strict model rejects unknown families; D3 names components; symbol commitments nest in planned artifacts.
    source: records.py TargetRecord; 24-pre-probe-decisions.md sections 1 (D3), 13, 15
  - change: target_record vocabularies added (normative kinds, evidence kinds, artifact kinds, proof roles) with the mapping rule for kinds outside them.
    reason: the loader's closed vocabularies; kinds were mapped, not widened.
    source: records.py Literal types; 24-pre-probe-decisions.md section 17 item 4
  - change: target validation list annotated with how each is realized; every_evidence_requirement_has_a_route added; provider-binding, capability and generation-rule checks moved to validation_not_realized_in_v0_2_mvp.
    reason: matches records.validate_target_refs and planning.route_violations (used by aes target validate and the pre-commit hook).
    source: records.py validate_target_refs; planning.py route_violations; 24-pre-probe-decisions.md section 16
  - change: analysis_record marked realized false.
    reason: no model, command or project.yaml path exists for it.
    source: records.py; ls .aes/
  - change: plan_record realized_shape added (proposal fields, target_delta add/change/remove, accepted_at_revision, accepted_at, reachability reporting and the off-default-branch warning); the candidate fields kept as candidate_fields_not_realized_in_v0_2_mvp.
    reason: an accepted plan is planning.AcceptedPlan; the candidate's status/source_semantic_refs/verticals/etc. were not built.
    source: planning.py Proposal, TargetDelta, AcceptedPlan; reconcile.py PlanState; cli.py docstring; 24-pre-probe-decisions.md sections 15, 20 item 1; branch commit 26f8428
  - change: target_change_representation and execution_revision_binding gain realized notes (a delta language was needed; accepted_at_revision is the base revision; custody receipts not realized).
    reason: target_delta is the patch language the candidate hoped to avoid; the rule's version-control half still holds.
    source: planning.py module docstring; 24-pre-probe-decisions.md section 15
  - change: observation_record fields match evidence.ObservationRecord (dependency_paths, dependency_basis, dependency_target_refs, control, assessments, superseded_by added); freshness states CURRENT/STALE/UNKNOWN/UNREACHABLE and supersession counting added; append-only rule annotated with the superseded_by exception.
    reason: the realized model; superseded_by is added to already-retained records (e.g. OBS-AES-WG5-LIFECYCLE in 449cd54).
    source: evidence.py ObservationRecord, freshness; 24-pre-probe-decisions.md sections 16, 19, 20 item 5
  - change: evidence_assessment_record materialization set to retained_inside_observation_assessment_receipt (was undecided); options renamed options_considered.
    reason: assessments are retained per evidence requirement inside observations; freshness and standing are recomputed.
    source: evidence.py module docstring
  - change: generated_current, generated_gaps and generated_semantic_graph marked realized false; generated_current notes that aes reconcile/status compute and print current state and gaps.
    reason: nothing writes under .aes/generated/ in this repository or in the code.
    source: reconcile.py module docstring; ls .aes/
  - change: schema_strategy status set to realized_as_pydantic_models.
    reason: validation is strict Pydantic plus ruamel duplicate-key rejection and semantic checks, not JSON Schema.
    source: records.py; evidence.py; planning.py
