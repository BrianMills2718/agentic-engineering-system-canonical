    The closest AES rule is ui-tooltips-default, which only covers tooltips on individual controls, not a sequenced
    tour with step navigation, skip, auto-start per browser, and specific positioning requirements. The source document
    exists and is promoted.
  rule: "A human-facing surface explains itself with a spotlight tour: it highlights\none real control, says one\
    \ line about what that control changes, and offers\nNext.\n\nRequirements:\n  - anchor each step to the live\
    \ element by selector; never a screenshot,\n    redraw or approximation;\n  - one idea per step, 10 to 25 words\
    \ - if a step needs a paragraph, the\n    control needs a better label;\n  - say what the control changes, not\
    \ what it is;\n  - provide Next, Back, a step counter, a visible Skip and a close control;\n  - skip steps whose\
    \ selector matches nothing, so a conditional or removed\n    control does not strand the tour;\n  - auto-start\
    \ once per browser, then leave a quiet control to replay it;\n  - cover every screen a person can land on, not\
    \ only the landing page;\n  - keyboard: Escape leaves, arrows move, focus moves to the popover, the\n    dialog\
    \ is labelled;\n  - position by measuring the popover and clamping it into the viewport.\n\nProse explanation\
    \ beside the interface does not satisfy this rule. Neither\ndoes a tour that only covers the first screen.\n\
    \nIt composes with point-of-use help rather than replacing it: the tour tells a\nfirst-time visitor where things\
    \ are, inline hints answer questions later.\n"
