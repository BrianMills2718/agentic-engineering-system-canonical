- id: live-status-evidence
  disposition: keep
  quote: 'Classify each status claim as durable or mutable before answering. A durable

    decision, ownership record, or historical event may be supported by its

    current authority and original source. A mutable claim about runtime health,

    deployment, connectivity, credentials, tools, repository state, source

    coverage, or current work requires a fresh probe of the exact target and

    environment, or a matching unexpired receipt whose result-affecting inputs

    have not changed.


    Present-tense words such as working, live, deployed, connected, available,

    current, or built are licensed only for the boundary demonstrated by that

    evidence. Registration, configuration, a plan, or one successful identity

    cannot establish another identity or a larger capability. If a required probe

    cannot be run, state that current status is unknown and report any historical

    evidence separately as last observed. Preserve target, environment,

    observation and expiry times, revision or source fingerprint when available,

    probe outcome, and an evidence reference. Never silently substitute a

    fallback source or environment.


    Repository and documentation status claims must also preserve the canonical

    remote/default branch, exact observed revision, checkout completeness, lineage

    class, and invalidation event. Use the lineage classes `canonical_merged`,

    `candidate`, `superseded`, and `historical`; a candidate never silently becomes

    canonical merely because its tests pass or it is deployed. A status snapshot

    is current only for its recorded revision and inputs.


    A merge that changes a public capability, plan outcome, ownership boundary, or

    advertised surface is not complete until the owning mutable status authority

    is reconciled or an explicit no-status-change receipt is recorded. Reconcile

    the plan index, current-state authority, and public documentation only where

    their owned claims changed. Overlapping candidates must be merged, superseded,

    or left explicitly pending; they must not remain ambiguous parallel truths.

    '
