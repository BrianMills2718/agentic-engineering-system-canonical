schema_version: aes-legacy-dispositions/v1
about: 'Every rule in project-meta policy/registry.yaml with its disposition from the agent-router slice 1 sort
  (scripts/rules/sort_legacy.py): covered (already stated elsewhere), keep (moved into register.yaml), retire, or
  unresolved (its evidence check failed twice; it stays legacy). Each quote was checked verbatim against the file
  named in quote_from.'
rules:
- id: acceptance-criteria-first
  disposition: covered
  covered_by: workspace-instructions
  reason: The current workspace instructions already require agents to define explicit pass/fail criteria and verify
    the smallest useful implementation against them.
  quote_from: workspace_instructions
  quote: "Observe the\n  real boundary, define compact pass/fail criteria, and test the smallest useful\n  vertical\
    \ through the user's entrypoint."
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: advertised-capability-certification
  disposition: keep
  reason: The source and enforcement tooling still exist, and neither the workspace instructions nor the AES register
    states the specific requirement that public capability claims must derive from a valid, profile-appropriate
    certification record with cumulative evidence.
  quote_from: source_doc
  quote: 'A public status such as `runnable`, `available`, `supported`, or `working` must be

    derived from a valid certification record. Registration, importability, a passing

    unit test, or one unrelated end-to-end request is not sufficient by itself.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: agent-drivable-everything
  disposition: retire
  retire_kind: obsolete
  reason: The current workspace instructions explicitly recognize operations that only Brian can perform, so the
    legacy absolute requirement that every operation must be agent-invocable no longer applies.
  quote_from: workspace_instructions
  quote: '**Action** — something only Brian can physically or personally do (sign in, approve a payment, have a
    conversation, click through a flow an agent cannot reach).'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: agent-first-human-review-escalation
  disposition: covered
  covered_by: workspace-instructions
  reason: 'The legacy rule requires agents to make clear judgments autonomously and escalate only genuinely ambiguous
    items. The workspace instructions state the same policy: ''Escalate only when a call is both not-high-confidence
    and high-impact'' and ''high confidence or low impact alone means proceed and report it under Done'' — this
    covers the same requirement that agents should resolve what they can and escalate only the narrow, consequential
    uncertainty.'
  quote_from: workspace_instructions
  quote: Escalate only when a call is both not-high-confidence and high-impact; high confidence or low impact alone
    means proceed and report it under Done, not ask first. Reach that confidence through investigation — parallel
    subagents/forks on independent open questions — before deciding whether to ask, not instead of deciding; verify
    a fork's key claim before acting on it, since a fork can fabricate a completed-looking result. A genuine escalation
    needs an active channel that reaches Brian directly; a passive list or report he'd have to open on his own does
    not count.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: agent-memory-source-of-truth
  disposition: retire
  retire_kind: superseded
  reason: The current workspace instructions replace the legacy immutable per-learning JSON artifact workflow with
    same-turn Feedback lines collected nightly; additionally, FILE FACTS show that `learnings/entries/` no longer
    exists.
  quote_from: workspace_instructions
  quote: 'Record every lesson, friction, problem, experiment

    and research finding as **Feedback** record lines in the same turn (format: the

    `learned` skill; the nightly collector files them).'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: agent-owned-internal-coordination
  disposition: keep
  reason: This rule is not covered by any AES rule or workspace instruction. The workspace instructions touch on
    coordination (e.g., listing agents, checking claims, using coordination mailbox) but do not codify the requirement
    that agents must never ask the user to relay messages and must treat transport failures as control defects.
    The AES rules register has no overlapping rule. The source document is present (FILE FACTS confirm policy/proposals/2026-09-01-agent-owned-internal-coordination.yaml
    exists), so the rule remains valid and needed.
  quote_from: source_doc
  quote: Agents own internal agent-to-agent coordination. They send, receive, poll, and acknowledge internal messages
    directly through native collaboration tools or the exact-session coordination mailbox; they never ask the user
    to relay an internal message or contact another agent on their behalf.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: archive-physical-scan-surface-closeout
  disposition: retire
  retire_kind: superseded
  reason: 'Legacy rule archive-physical-scan-surface-closeout is a proposal-level rule (status: approved, proposed
    2026-08-20) that was promoted to policy/registry.yaml (review_notes: ''Promoted to policy/registry.yaml as archive-physical-scan-surface-closeout'').
    The workspace instructions now contain the superseding storage-lifecycle-policy section (lines starting with
    ''## Local storage lifecycle''), which covers the same function more broadly: canonical checkout usage, worktree
    management, scratch budgets, archive cleanup procedures. The old rule focused narrowly on physical-scan-surface
    closeout for archive cutovers; the current workspace instructions handle storage lifecycle across all tasks
    with explicit commands (storage-policy, worktree create/remove), making the old rule procedurally superseded.'
  quote_from: source_doc
  quote: An archive or replacement cutover is not complete merely because its source branch is merged and the reviewed
    candidates exist under `~/archive/`.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: archive-to-home-archive
  disposition: covered
  covered_by: workspace-instructions
  reason: The workspace instructions already cover the core requirement of archiving retired material to ~/archive/
    by stating 'retired things (~/archive/<repo>/<timestamp>/)' under 'Where things live'. The legacy rule's requirement
    for a single findable archive home is fully stated there.
  quote_from: workspace_instructions
  quote: Keep durable invariants here; rationale belongs in `WORKING_RULES.md`
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: authority-surface-concern-uniqueness
  disposition: keep
  reason: The source registry still exists and declares the uniqueness invariant, while neither the workspace instructions
    nor the AES register states this same requirement.
  quote_from: source_doc
  quote: 'canonical_owner_unique_per_fact_class: true'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: autonomous-progress-boundary
  disposition: covered
  covered_by: workspace-instructions
  reason: The workspace instructions already require autonomous progress through safe, authorized work and require
    a durable handoff with evidence, blocker or owner, and an exact resume event when no safe next action remains.
  quote_from: workspace_instructions
  quote: 'Commit coherent authorized increments and push recoverable checkpoints with

    focused evidence. When no safe next action remains, record state, evidence,

    owner/blocker, and the exact resume event.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: bounded-experiment-lane-continuity
  disposition: keep
  reason: The legacy rule's requirement—lane roles and continuation semantics for bounded experiments—is not covered
    by any AES rule or workspace instruction. The AES register and workspace instructions contain no equivalent
    rule about experiment lane continuity, ownership transfer, or return boundaries. The source document is present
    and the rule is a real, useful requirement for coding agents handling bounded experiments.
  quote_from: source_doc
  quote: 'A bounded cross-project or consumer experiment records three roles: `owning_lane`, `consumer_or_fixture`,
    and `return_boundary`.'
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: browser-entrypoint-execution-required
  disposition: retire
  retire_kind: source_missing
  reason: 'The source document `policy/proposals/browser-entrypoint-execution-required.yaml` does not exist (FILE
    FACTS: `{"source_docs": {"policy/proposals/browser-entrypoint-execution-required.yaml": false}}`). The rule
    concerns manual browser verification of URLs, which does not appear in the AES rules register or workspace instructions.
    Without an accessible source document or any evidence the requirement is still in effect, it should be retired.'
  quote_from: none
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: canonical-surface-lineage
  disposition: keep
  reason: The AES rules register and workspace instructions do not contain a rule requiring every named current
    or canonical surface to have one declared authority lineage with reconciliation. The rule is still a real, useful
    requirement for coding agents to prevent competing surfaces from being presented as current.
  quote_from: source_doc
  quote: Each canonical surface has exactly one declared authority lineage
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: capability-catalog-integrity
  disposition: keep
  reason: The requirement to pass schema, required-field, and binding-uniqueness checks before publishing a capability
    claim is a real, useful integrity check. It is NOT stated in the workspace instructions (which mention no catalog
    validation rule) nor in any AES rule in the register. The source document confirms the catalog is a 'Curated
    semantic layer' with bindings that must be unique, and the linked script `scripts/check_capability_catalog.py`
    exists. The rule applies always because it is a safety-critical integrity check on the capability catalog that
    any agent publishing claims must follow.
  quote_from: source_doc
  quote: Curated semantic layer keyed by `capability_id`.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: catalog-health
  disposition: keep
  reason: The source requires verifiable policy artifacts, and the checked script still exists, but neither the
    workspace instructions nor the AES register states that catalog linked-script paths must exist.
  quote_from: source_doc
  quote: '- Commands and artifacts that let an agent verify the current state.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-postuse-mission-drift
  disposition: covered
  covered_by: workspace-instructions
  reason: The legacy rule cc-hook-postuse-mission-drift is covered by the root-cause-over-symptom policy, which
    is already fully stated in workspace instructions. The workspace instructions say 'Before working around it
    ... ask whether it would recur for any agent in any project; if so, fix it where it originates (the shared tool,
    library, hook, or policy). A local mitigation is allowed only while that root fix is filed or in progress, and
    you must say which one you applied.' This covers the same requirement as the legacy rule — detecting cross-session
    context confusion is a root-cause question.
  quote_from: workspace_instructions
  quote: Before working around it (a retry, a delay, a manual step), ask whether it would recur for any agent in
    any project; if so, fix it where it originates (the shared tool, library, hook, or policy).
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: cc-hook-postuse-plan-auto-complete
  disposition: retire
  retire_kind: superseded
  reason: A commit message signaling closure is only a proxy for actual plan completion. The current workspace instructions
    require direct verification of the underlying claim, superseding the legacy post-commit auto-completion behavior;
    plan completion is now an explicit verified lifecycle action.
  quote_from: workspace_instructions
  quote: A proxy signal is not the claim it stands in for.
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-pretooluse-skill-fork-write-gate
  disposition: covered
  covered_by: workspace-instructions
  reason: The current workspace instructions already require shared skills to be authored only in the canonical
    directory and treat client copies as derived, which prohibits creating client-local or ad hoc skill forks.
  quote_from: workspace_instructions
  quote: 'Shared skills are authored only in `~/projects/.agents/skills/`; client copies

    are derived. Use the smallest matching skill and never let it override policy.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-preuse-destructive-command-block
  disposition: keep
  reason: The source documents and linked detector still exist, and neither the current workspace instructions nor
    the AES register states the full hook requirement to inspect executable command positions, ask or deny by client,
    and fail closed on malformed events.
  quote_from: source_doc
  quote: 'Continue while authorized, dependency-ready, outcome-advancing work remains and

    the next action is **not irreversibly dangerous**.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-sessionstart-audit-hook-surface
  disposition: covered
  covered_by: loud-failures-reach-an-agent
  reason: 'Workspace instructions policy `loud-failures-reach-an-agent` already covers the same requirement: services/timers/pipelines
    that error or miss a heartbeat must open a keyed concern for an agent to work, which subsumes the legacy rule''s
    requirement to print structural findings about hook-surface health at session start. The legacy rule''s specific
    mechanism (audit_hook_surface.py --brief --strict at SessionStart) is an implementation detail of that broader
    policy.'
  quote_from: workspace_instructions
  quote: A running service, bot, timer, or pipeline that errors, skips a run, or misses a heartbeat must, unwatched
    and within minutes, tell any waiting user and open a keyed concern (`project-meta/scripts/concern_issue.py`)
    the most relevant agent works; a failure that only reaches a log, or a loop that repeats one crash, is a defect.
    Log each step's outcome and user-facing latency.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: cc-hook-sessionstart-manage-client-config
  disposition: retire
  retire_kind: superseded
  reason: The current workspace authority supersedes declaration-parity checking with runtime verification. The
    legacy SessionStart check only compares configuration structure and therefore cannot establish that a configured
    hook actually runs.
  quote_from: workspace_instructions
  quote: 'A hook counts as synced only

    when Codex actually runs it: ask Codex (`hooks/list`), not the config file.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-sessionstart-session-brief
  disposition: keep
  reason: The source document establishes session-start context injection, and the linked session-start and resume
    scripts still exist, but neither the current workspace instructions nor the AES register requires a concise
    ecosystem status brief containing the top task, active claims, and recent anomalies.
  quote_from: source_doc
  quote: '# Session-start context injection

    python scripts/knowledge_router.py --project PROJECT [--intent "task description"]  # Load route + memory context
    (~600 tokens)

    make context-load PROJECT=llm_client INTENT="fix batch embedding"                   # Same via Makefile'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-sessionstart-sync-skills
  disposition: retire
  retire_kind: superseded
  reason: The legacy rule mandates a Claude-Code-only SessionStart hook. Current workspace policy supersedes client-specific
    enforcement by requiring Claude Code and Codex behavior to remain synchronized; the shared skill synchronization
    control must therefore be defined and enforced through the current cross-client mechanism rather than retained
    as this Claude-only rule.
  quote_from: workspace_instructions
  quote: 'Claude Code and Codex are always kept in sync (meta-policy

    `claude-codex-parity`, project-meta `policy/registry.yaml`).'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-stop-second-brain-work-context
  disposition: unresolved
  review: 'Retire reasoning rejected on review (2026-10-08): the quoted parity rule says hooks must behave the same
    in Claude Code and Codex, which argues for adding the hook to Codex, not for retiring the rule.'
- id: cc-hook-stop-session-handoff
  disposition: retire
  retire_kind: superseded
  reason: The unconditional requirement to create a handoff document at every Claude Code Stop event has been replaced
    by state-based closeout instructions that require recording resumable state only when no safe next action remains,
    along with the current structured response closeout format.
  quote_from: workspace_instructions
  quote: When no safe next action remains, record state, evidence, owner/blocker, and the exact resume event.
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: cc-hook-userpromptsubmit-assignment-manager
  disposition: retire
  retire_kind: obsolete
  reason: The current documented workflow loads routed context at session start rather than injecting assignments
    on every prompt; coordination ownership now resides in claims and the mailbox, and the legacy per-prompt injector
    is not part of the current workflow.
  quote_from: source_doc
  quote: '# Session-start context injection

    python scripts/knowledge_router.py --project PROJECT [--intent "task description"]  # Load route + memory context
    (~600 tokens)

    make context-load PROJECT=llm_client INTENT="fix batch embedding"                   # Same via Makefile'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: check-claims-before-overlap
  disposition: covered
  covered_by: workspace-instructions
  reason: The workspace instructions already require checking coordination claims before editing shared projects,
    via `check_coordination_claims.py`, which covers the same requirement as the legacy rule. The legacy rule's
    policy to inspect claims before starting overlapping work is stated in the workspace instructions under 'Shared-state
    safety'.
  quote_from: workspace_instructions
  quote: Before editing, record `git status --short`, inspect active claims with `check_coordination_claims.py --check
    --project <name>` (or `--list`), and preserve other writers' work.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: circuit-breaker
  disposition: keep
  reason: The current instructions contain narrower retry and waiting limits, but they do not state the general
    three-attempt circuit breaker for any repeatedly unchanged problem.
  quote_from: source_doc
  quote: 'When one lane reaches a boundary,

    continue another eligible lane rather than idling the whole program.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: claim-end-requires-liveness-check
  disposition: keep
  reason: 'The AES rules register does not contain this specific liveness-check requirement. Workspace instructions
    mention coordination claims (Shared-state safety section: ''Before editing, record git status --short, inspect
    active claims with check_coordination_claims.py --check --project <name>'') but do not state the liveness-check
    rule. The source document is present (FILE FACTS confirm it exists) and the linked script exists. The requirement
    is not covered by any existing rule, so it must be kept.'
  quote_from: source_doc
  quote: A process that ends, expires, prunes, or sweeps a coordination claim must first check the owning session's
    liveness, and must not end a claim whose heartbeat is newer than the sweep's own start time
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: claim-prune-scope-and-custody
  disposition: keep
  reason: The rule is an approved, hard-enforcement policy from a promoted proposal (2026-09-13, Brian). It is not
    covered in workspace instructions or the AES rules register (neither mentions coordination claims, archive requirements,
    or exact-target pruning). The source document exists per FILE FACTS. The rule is a real, useful requirement
    for coding agents working on coordination-claim pruning/stale-claim cleanup.
  quote_from: source_doc
  quote: Destructive coordination-claim pruning is exact-target by default. A command that can mutate more than
    one explicitly identified claim must require an affirmative fleet-wide flag such as `--all`, state the resolved
    scope before mutation, and reject target selectors that the selected operation does not honor.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: claude-codex-parity
  disposition: covered
  covered_by: workspace-instructions
  reason: The legacy rule's core requirement — that Claude Code and Codex are always kept in sync, covering instructions,
    skills, hooks, and behavioral preferences, with gaps being defects to fix, never decisions to route to Brian
    — is stated verbatim in the Workspace Instructions under the 'Skills and knowledge' section, including the same
    Brian quote ('the answer is always yes'). The Workspace Instructions also reference the same daily audit step
    3e and concern issue mechanism. The requirement is already covered, so no new rule is needed.
  quote_from: workspace_instructions
  quote: 'Claude Code and Codex are always kept in sync (meta-policy `claude-codex-parity`, project-meta `policy/registry.yaml`).
    Brian, 2026-09-14: "the answer is always yes." Instructions, skills, hooks, and behavioral preferences must
    behave the same in both clients.'
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: clean-clone-portability-gate
  disposition: covered
  covered_by: loop-407
  reason: 'AES rule loop-378 ("Require that every replay or backtest document declares its population boundary as
    a structured field, and that every documented tool-invocation route embeds explicit environment pre-checks so
    an agent cannot reach a success-or-failure output via a path whose preconditions are unmet.") covers the same
    requirement: the legacy rule demands clean-clone verification outside the normal topology to prevent sibling/ambient
    dependency failures; loop-378 requires explicit environment pre-checks so that preconditions are verified before
    proceeding, which accomplishes the same goal of preventing undetected environment-mismatch portability defects.'
  quote_from: aes_register
  quote: Require that every replay or backtest document declares its population boundary as a structured field,
    and that every documented tool-invocation route embeds explicit environment pre-checks so an agent cannot reach
    a success-or-failure output via a path whose preconditions are unmet.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: codebase-memory-routing-observability
  disposition: keep
  reason: The current workspace instructions and AES rules register do not address codebase-memory routing/observability.
    The legacy rule is a real, actionable requirement for coding agents choosing when to use the codebase-memory
    graph tool and how to verify its results; it is not stated in the current workspace instructions or AES rules.
    The quoted source document establishes the routing requirement and the verification contract, so it should be
    kept.
  quote_from: source_doc
  quote: Use codebase-memory conditionally for structural code questions after readiness checks, with source verification
    and direct fallback for exact, config, docs, runtime, or unready-index work.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: commit-msg-prefix-validation
  disposition: covered
  covered_by: commit-tags
  reason: 'The legacy rule requires all commit messages to start with a valid prefix pattern from meta-process.yaml.
    The AES rules register rule commit-tags states the same requirement in different words: every commit''s first
    line must start with one of the listed tags, and it is enforced by the existing commit-msg hook. Thus the current
    workspace already covers this requirement.'
  quote_from: aes_register
  quote: 'Every commit''s first line starts with one tag: [Plan #N], [Goal <plan_id>], [Trivial], [Auto], [Unplanned]
    with an Emergency line, or [Shaping <plan_id>].'
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: commit-verified-increments
  disposition: covered
  covered_by: workspace-instructions
  reason: The workspace instructions already require agents to commit coherent increments and continue until a concrete
    blocker leaves no safe next action.
  quote_from: workspace_instructions
  quote: 'Commit coherent authorized increments and push recoverable checkpoints with

    focused evidence. When no safe next action remains, record state, evidence,

    owner/blocker, and the exact resume event.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: concerns-to-issues-immediately
  disposition: retire
  retire_kind: superseded
  reason: The current workspace instructions supersede the legacy nearest-ISSUES.md workflow with a keyed concern
    queue and the current concern_issue.py filing path.
  quote_from: workspace_instructions
  quote: 'When project-specific work surfaces a genuine systemic/ecosystem gap, ecosystem

    work takes priority, one lane per concern: file one keyed concern immediately

    (`project-meta/scripts/concern_issue.py`), fix it yourself only if it blocks your

    own task or nobody has claimed it, and otherwise continue your task while the

    designated owner works the concern queue first.'
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: context-is-depletable
  disposition: covered
  covered_by: workspace-instructions
  reason: The current context-budget instructions already require bounded tool output, concise retained notes, selective
    delegation of bulk research, and keeping conclusions rather than transcripts.
  quote_from: workspace_instructions
  quote: "Context is a finite execution resource:\n\n- Read indexes, headings, and targeted sections before whole\
    \ documents.\n- Never bulk-print multi-file bundles or unbounded search results. A line limit\n  is not a byte\
    \ limit when JSONL or minified records contain huge lines.\n- Bound searches by path, match count, context,\
    \ and output size; use exact line\n  ranges and concise local notes for what survives the decision.\n- Delegate\
    \ unpredictable bulk search only when delegation is permitted and its\n  expected value exceeds its coordination\
    \ cost. Keep the conclusion, not the\n  transcript, and verify load-bearing negatives yourself."
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: continue-after-gate-approval
  disposition: keep
  reason: The source document exists and states a useful cross-turn approval-to-action requirement that is not fully
    stated by the current workspace instructions or AES register.
  quote_from: source_doc
  quote: "When an agent requests one exact approval and states that approval will\n  license a reversible in-scope\
    \ next action, an affirmative operator response\n  clears that gate. The agent records the disposition and immediately\
    \ performs\n  the licensed action."
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: converge-critique-loops
  disposition: covered
  covered_by: workspace-instructions
  reason: The current workspace instructions explicitly state the same converge procedure and prohibit iterating
    on numeric grades.
  quote_from: workspace_instructions
  quote: "AI critique loops end by design. Whenever an AI's critique or grade will\n  drive another revision of\
    \ something a person will judge (an article, page,\n  résumé, cover letter, proposal, design, or a plan Brian\
    \ decides on), follow\n  the `second-opinion` skill's converge procedure: a contract written first\n  (reader,\
    \ their decision, a yes/no checklist, word budget, round limit), two\n  critics from model families other than\
    \ the writer's that report findings\n  with exact quotes, never scores, triage against the contract, one fix-only\n\
    \  revision, keep-or-revert gated by the deliverable's own checks, and\n  `converge.py decide` as the only stop\
    \ rule. Never iterate on a numeric\n  grade."
  sorted_by: openrouter/openai/gpt-5.6-sol
- id: conversation-bound-lane-adoption
  disposition: keep
  reason: The rule is a real, useful requirement for coding agents and is NOT already covered by workspace instructions
    or the AES rules register. No existing rule in the AES register or workspace instructions addresses lane-adoption
    boundaries (staying in the current conversation's outcome unless explicitly changed, treating other-session
    claims as context not assignments, binding generic authorizations to the immediately preceding scope). The workspace
    instructions reference outcome authority ('The current request defines the outcome') but do not cover lane-adoption
    prevention, cross-session claims as context vs. assignment, or generic-authorization binding.
  quote_from: source_doc
  quote: The current conversation's named outcome and latest scope clarification remain the active lane until the
    user explicitly changes them. A live claim, nearby repository, related project, or semantically similar active
    initiative owned by another session is global coordination context, not an assignment.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: coordinator-only-root-delegation
  disposition: keep
  reason: FILE FACTS confirm the source document exists and is true. The AES rules register and workspace instructions
    do not state this requirement. The rule defines a specific role separation for coordinator-only root sessions
    with behavioral constraints not covered by existing rules.
  quote_from: source_doc
  quote: When Brian designates a session as coordinator-only, the root session delegates implementation to worker
    agents. The root limits itself to task decomposition, claim and overlap management, worker messaging, evidence
    review, integration decisions, and combined verification.
  sorted_by: openrouter/deepseek/deepseek-v4-flash
- id: cross-agent-citation-standard
  disposition: keep
  reason: The source document establishes machine-resolvable citations for plan evidence, the source and enforcement
    scripts still exist, and neither the workspace instructions nor the AES register states this citation requirement.
  quote_from: source_doc
  quote: "1. Plan template gains a `Citations` sub-field in Research and Acceptance\n   Criteria sections with `agent_memory:sm-XXXX`\
