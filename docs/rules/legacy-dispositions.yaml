- id: agent-owned-internal-coordination
  disposition: keep
  quote: Agents own internal agent-to-agent coordination. They send, receive, poll, and acknowledge internal messages
    directly through native collaboration tools or the exact-session coordination mailbox; they never ask the user
    to relay an internal message or contact another agent on their behalf.
  quote_from: source_doc
  quote_source: policy/proposals/2026-09-01-agent-owned-internal-coordination.yaml
  reason: This rule is not covered by any AES rule or workspace instruction. The workspace instructions touch on
    coordination (e.g., listing agents, checking claims, using coordination mailbox) but do not codify the requirement
    that agents must never ask the user to relay messages and must treat transport failures as control defects.
    The AES rules register has no overlapping rule. The source document is present (FILE FACTS confirm policy/proposals/2026-09-01-agent-owned-internal-coordination.yaml
    exists), so the rule remains valid and needed.
  rule: 'Agents own internal agent-to-agent coordination. They send, receive, poll,

    and acknowledge internal messages directly through native collaboration

    tools or the exact-session coordination mailbox; they never ask the user to

    relay an internal message or contact another agent on their behalf. When

    another agent owns the canonical capability or claimed repair surface, the

    current agent contacts that owner directly, records the requested

    disposition, and continues safe noncolliding work. If the intended transport

    is unavailable or fails, the agent treats that as a coordination-control

    defect: preserve the message and delivery evidence, repair the control when

    in scope or report the failed boundary and continue noncolliding work.

    Escalate to the user only for an irreducibly human scope, authority, or spend

    decision, not for internal message transport.

    '
  applies_kind: always
  applies_value: any coding agent in any governed project, client, or coordination surface
  input_sha256: a15866eb6aa8767df443780deef8b07f906da8160c8bc72c735d6a7a71969738
