- id: grader-positive-control-and-failure-samples
  disposition: keep
  quote: Any comparator, grader, scorer, or acceptance check that decides pass/fail for a measurement must be run
    against a known-good reference before any number it produces is reported or acted on.
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-25-grader-positive-control-and-failure-samples.yaml
  reason: The requirement is not already stated in the workspace instructions or the AES rules register. The AES
    rules register contains rules like `read-the-trace` which opens traces before reporting scores, but that is
    a different requirement (read traces after the fact vs. run against known-good reference before reporting).
    The positive control, samples-not-counts, and declare-success-criterion rules are distinct requirements not
    covered elsewhere. The source document is present (FILE FACTS confirm policy/proposals/2026-08-25-grader-positive-control-and-failure-samples.yaml
    exists).
  rule: "1. POSITIVE CONTROL. Any comparator, grader, scorer, or acceptance check that\n   decides pass/fail for\
    \ a measurement must be run against a known-good\n   reference before any number it produces is reported or\
    \ acted on. If the\n   comparator rejects the reference, the comparator is wrong -- fix the success\n   criterion\
    \ first. Use `trace_eval.reference_selfcheck`, which raises with a\n   sample of the actual differences. This\
    \ is the mandatory mirror of\n   `corruption_selfcheck` and is required wherever that one is.\n\n2. SAMPLES,\
    \ NOT COUNTS. A failure count may never stand alone in a report, a\n   commit message, or a diagnosis. Any claim\
    \ of the form \"N cases failed\" must\n   be accompanied by the actual expected-versus-actual content of at\
    \ least\n   three of them, or all of them if fewer. This binds at the point of REPORTING,\n   costs one screen\
    \ of output, and requires no infrastructure.\n\n3. DECLARE THE SUCCESS CRITERION. A comparison used as a success\
    \ criterion must\n   be stated as a decision somewhere a reviewer can read it, not left to fall\n   out of a\
    \ language operator. \"Compared with ==\" is not a criterion anyone\n   chose. Where a specification pairs a\
    \ machine-readable code with a\n   human-readable message, say which is graded.\n\nSCOPE: any repeated measurement,\
    \ experiment, benchmark, eval, or automated acceptance check. Single ad-hoc queries and exploratory spikes not\
    \ claimed as results are out of scope."
  applies_kind: actions
  applies_value: any evaluation, benchmark, test suite, or acceptance check
