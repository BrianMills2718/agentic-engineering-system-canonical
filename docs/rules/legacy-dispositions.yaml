- id: agent-first-human-review-escalation
  disposition: keep
  quote: 'For review work that an agent can complete from the authorized evidence,

    draft and validate the clear judgments before involving the human. Escalate

    only a judgment whose plausible alternatives would materially change the

    supported decision, or a human-authority gate that policy explicitly

    reserves for a person. When human confirmation is required, present the

    compact proposed answer or meanings for confirmation or correction instead

    of requiring the person to operate a record-by-record labeling workflow.

    Preserve provenance truthfully: agent-drafted evidence is not human-reviewed,

    and a human-authority gate does not pass until the human confirms it.

    '
