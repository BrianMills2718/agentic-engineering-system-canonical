- id: reproduced-control-failure-closure-gate
  disposition: keep
  quote: 'Reproducing a shared or ecosystem control failure immediately opens an

    isolated root-cause repair lane with explicit ownership and noncolliding write

    scope. When the defect can affect multiple projects, agents, or consumers,

    route that lane to the canonical capability owner and repair the source

    contract before or alongside any local symptom relief; do not multiply local

    patches in consumer repositories as the durable fix. When native delegation

    is available, delegate the lane to an isolated subagent while the primary lane

    continues noncolliding work; otherwise the current agent owns the repair lane

    directly. Another agent''s ownership is a coordination event, not a reason to

    make the primary task wait: contact that owner directly and continue every

    safe noncolliding action. The reproduced

    failure remains required work until evidence identifies its cause and either

    verifies a durable repair or records an explicit unresolved disposition with

    owner, risk, and exact resume condition. A symptom workaround or later passing

    run establishes incident recovery only; neither closes the root defect.

    Terminal status must distinguish incident recovery from durable defect closure

    and must list every reproduced but unfixed control failure as continuing work

    or as a genuine authority, scope, or spend blocker.

    '
