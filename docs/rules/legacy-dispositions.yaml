- id: cross-client-git-update-boundary
  disposition: keep
  quote: Every client that updates a governed repository uses the same repository and Git boundary, regardless of
    its native UI or hook support.
  quote_from: source_doc
  quote_source: policy/proposals/2026-09-09-cross-client-git-update-boundary.yaml
  reason: The cross-client Git update boundary rule establishes a portable preflight and receipt mechanism at shared-state
    boundaries (canonical branches, recovery custody, remote refs) that is not present in the current workspace
    instructions or AES rules register. The workspace instructions cover shared-state safety (claims, worktrees,
    check coordination) and Git commands, but they do not require the structured preflight-and-receipt protocol
    or the explicit six-step precondition checklist before mutation. The AES rules register has no equivalent rule.
    The rule is still relevant because multiple AI clients interact with governed repositories and need a consistent
    mutation boundary.
  rule: "Every client that updates a governed repository uses the same repository and\nGit boundary, regardless\
    \ of its native UI or hook support.\n\nRead-only inspection is allowed without a write claim. Fetching is a\
    \ permitted\nclaimless metadata mutation because it updates remote-tracking refs but not the\nworking tree,\
    \ local branches, or remote repository. Before a client changes a\ncanonical checkout, attaches or changes a\
    \ local default\nbranch, creates or updates a remote ref, or writes repository files, it must:\n\n1. resolve\
    \ the canonical repository path, default branch, approved remote\n   owner, and account route from Project Meta\
    \ rather than from directory or\n   credential heuristics;\n2. fetch the approved remote and inspect exact ahead/behind,\
    \ porcelain,\n   worktree, lock, and structured-claim state;\n3. use a claimed linked worktree for coordinated\
    \ or potentially shared changes,\n   retain the sanctioned lightweight single-writer maintenance path, and never\n\
    \   edit another client's claimed worktree or branch;\n4. fail closed when the structured claim registry is\
    \ missing or malformed for\n   the target. Every unregistered artifact is converted without prose\n   inference\
    \ into a structured quarantine record whose affected project ids\n   are human-supplied or `unknown`; an unresolved\
    \ record for the target, or an\n   `unknown` record, blocks shared-state mutation until classified;\n5. advance\
    \ a clean canonical default checkout only by fast-forward through\n   its sanctioned refresh or lock-controller\
    \ transaction; and\n6. preserve dirty, divergent, detached, or non-default state under exact,\n   reviewed custody\
    \ before any canonical repair. Every dirty, untracked, and\n   relevant ignored path receives an explicit disposition:\
    \ included in a\n   recovery ref, preserved in named durable non-Git custody, or documented as\n   reproducible/expendable\
    \ under existing authority. No automatic reset,\n   forced checkout, stash, or deletion is permitted. Canonical\
    \ repair never\n   force-pushes.\n\nRemote mutation additionally requires the recoverable-Git publication\n\
    preflight and the recorded GitHub account route. A force-push unrelated to\ncanonical repair remains governed\
    \ by the existing durable-backup-ref rule.\n\nCross-client continuation uses the structured session handoff/resume\
    \ and\nmailbox contract. A prose note may supplement that record but cannot acquire,\ntransfer, or release ownership.\
    \ No client may claim this rule is natively\nenforced until its adapter produces and consumes a client-bound\
    \ structured\nreceipt. Until ChatGPT has that adapter, ChatGPT repository writes are a\nmanual portable workflow:\
    \ create a feature branch/worktree, publish a\nrecoverable checkpoint, and leave an exact handoff; do not mutate\
    \ the shared\ncanonical checkout.\n\nA recovery-only publication path must run secret and diff checks and label\n\
    the result as quarantined work-in-progress. It must not depend on unrelated\ngeneration or product tests, and\
    \ ordinary `--no-verify` is not an approved\nsubstitute for that path.\n"
  applies_kind: always
  applies_value: All governed repositories and all interactive or automated clients that can change their local
    Git state or GitHub refs
  input_sha256: 4249ef966bc66856a485f8f4ff3a86666f671789b7ee3b6761d27994830263a5
