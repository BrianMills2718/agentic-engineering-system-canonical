- id: enforcement-leaves-its-remedy-reachable
  disposition: keep
  quote: A gate must leave its own remedy reachable by the actor it blocks.
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-21-enforcement-leaves-its-remedy-reachable.yaml
  reason: The legacy rule is a substantive requirement about blocking hook design that is not stated in the workspace
    instructions or the AES rules register. The workspace instructions have a brief mention of 'Never truncate or
    pipe away the output of a failing check' (loop-386) and various commit/merge rules, but nothing requiring a
    blocking gate to name its clearing command, guarantee a subsequent turn, accept reasonable spellings, or reject
    time-based grace windows that expire into permanent refusal. The rule applies to all agent-facing hooks and
    enforcement gates, making it safety-critical for preventing deadlocked sessions.
  rule: A gate must leave its own remedy reachable by the actor it blocks. A refusal that denies the agent's turn
    must guarantee a subsequent turn in which the agent can comply; it must name the exact command or edit that
    clears it, runnable from the state the refusal leaves behind; it must accept every reasonable spelling of compliance,
    rejecting ambiguity rather than formatting; a time-based grace window that can expire into a permanent refusal
    delays the deadlock rather than removing it; and an escape hatch only a human can operate does not satisfy the
    rule for a check meant to run unattended.
  applies_kind: always
  applies_value: all agent-facing hooks and enforcement gates
  input_sha256: 9da54b7c590e8eb1a286ecd565f69d913b2922d055d55d1562c07c4ee4603202
