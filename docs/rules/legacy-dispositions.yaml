- id: claim-prune-scope-and-custody
  disposition: keep
  quote: Destructive coordination-claim pruning is exact-target by default. A command that can mutate more than
    one explicitly identified claim must require an affirmative fleet-wide flag such as `--all`, state the resolved
    scope before mutation, and reject target selectors that the selected operation does not honor.
  quote_from: source_doc
  quote_source: policy/proposals/2026-09-09-claim-prune-scope-and-custody.yaml
  reason: The rule is an approved, hard-enforcement policy from a promoted proposal (2026-09-13, Brian). It is not
    covered in workspace instructions or the AES rules register (neither mentions coordination claims, archive requirements,
    or exact-target pruning). The source document exists per FILE FACTS. The rule is a real, useful requirement
    for coding agents working on coordination-claim pruning/stale-claim cleanup.
  rule: Destructive coordination-claim pruning is exact-target by default. A command that can mutate more than one
    explicitly identified claim must require an affirmative fleet-wide flag such as `--all`, state the resolved
    scope before mutation, and reject target selectors that the selected operation does not honor. The claim lifecycle
    must expose a sanctioned exact-target removal path; callers must not use a fleet sweep to remove one claim.
    Before any claim is unlinked, the tool must durably archive its exact source snapshot and record a transaction
    identifier that binds that snapshot to the corresponding mutation receipt. If scope resolution, archival, or
    receipt linkage fails, no claim is removed.
  applies_kind: actions
  applies_value: claim prune, stale-claim cleanup, exact-scope lifecycle removal
