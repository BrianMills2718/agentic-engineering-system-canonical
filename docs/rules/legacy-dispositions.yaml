- id: durable-must-not-point-at-disposable
  disposition: keep
  quote: A durable artifact must not reference a location that is not itself durable, UNLESS the derivation is recorded
    alongside the reference.
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-24-durable-must-not-point-at-disposable.yaml
  reason: The rule is a substantive, real requirement about durable references and provenance recording. Neither
    the workspace instructions nor the AES rules register contain an equivalent requirement. The workspace instructions
    mention durability in one sentence ('Before writing a durable reference ... commit the target into a git repo
    with a remote first') but this is a narrower, specific instruction about committing targets before referencing,
    not the broader rule about durable references and the four allowed target types. The AES register contains no
    related rule.
  rule: "A durable artifact must not reference a location that is not itself durable,\nUNLESS the derivation is\
    \ recorded alongside the reference.\n\nBefore writing a reference into anything version-controlled, long-lived,\
    \ or\nhanded off, the target must be one of:\n\n  1. committed in a repository, or\n  2. content-addressed,\
    \ with a hash recorded alongside the reference, or\n  3. a pointer at the true artifact of record -- the upstream\
    \ system that\n     still holds it after every intermediate is gone, or\n  4. derived, with the reference naming\
    \ what it derives FROM and by what\n     command.\n\nClause 4 exists because the first sweep under this rule\
    \ over-called, and the\nover-call is instructive. It flagged `greer/witness_texts/` -- 761 files\nreferenced\
    \ by 355 committed artifacts, zero occurrences in git history,\nabsent from disk. Identical in shape to the\
    \ failure this rule was written\nfor. It was not that: every one of the 761 IDs is a row in\n`greer_witnesses_baseline.csv`,\
    \ which is committed, and the directory is one\ntext file per row. Nothing was lost.\n\nWhat was genuinely wrong\
    \ is narrower and worth catching on its own. The\nartifacts cite `witness_texts/witness_10021.txt` rather than\
    \ the row ID, so\nnothing in the record says the target is regenerable, or from what.\nEstablishing that took\
    \ the same investigation a real loss would have. A\nreference to a derived path is safe; a reference to a derived\
    \ path that does\nnot say it is derived is a false alarm waiting to cost someone an afternoon\n-- and worse,\
    \ one more reason to disbelieve the alarm when it is finally\nreal.\n\nIf the target is none of those, either\
    \ promote it to one of them before\nwriting the reference, or record the reference against the artifact of\n\
    record instead.\n\nAdditionally: a claim that data is lost is a measurement, not an inference.\nBefore recording\
    \ that anything is unrecoverable, run the check that\nestablishes it and record the command alongside the claim.\n"
  applies_kind: always
  applies_value: any agent writing durable references in version-controlled or long-lived artifacts
  input_sha256: 5487fc01024d8be40d266221d35eaed5e118ac62518c53978ae37b90324f6d72
