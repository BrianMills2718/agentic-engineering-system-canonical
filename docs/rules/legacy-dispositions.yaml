- id: immutable-versioned-data-custody
  disposition: keep
  quote: "1. Three kinds of data, three homes. (a) Prompts, ontology packs, schemas and small fixtures live in Git\
    \ with\n   the project that owns them. (b) Large or shared datasets and corpora live in one backed-up store\
    \ as\n   immutable, read-only versions identified by checksum; a version is never edited, a change is a new\
    \ version.\n   (c) Run outputs and archives live in `~/projects/data` and are backed up.\n2. A project that\
    \ uses anything from outside its own repo commits a lock entry naming it, its version and its\n   checksum.\
    \ \"Latest\" is not allowed in a lock. Changing a version is an explicit change in the project.\n3. Every dataset\
    \ carries a visibility label (private or public). A public repository, a public demo or an Inside\n   Success\
    \ hand-off must not reference private data.\n4. The store is read-only at the file-system level and its checksums\
    \ are verified; versions no lock references\n   are listed for deletion and deleted only with Brian's say. Live\
    \ databases are backed up continuously or by\n   snapshot, not versioned as datasets.\n5. Observation is part\
    \ of the policy: a daily scan records unpinned references, unresolved references, checksum\n   mismatches, private\
    \ data referenced from public repos, datasets with no owner, files over 10 MB that change in\n   place, and\
    \ the age of the last successful backup."
  quote_from: source_doc
  quote_source: policy/proposals/2026-10-04-immutable-versioned-data-custody.yaml
  reason: The source still exists and defines useful data-custody requirements that are not fully stated in the
    current workspace instructions or AES register, especially immutable checksum-addressed versions, committed
    locks, and daily custody checks.
  rule: "1. Three kinds of data, three homes. (a) Prompts, ontology packs, schemas and small fixtures live in Git\
    \ with\n   the project that owns them. (b) Large or shared datasets live in one store as immutable, read-only\
    \ versions;\n   the unit of a version is ONE FILE identified by its SHA-256 (a folder tree is packed first,\
    \ e.g. with\n   `run-artifacts pack` or a tar; symlinks and movable `current` pointers cannot be locked). A\
    \ version is never\n   edited; a change is a new version. (c) Run outputs and archives live in `~/projects/data`.\n\
    2. Lock format: use data_library's manifest and `DatasetLock` (dataset_ref@snapshot plus view), and REQUIRE\
    \ the\n   checksum on every locked view (today it is optional and the resolver carries on when it is absent).\
    \ \"Latest\"\n   is not allowed in a lock; changing a version is an explicit change in the project.\n3. Visibility\
    \ uses data_library's `access_class` (private, restricted, internal, public); restricted and\n   internal are\
    \ treated as private. Derived data takes the most restrictive label of its inputs. A public\n   repository,\
    \ demo or hand-off must not reference private data or name a private dataset ID. An Inside\n   Success repository\
    \ must not lock data whose only copy lives on Brian's machine or Drive (the boundary is\n   dependency, not\
    \ information).\n4. Backup of record is personal-file-infra's existing jobs (`local-data-backup`, `llm-observability-backup`,\n\
    \   `run-artifacts-pack`); this policy does not add a second backup job. Backup health is read from each job's\n\
    \   `last-verified-run.utc`: a missing file or one older than 24 hours is a failure, and a run skipped because\n\
    \   another holds the lock is NOT a success. Every SQLite file is copied only through the online backup API.\n\
    \   Retention is 7 daily, 4 weekly and 12 monthly snapshots with a monthly restore drill (integrity check plus\n\
    \   a row-count trend). Irreplaceable categories get a second destination outside the one Google account.\n\
    5. Deletion. Store versions no lock references are listed with a COVERAGE REPORT (which repos, archives,\n \
    \  Inside Success repos and machines were and were not scanned) and are moved to cold storage for at least 90\n\
    \   days before deletion, with Brian's say. A purge procedure for secrets, personal data and hand-offs overrides\n\
    \   immutability and covers the store, Drive current/ and replaced/, snapshots and trash, leaving a tombstone\n\
    \   (data_library's `custody.retention_or_tombstone`).\n6. Observation. A daily scan, run from project-meta's\
    \ health report, records: the age and verified state of each\n   backup job; unresolved references and checksum\
    \ mismatches; private data referenced from public or Inside\n   Success repos; a content-checksum inventory\
    \ for every file size (the same path with a new checksum is an\n   in-place edit; timestamps are not used);\
    \ and new hard-coded `~/projects/data` references against the\n   baseline of 796 existing ones, warning only\
    \ on new ones.\n7. Ownership. personal-file-infra owns backup; data_library owns the catalog and locks; project-meta\
    \ owns the\n   daily scan until AES takes the policy over.\n"
  applies_kind: intent
  applies_value: When a project reads prompts or data from outside its repository, manages shared or large datasets,
    produces run archives, publishes data-dependent work, backs up live databases, or deletes stored data versions.
