- id: hollow-build-detection
  disposition: keep
  quote: "When authoring or accepting an acceptance suite, determine which requirement\n  fails if the product does\
    \ nothing at all. If no requirement fails, the suite\n  cannot detect a hollow build: extend it with an end-to-end\
    \ check before any\n  score from it is reported as evidence of function."
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-21-hollow-build-detection.yaml
  reason: The workspace instructions require verification through the user's entrypoint and warn against proxy evidence,
    but they do not state the specific hollow-build test for acceptance suites or require adding an end-to-end check
    when a do-nothing implementation would pass.
  rule: Do not describe a deliverable as working, complete, passing, or ready on the strength of a test result alone.
    Before that claim, execute it through the entrypoint a user would use, read the actual output, and confirm the
    output is correct. State the evidence class explicitly; "tests pass", "I read the code and it looks right",
    and "I ran it and the output was correct" are distinct claims and only the third supports "working". When authoring
    or accepting an acceptance suite, determine which requirement fails if the product does nothing at all. If no
    requirement fails, the suite cannot detect a hollow build and must gain an end-to-end check before any score
    from it is reported as evidence of function. The same test applies to an integration boundary exercised only
    by a provider-free or fake executor.
  applies_kind: intent
  applies_value: When claiming a deliverable is working, complete, passing, or ready, or when authoring, accepting,
    or reporting results from an acceptance suite or integration evaluator.
