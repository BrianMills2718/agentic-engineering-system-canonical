- id: spotlight-tour-default
  disposition: keep
  quote: anchor each step to the live element by selector; never a screenshot, redraw or approximation;
  quote_from: source_doc
  quote_source: policy/proposals/2026-09-05-spotlight-tour.yaml
  reason: This rule specifies detailed requirements for spotlight tours (selector anchoring, word limits, navigation
