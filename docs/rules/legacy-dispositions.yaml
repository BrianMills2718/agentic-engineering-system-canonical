- id: outcome-continuation-lease-hard-gate
  disposition: keep
  quote: Separate authorization from continuation evidence. For non-trivial coding-agent work, a user instruction
    authorizes actions only while a valid outcome lease exists. An ordinary approval, "continue", "never stop",
    plan, green test suite, commit, merge, or agent completion report does not create, renew, widen, or revive that
    lease.
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-20-outcome-continuation-lease-hard-gate.yaml
  reason: This rule is not covered by any AES rule or workspace instruction. The workspace instructions discuss
    outcome authority and continuation generally, but do not require a lease, evidence receipts, or define the detailed
    lease/recovery/break-glass mechanics this rule specifies. The rule is a real, useful requirement for coding
    agents working on non-trivial Brian-owned projects, as evidenced by the source document's problem statement
    about project cycles without durable user outcomes. The source document, linked scripts, and intent are all
    present and verified by FILE FACTS.
  rule: 'Separate authorization from continuation evidence. For non-trivial

    coding-agent work, a user instruction authorizes actions only while a valid

    outcome lease exists. An ordinary approval, "continue", "never stop", plan,

    green test suite, commit, merge, or agent completion report does not create,

    renew, widen, or revive that lease.


    Each write-authorized product lineage binds to one immutable

    OutcomeContractV1 containing: owner class, project and predecessor lineage,

    intended person or consuming system, plain-language outcome, canonical

    starting state/input/action/observable result, explicit failure signal,

    baseline revision, allowed scope, and the dimensions on which progress can be

    demonstrated. A materially changed actor, outcome, or canonical example is a

    new reviewed contract revision, never an in-place repair of disappointing

    evidence.


    A lease remains active only through independent OutcomeProgressReceiptV1

    evidence from the canonical journey. The receipt distinguishes behavioral

    progress from substrate/process evidence and binds the observation to exact

    source, configuration, route, command, trace when applicable, and prior

    receipt. Cost may be retained as telemetry but has no authorization or

    renewal effect. A receipt renews continuation only for one of three outcomes:

    (1) `behavioral_advance`, where the canonical journey becomes materially more

    reachable, correct, representative, useful, or adopted; (2)

    `direct_blocker_removed`, where an exact observed failure is eliminated and

    the same journey is replayed; or (3) `decision_changing_learning`, where a

    bounded authentic probe rules out a live approach or resolves an uncertainty

    and changes the next project decision. Repeating a known result, producing a

    new local variation, or learning without changing a decision is not progress.

    Tests, plans, schemas, governance coverage, and worker assertions can support

    a receipt but cannot renew a product lease by themselves. A governance or

    shared-infrastructure project earns progress only through an intended

    consumer path; the number of repositories receiving a control is not outcome

    evidence.


    Before the canonical outcome is observed, two consecutive non-outcome

    increments or the existing goal-equivalence time boundary require an exact

    replay or progress readout. The time boundary is an attention trigger, never

    a lease expiry while progress evidence remains current. A failing replay may

    issue a bounded RecoveryLeaseV1 for either its reproduced direct blocker or

    one diagnostic question whose possible answers change the next decision. The

    recovery lease names the failure or question, changed causal hypothesis,

    allowed actions and paths, exact replay or readout, and stopping condition.

    It cannot authorize a new front door, framework, compatibility layer,

    governance rollout, unrelated cleanup, or successor repository. A third

    failed attempt at the same boundary without new discriminating evidence moves

    the outcome to stalled and revokes ordinary continuation authority.


    A stalled outcome permits passive inspection, exact journey replay, evidence

    preservation, parking, and closeout. Further diagnostic or repair work needs

    a bounded recovery or break-glass lease; "keep investigating" is not an

    unbounded exception. A stalled outcome denies new implementation plans, write

    claims, worktrees, commits, successor repositories, and automatic movement to

    a different unblocked phase. The agent must not reinterpret an ordinary user

    approval as an override or coach the operator around the gate.


    The initial portfolio ceiling is one active product outcome lease per

    repository-governance owner class plus one global, bounded maintenance or

    external-obligation lease. Existing project status labels are not rewritten

    in bulk, but a repository without an available outcome lease cannot acquire

    new product write authority. An unregistered repository has owner class

    `unregistered` and cannot receive a product lease until the Project Graph

    records its identity and lineage. Creating another project, plan lineage, or

    version with a materially equivalent outcome does not reset WIP, attempts, or

    failure history.


    An operator can deliberately break glass, because human authority cannot be

    made impossible to exercise, but casual approval is not break glass.

    BreakGlassContinuationV1 must be created through a deliberate out-of-band

    command that ordinary conversational approval cannot satisfy and must state

    the prior failed evidence, one changed causal hypothesis, one bounded action,

    the next canonical observation, and the final stopping condition. It does

    not request or constrain money. At most one active break-glass extension

    exists per outcome revision. A further extension requires parking the old

    lineage and an independent restart review that produces RestartDeltaV1; the

    restart retains the old outcome and failure lineage and proves what causal

    mechanism is actually different.

    '
  applies_kind: always
  applies_value: any non-trivial Brian-owned coding-agent work
  input_sha256: b3c5d75c970459c44dbbcbef6b291297f01de67dc8b64ae97b18daa66b62e57f
  source_facts:
    source_docs:
      policy/proposals/2026-08-20-outcome-continuation-lease-hard-gate.yaml: true
    linked_scripts:
