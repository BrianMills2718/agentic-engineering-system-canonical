- id: derived-project-workspace-views
  disposition: keep
  quote: 'When operator workspace views are created, they derive from canonical project

    membership and repository checkout metadata.'
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-22-derived-project-workspace-views.yaml
  reason: 'Offline source review: use the full current declared source; retain the complete canonical policy.'
  rule: 'When operator workspace views are created, they derive from canonical project

    membership and repository checkout metadata. VS Code multi-root workspaces and

    symlinked focus/recent/all views resolve stable repository IDs to canonical

    checkouts through explicit machine configuration and never own project

    membership, source revisions, Git state, or implementation authority. Their

    absolute paths are disposable machine-scoped output, not durable references.


    For VS Code, agents maintain one generated `.code-workspace` per human project,

    not one workspace per repository, task, or temporary "mode." The workspace is

    the complete bounded project view: every manifest member whose workspace mode

    is `default` or `on_claim` appears at its canonical checkout, while `hidden`

    members remain absent. The historical `on_claim` name identifies an actionable

    supporting member; it no longer makes project membership invisible.


    An active healthy write-capable claim from the exact current session substitutes

    that member''s canonical checkout with the claim''s worktree. Releasing, expiring,

    or invalidating the claim restores the canonical checkout; it does not remove

    the repository from the project view. Multiple same-session worktrees for one

    member, unknown project IDs, and missing paths fail loudly instead of guessing.


    The owning agent regenerates the same workspace after acquiring the primary

    claim, after acquiring or releasing a supporting claim, and before handoff or

    closeout when claim health changed. The update is atomic and idempotent. VS Code

    observes the changed workspace file in the already-open project window, so the

    operator does not manually use Add Folder to Workspace or Save Workspace As.


    A pinned shallow-submodule finder or mega repository is optional. It is used

    only for a demonstrated need such as a reproducible cross-repository source

    snapshot, offline combined search, or revision-bound evidence. It is read-only

    for implementation work and never replaces canonical repository checkouts.

    '
  applies_kind: actions
  applies_value: generating or updating operator project workspace views
