- id: preflight-before-declaring-access-unavailable
  disposition: keep
  quote: 'An agent must not state in user-facing output that it lacks access to a host,

    repository, account, service, or credential until it has executed the

    documented access preflight for that target and can name what it ran.


    For Inside Success VPS and source access the preflight is the sequence in

    project-meta/docs/ops/INSIDE_SUCCESS_RECOVERY_ACCESS.md: read the page, run

    the standard local helper (`~/.local/bin/inside-success-server2-ssh` on

    Brian-managed workstations), then probe explicit identities with

    `IdentitiesOnly=yes`. For GitHub the preflight is GITHUB_ACCOUNT_ROUTING.md,

    including `gh-insidesuccess repo view <owner>/<repo>` before any access claim.


    When reporting a failure, name the exact account, helper, and failure class.

    "Permission denied (publickey)" or "remote: Repository not found" on a

    documented route is a routing result to report as such, not evidence that

    access is absent.


    A deliberate control that refuses the action - a branch-protection ruleset, a

    read-only source-audit role - is a different outcome from missing access.

    Report it as a control and follow the route it wants; do not work around it.

    '
