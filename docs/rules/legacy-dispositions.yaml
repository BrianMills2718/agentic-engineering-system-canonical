- id: ownership-is-not-a-mutation-gate
  disposition: keep
  quote: "Ownership of a repository by someone other than the current user is not by\nitself a mutation gate. When\
    \ all of the following hold, land the change and\nnotify the owner afterwards rather than waiting for review:\n\
    \n  - the current user has write or contributor access;\n  - the change is recoverable through ordinary git\
    \ (revert or reset to a\n    pushed ref), with no data deletion, force-push over unbacked objects,\n    deployment,\
    \ package publication, or external announcement;\n  - the repository's own required checks pass;\n  - the current\
    \ user has approved the work or it is within standing\n    repository authority.\n\nWrite the pull-request body\
    \ as a finished, explained change the owner can\nrevert, not as a request that must be answered before anything\
    \ happens.\n\nDo not record \"waiting on <person> to review\" under \"Need anything from\nhuman\" when what\
    \ is being waited on is review of already-working, revertible\ncode. Reserve that field for irreversible actions,\
    \ spend, external\npublication, and repositories explicitly marked read-only.\n"
  quote_from: legacy_registry
  quote_source: project-meta/policy/registry.yaml#policies/ownership-is-not-a-mutation-gate/policy
  reason: 'Offline conservative retention: applicability needs a nonempty value. Routing review remains separate.'
  rule: "Ownership of a repository by someone other than the current user is not by\nitself a mutation gate. When\
    \ all of the following hold, land the change and\nnotify the owner afterwards rather than waiting for review:\n\
    \n  - the current user has write or contributor access;\n  - the change is recoverable through ordinary git\
    \ (revert or reset to a\n    pushed ref), with no data deletion, force-push over unbacked objects,\n    deployment,\
    \ package publication, or external announcement;\n  - the repository's own required checks pass;\n  - the current\
    \ user has approved the work or it is within standing\n    repository authority.\n\nWrite the pull-request body\
