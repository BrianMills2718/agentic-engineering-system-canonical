- id: bounded-experiment-lane-continuity
  disposition: keep
  quote: 'A bounded cross-project or consumer experiment records three roles: `owning_lane`, `consumer_or_fixture`,
    and `return_boundary`.'
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-22-bounded-experiment-lane-continuity.yaml
  reason: The legacy rule's requirement—lane roles and continuation semantics for bounded experiments—is not covered
    by any AES rule or workspace instruction. The AES register and workspace instructions contain no equivalent
    rule about experiment lane continuity, ownership transfer, or return boundaries. The source document is present
    and the rule is a real, useful requirement for coding agents handling bounded experiments.
  rule: "1. A bounded cross-project or consumer experiment records three roles:\n   `owning_lane`, `consumer_or_fixture`,\
    \ and `return_boundary`.\n2. Using material from a consumer or fixture does not transfer ownership of\n   the\
    \ active lane.\n3. After the experiment reaches its terminal state, an unqualified\n   \"continue\" or \"resume\"\
    \ returns to `owning_lane`; it must not follow a\n   downstream implication into `consumer_or_fixture`.\n4.\
    \ A lane switch requires an explicit user request naming the new outcome or\n   an already accepted plan whose\
    \ scope owns both lanes.\n5. A terminal stop rule remains controlling for the consumer experiment.\n   \"Continue\"\
    \ means continue eligible work in the owning project, not\n   override the stop rule or enter the consumer project.\n"
  applies_kind: actions
  applies_value: bounded-experiment-resume
