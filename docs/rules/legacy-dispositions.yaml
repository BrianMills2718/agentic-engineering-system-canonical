- id: declare-data-model-for-non-obvious-systems
  disposition: keep
  quote: 'A repository whose system has a data model that cannot be correctly inferred

    from its runtime artifacts MUST declare a structured gate in

    `scripts/relationships.yaml` under `required_reading.gates`. The gate names

    a stable id, the document describing the model, the file scopes whose

    interpretation depends on it, and a plain-language reason. Its AGENTS.md

    SHOULD route human readers to the same model under a "## Read First"

    heading without becoming the machine-enforced predicate itself.


    "Cannot be correctly inferred" is the test, not "is complex". A reified,

    n-ary, event-sourced, bitemporal, CQRS, or otherwise indirected model

    qualifies, because its artifacts look like a defect to a reader expecting the

    direct form. An ordinary CRUD schema does not.


    When dispatching subagents over such a system, the model statement MUST

    appear in every subagent prompt. Agreement between agents sharing a premise

    counts as one observation, not several.


    Findings about such a system SHOULD be labelled `Measured:` or `Inferred:`.

    Measurements survive a wrong model; interpretations do not, and blending them

    into one narrative hides which is which.

    '
