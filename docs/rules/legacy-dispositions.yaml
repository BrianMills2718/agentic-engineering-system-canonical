- id: unattended-failure-must-reach-a-person
  disposition: keep
  quote: must deliver its failures and its degraded
  quote_from: source_doc
  quote_source: policy/proposals/2026-08-23-unattended-failure-must-reach-a-person.yaml
  reason: The current rules require unattended failures to reach a user and an agent, but they do not fully state
    the legacy requirements to distinguish quiet, failed, and degraded runs, report degradation duration, and limit
    conclusions based on fallback results.
  rule: An unattended job -- anything that runs on cron, a timer, or a hook rather than because a person invoked
    it -- delivers its failures and degraded states to a channel the operator actually receives, not only to a log
    file, a status file, or stderr. Such a job must render 'ran and found nothing', 'could not run', and 'ran degraded'
    differently; a run that produced no output because a dependency was dead must never look like a quiet day. A
    persisting degraded state reports how long it has persisted, so a chronic outage is visibly different from a
    transient one. A caught exception that substitutes a weaker result for the intended one marks the record degraded
    and caps any conclusion drawn from it. Writing the failure to a file remains required for provenance; it is
    not sufficient for delivery.
  applies_kind: actions
  applies_value: creating or modifying scheduled, timer-driven, hook-invoked, pipeline, service, or daemon jobs
  input_sha256: 8bed438b23410bcd3709fab7a4cf440d80c661951cf37be7e31520cb8ec43792
  source_facts:
    source_docs:
