    is true), and the rule represents a real, useful requirement for coding agents.
  rule: "An agent drafting a Slack message must not include a sentence that describes\nthe message instead of being\
    \ it, and must answer only what was asked.\n\nSpecifically:\n\n- No sentence whose function is to characterize\
    \ the reply. \"Straight answer\n  on\", \"short version\", \"here's what I actually checked\", \"to be clear\"\
    . If\n  the answer is straight, giving it demonstrates that.\n- No claiming your own honesty or restraint. \"\
    I'd rather say that than hand\n  you noise\" grades yourself in front of the reader.\n- Answer the question\
    \ asked. Adjacent findings go in a separate message or\n  nowhere.\n- No headers or bold section labels in a\
    \ message under roughly six sentences.\n  A DLOA is a form and may use them; a reply is not.\n- Contrast pairs\
    \ only where the reader would otherwise believe the wrong\n  half.\n\nDo not use an AI-detector score as a target.\
    \ The detection research Brian\nholds at deep-research-report-ai-writing-detection.md says so directly, and\n\
    its metrics are built for long-form text.\n"
