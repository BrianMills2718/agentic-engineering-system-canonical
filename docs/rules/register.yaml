    discovery registration per client and scope. Use symlinks for identical content, shared implementations plus
    thin adapters for different client protocols, registries plus renderers for different configuration formats,
    one source-controlled location for scripts/tests/evals, and lifecycle disposition rather than synchronization
    for worktrees and other independent state. Root and meaningful subtree instructions are the essential project-context
    bootstrap into one integrated wiki. Consolidation starts with a first-pass bootstrap, improves the knowledge
    surface, reviews the fresh-agent journey, and revises instructions; verify delivery rather than inferring client
    loading or comprehension from file presence or parity.
