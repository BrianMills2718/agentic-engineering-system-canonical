  enforcement_mechanism: The always-on instruction surface constrains critical-path selection; the cross-client
    host hook injects the 45-minute non-blocking course check at the next PostToolUse boundary; adversarial-review
    starts from the canonical example; the shared plan validator reports missing User Outcome and Canonical Behavioral
    Example sections without failing legacy plans during calibration. Plan 0141 is the first outcome-reset pilot
