- id: stage-aware-verification-lanes
  rule: Every planned check belongs to a boundary, increment, or terminal lane. Boundary checks protect irreversible,
    shared-state, external, or one-use actions; increment checks cover affected surfaces; broad suites, authority
    reconciliation, coverage, full-trace review, and cleanup are terminal by default. Each slice declares a gate-time
    budget, protected decision, stopping rule, and evidence reuse key. A functional PoC requires the smallest real
    end-to-end observation, focused deterministic checks, full trace review, and honest non-claims. Held-out or
    golden-set expansion, comparative quality thresholds or model selection, and independent eval sign-off are non-blocking
    until the named decision concerns promotion, pilot readiness, release, kill/continue, or quality-based selection;
    plans must place them under that future decision rather than silently making them PoC acceptance gates. Exact
    LLM traces are recorded during observation and reviewed before interpretation, selection, promotion, or a works/done
    claim. Git dependency gates must separate the authorized execution revision and required capability ancestry
    from moving-upstream observation. Execution drift and missing required capability block. Unexecuted upstream
    movement may be report-only while execution is frozen. The invoking gate independently binds the required stage.
    Integration records an explicit relevance disposition for its reviewed snapshot, reports later unexecuted movement,
    and requires assessment before the authorized pin or protected compatibility claim expands. Exact evidence is
    reused while candidate bytes, executing dependency bytes, required ancestry, configuration, command, and claim
    scope are unchanged. Release uses an immutable pin and cannot configure unresolved upstream drift as report-only.
    Terminal verification and independent review freeze an immutable batch comprising the exact clean branch head,
    protected decision, and verification command. Later ready work queues into the next batch even when it touches
    shared authority. Only a blocker in the frozen scope may invalidate the current batch, with a recorded reason
    and a new freeze after the fix; unrelated scope expansion is prohibited.
