- id: wiki-first-navigation
  rule: Governed projects integrate all project documentation into one development wiki as the single human-and-agent
    project-information entrypoint. There is exactly one permitted shape, wiki/index.md at the repository root,
    for every governed repository regardless of size (owner ruling 2026-09-08 in WIKI_AND_DOCS_POLICY.md; no declared
    equivalent path and no README-only exemption). README and AGENTS.md are bootstrap routers, not competing knowledge
    narratives. Progressive topic synthesis connects goals, architecture, implementation, operation, roadmaps, requirements,
    plans, experiments, findings, decisions, limitations, and history to their native authorities. Structured experiment
    records feed this same wiki, exposing evidence, counterevidence, interpretation, decision impact, and observed
    costs without duplicating raw evidence or inventing learning scores. A cross-repository implementation route
    identifies the consumer responsibility, exact capability owner, native typed contract, producer and consumer
    entrypoints, forbidden duplicate, and consumer-adoption evidence before the seam changes. Wiki structure and
    page authority are independent; each page declares its role and lifecycle. Product/domain knowledge retains
    explicit scope and ownership within or through the integrated wiki, and generated source-local reference remains
    derived.
