- id: show-the-check-failing-before-trusting-it
  rule: 'When you write or materially change anything whose green result will later be

    read as evidence -- a test, an assertion, a guard, a control arm, an experiment

    gate -- name the input that would make it go red, then supply that input and

    observe it go red, before relying on it.


    If you cannot construct the failing case, the check is decoration: delete it or

    rebuild it. Do not leave it in place, and do not cite it.


    Check both directions. A guard must be shown to go red on a known-bad input AND

    green on a known-good one. Verifying only the first is the common half-measure;

    a guard that rejects its own valid inputs is caught by nothing else.


    For an experiment gate, compute what the control scores on the statistic''s own

    terms BEFORE freezing any threshold against it, and commit that measurement

    first.

    '
