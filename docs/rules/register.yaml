- id: trace-eval-verification-gate
  rule: A multi-stage LLM pipeline may be claimed 'works/verified/done' or merged only after its emitted TRACE passes
    trace_eval — record (llm_client) -> structure (named per-stage outputs) -> declare (a PipelineCase GROUNDED
    against an INDEPENDENT source, not the artifact the code produced) -> evaluate (trace_eval passes AND a MANDATORY
    corruption self-check flips it red) -> enforce (a committed durable artifact the re-auditor reviews). Judging
    the final answer is not verification.
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/trace-eval-verification-gate
  enforcement_status: advisory
  enforcement_mechanism: trace-verify skill (procedure); shared trace_eval grounding helpers (assert_independent/ground_context/corruption_selfcheck/write_gate_artifact)
    so gates are not re-derived into circular ones, plus a loud StubRubricJudge warning; per-project `make trace-eval`
    emits+grounds+writes a committed artifact and fails loud on a design/execution failure or a failed corruption
    self-check. STRUCTURAL HOOK exists (`trace_eval.gate_check` + a per-repo manifest of registered pipelines) —
    in staged/pre-commit mode it reads verdict-bearing inputs from the Git index, including source hashes, independent
    ground-truth hashes, and the artifact JSON itself, so restoring a clean working tree cannot hide a bad staged
    artifact. Hook-bound repos must not trust the mutable manifest as the only gate inventory; bind an independent
    expected-artifact list, validate manifest `source_files` against artifact `source_sha256` keys, and keep a negative
    control proving a staged manifest that drops a protected pipeline fails red. DIGIMON insidesuccess_ask is the
    hook-ENFORCED reference (proven to block stale/failing artifacts and pass fresh ones). Other repos adopt via
    a manifest + the shared check, so ecosystem-wide it stays per-repo adoption (pre-commit only; --no-verify bypassable;
    a CI backstop is future work).
  evidence:
    quote: A multi-stage LLM pipeline may be claimed 'works/verified/done' or merged only after its emitted TRACE
      passes trace_eval — record (llm_client) -> structure (named per-stage outputs) -> declare (a PipelineCase
      GROUNDED against an INDEPENDENT source, not the artifact the code produced) -> evaluate (trace_eval passes
      AND a MANDATORY corruption self-check flips it red) -> enforce (a committed durable artifact the re-auditor
      reviews). Judging the final answer is not verification.
    quote_from: legacy_registry
