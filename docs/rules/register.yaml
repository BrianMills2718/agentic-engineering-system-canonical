- id: project-workbench-evidence-ladder
  rule: Active projects with multi-step workflows, runtime pipelines, LLM calls, evaluation loops, ETL/dataflow,
    agent workflows, or other non-trivial machinery must produce and maintain a Project Workbench Contract Packet
    unless an explicit override is recorded. The packet must make the project inspectable as a visual evidence ladder
    from spec/bounded-design to synthetic fixture, fixture validation, live machinery, observed trace, and gate.
    For every phase, boundary, or node, the spec layer must expose purpose, typed inputs/outputs, contracts, schemas,
    data-flow edges, configuration dependencies, business rules, success criteria, failure modes, and evidence grade.
    Missing design, fixture, fixture validation, live trace, stale trace, missing gate, failed gate, and fixture-only
    evidence are warnings by default. A synthetic fixture can demonstrate shape but must not license more than C-grade
    evidence by itself; verified/done or production-ready claims require live trace and gate evidence or an explicitly
    accepted risk. Overrides must be written in the active plan or ADR with scope, rationale, owner, expiry/revisit
    condition, and the exact missing workbench layers; dashboards and workbench views must show the override as
    a warning.
