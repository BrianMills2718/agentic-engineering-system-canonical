- id: claim-end-requires-liveness-check
  rule: 'A process that ends, expires, prunes, or sweeps a coordination claim must first check the owning session''s
    liveness, and must not end a claim whose heartbeat is newer than the sweep''s own start time. When a claim is
    ended by anything other than its own session, the end record must name the actor and a specific reason; session_end_reason
    ''other'' is not sufficient for a non-self-initiated end. A session must not have its claim revoked without
    a signal it can observe: where a sweep legitimately ends a live claim it must leave a message in that session''s
    coordination mailbox, so the next mailbox inspection surfaces it rather than the next push failing with missing_branch_claim.
    An agent about to disposition another session''s stranded lane checks liveness first -- process, recent file
    activity, heartbeat versus end time -- and preserves the work rather than closing blind.'
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/claim-end-requires-liveness-check
  enforcement_status: partially-enforced
  enforcement_mechanism: 'scripts/check_claim_liveness_violations.py scans the claim registry for the three signatures
    the proposal measured -- heartbeat_after_end, unattributed_end, and mass_end -- so a sweep that revokes a live
    session leaves a visible trace. Detection only: the prevention half, refusing the session_ended transition when
    heartbeat_at is newer than the sweep start, belongs in enforced-planning''s claim lifecycle and is not built.
    First run on 2026-08-20 found 18 violations across 110 claims, reproducing the three heartbeat_after_end cases
    the proposal named. Wired into `make check-generated` on 2026-08-20 as report-only (|| true): it has live findings
    today, so failing the target would make the build permanently red and the signal would be ignored rather than
    acted on.'
  evidence:
