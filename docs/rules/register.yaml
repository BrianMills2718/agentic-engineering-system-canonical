- id: first-principles-before-comparative-evaluation
  rule: Select architecture and implementation from goals, requirements, failure modes, boundaries, reversibility,
    and established evidence by default. A blocking or consequential decision does not itself justify a comparative
    benchmark. Compare only when a material uncertainty is irreducibly empirical, candidates meet a common minimum
    capability contract or one variable can be isolated behind a common contract, the result would change the decision,
    and testing costs less than making a reversible choice. If fair comparison would require fully building and
    polishing multiple options, skip the bakeoff, choose behind a replaceable boundary, and validate the selected
    implementation against its own requirements. Landscape research, feasibility probes, implementation validation,
    and comparative benchmarking remain distinct.
