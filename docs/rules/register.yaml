- id: experiment-declares-mechanism-and-kill-condition
  rule: An experiment, benchmark, evaluation, or model comparison whose result is meant to drive a kill, continue,
    ship, or approach decision must record, before it runs - the mechanism by which the intervention beats the control
    (one sentence, naming what the intervention supplies that the control lacks), the predicted direction and rough
    size of separation with the sample size that could show it, and the kill condition that ends the series. If
    the honest mechanism is "it adds process" and the control already holds ground truth for the scored property,
    the experiment is refused rather than run. Work is ordered by cost-to-falsify, ascending - run the cheapest
    check that could invalidate the plan before building an instrument that costs more than roughly an hour. Each
    experiment names the previously recorded method rules that apply and states how the design satisfies each, or
    why one does not apply; a rule the design violates blocks the experiment until it is explicitly retired with
    a reason. A measurement an experiment invalidates is fixed or retired before the next experiment uses it. Triggered
    by the second experiment in a series against the same claim; a single exploratory probe needs no series apparatus.
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/experiment-declares-mechanism-and-kill-condition
  enforcement_status: advisory
  enforcement_mechanism: Prose only at promotion. The structural validator over experiment logs, the skill-index
    routing to evaluation-design, and the read-first surfacing of a repo's method-rules section are all described
    in the proposal and none is built. This entry therefore has no gate and will not fire on its own - which is
    the D1 failure the proposal itself documents, recorded here rather than hidden behind an optimistic tier.
  evidence:
    quote: "An experiment intended to support or refute a claim about an intervention must\n  record, before it\
      \ runs:\n\n  1. **Mechanism.** One sentence: the intervention beats the control because it\n     supplies\
      \ <what>, which the control lacks. If the honest answer is \"it adds\n     process\" and the control already\
      \ holds ground truth for the scored\n     property, the experiment is refused rather than run -- process cannot\
      \ beat\n     ground truth, and no increase in task difficulty changes that.\n  2. **Predicted separation.**\
      \ The direction and rough size of the expected\n     difference, and the sample size that could show it.\n\
      \  3. **Kill condition for the series.** What result, or how many experiments\n     without separation in\
      \ the predicted direction, ends the line of work. A\n     series with no kill condition cannot conclude, only\
      \ accumulate."
    quote_from: source_doc
    quote_source: policy/proposals/2026-08-24-experiment-series-declares-mechanism-and-kill-condition.yaml
    input_sha256: c977277532a93850b8701f075db750ef37ace3595f8980a7cb7e4cf1b4145820
  applies_when:
