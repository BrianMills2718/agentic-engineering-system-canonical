    verify backlink-index freshness. make wiki-graph-health-enforce and make project-graph-check hard-fail only
    calibrated deterministic graph defects: missing wiki directory, missing index.md, broken local reference, missing
    Markdown anchor, and unindexed required wiki page. Missing authority references, backlink semantics, and the
    semantic completeness of cross-repository adoption routes remain measured. Comprehensive knowledge coverage,
