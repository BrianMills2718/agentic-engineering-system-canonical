- id: operational-telemetry-provenance
  rule: 'A test, fixture, evaluation, benchmark, simulation, synthetic probe, or manual diagnostic must not

    write a record that is indistinguishable from authentic runtime traffic into

    an operational telemetry store.


    Tests default to an isolated temporary store or disabled emission. A test

    that deliberately exercises the production writer uses a test-owned store or

    writes machine-readable provenance identifying the record as non-production.


    Decision-bearing telemetry records carry an `origin_kind` with semantics

    equivalent to `authentic_runtime`, `test`, `evaluation`, `simulation`,

    `manual_diagnostic`, or `unknown`. A system may use a richer enum, but it must

    preserve those distinctions. Evidence about how code executed, such as

    trace_eval''s `live_provider`, `recorded_response`, or `deterministic` class,

    is a separate axis and does not establish that the traffic was authentic

    runtime usage.


    Every aggregator whose output can support a behavioral, quality, reliability,

    rollout, or stop decision reports counts by provenance and excludes test,

    fixture, evaluation, simulation, synthetic, and manual-diagnostic traffic

    from authentic-runtime rates by default. Those sources may support their own

    explicitly named evaluation or simulation metrics. Unknown provenance is

    reported separately and cannot be silently treated as authentic-runtime

    evidence. Historical data without sufficient provenance cannot establish an

    authentic-runtime rate.

    '
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/operational-telemetry-provenance
  enforcement_status: advisory
  enforcement_mechanism: Telemetry writers declare machine-readable origin provenance or isolate non-runtime emission.
    Aggregators separate counts by origin and exclude test, evaluation, simulation, synthetic, and manual-diagnostic
    records from authentic-runtime rates by default. Adoption is checked in each owning project through mixed-origin
    aggregation tests; no ecosystem hard gate is claimed.
  evidence:
