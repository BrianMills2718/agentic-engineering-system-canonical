- id: eval-signal-integrity
  rule: An eval/benchmark result may drive a decision (kill/continue, ship, choose) only when it passes eval-signal
    integrity — a positive control + build-adequacy precondition ('unavailable' is INVALID, not a low score), held-out
    cases per failure class with a fix that generalizes to unseen same-class cases (not tuned to the test), and
    an INDEPENDENT adversarial sign-off verifying the gates by execution. Self-attestation does not count. The held-out
    cases are a locked split the iterating agent never sees — fixed before iteration begins, not readable from the
    iterating agent's working context, and scored only by the independent verifier. An agent that has seen the held-out
    cases has not held anything out.
