    ObservedRun before fallible application validation, derives child traces from that run, and enables LLM_CLIENT_REQUIRE_OBSERVED_RUN=1
    after its entry-point audit. Domain provenance does not replace shared lifecycle evidence. Inspect outer-run,
    child lifecycle, and attempt records before attributing failure to a model or provider. max_budget is a technical
