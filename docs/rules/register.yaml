    the scope that will reach the next session rather than where it is convenient to write. When a user expresses
    confusion or frustration about how work is being conducted rather than about a defect in the work, the agent
    records it before continuing -- session-scoped preferences in agent memory, and anything another agent would
    also get wrong as a policy proposal -- and names in its response which was done. A proposal carries an owner
    and a decision and moves to accepted with a registry entry or to rejected with a reason. Amended on acceptance
    -- 2026-08-20 -- placing a rule in the workspace AGENTS.md is necessary but NOT sufficient. A cross-agent behavioural
    rule is adopted only when it also has a mechanism that fires on its own trigger and leaves a trace when skipped;
    recording a rule in prose alone does not resolve the friction and must not be reported as resolving it.
