- id: policy-session-bound-lane-lifecycle
  rule: A live coordination claim is attached to one exact runtime session. One session may own one unparented program
    root by default; related work declares parent_scope and intentional additional roots require explicit parallel
    authorization. A real SessionEnd retires exact-session live ownership without deleting recoverable Git state,
    and every preserved lane still requires resume, takeover, or sanctioned merge/recovery closeout.
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/policy-session-bound-lane-lifecycle
  enforcement_status: enforced
  enforcement_mechanism: Enforced Planning rejects a second unparented root for the exact runtime session before
    branch/worktree creation unless parallelism is explicit. The source-owned SessionEnd adapter atomically changes
    exact-session live claims to non-live session_ended audit records while preserving branch, worktree, tracker,
    and Git state. Plan close treats session_ended as closeable but nonterminal and still requires accepted merge
    or durable recovery evidence. Heartbeat staleness remains the fail-safe when a client crashes or cannot emit
    SessionEnd.
  evidence:
    quote: 'A claim whose worktree or branch still exists is refused (exit 1,

      naming `session-close`); close that lane with `make session-close`.'
    quote_from: source_doc
    quote_source: ~/code/enforced-planning/docs/guides/WORKTREE_COORDINATION_OPERATOR_GUIDE.md
