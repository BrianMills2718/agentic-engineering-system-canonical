- id: deferred-plan-artefact-carries-its-status
  rule: 'An artefact whose owning plan is deferred, bounded, proof-of-concept, or otherwise incomplete carries that
    status where it is consumed, not only in the plan. When such an artefact is made a default, the default''s declaration
    states the limitation and names the owning plan. Size is not coverage: an artefact must not present a count
    of predicates, rows, or entries as evidence of fitness while its owning plan records the corresponding quality
    step as outstanding. Before building a replacement for a capability an existing artefact appears to lack, an
    agent checks the owning plan''s status and searches the repository for unwired prior work — a deferred plan
    is evidence the capability may exist and be unconnected, not evidence that it is absent.'
