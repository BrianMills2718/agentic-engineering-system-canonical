- id: enforcement-leaves-its-remedy-reachable
  rule: A gate must leave its own remedy reachable by the actor it blocks. A refusal that denies the agent's turn
    must guarantee a subsequent turn in which the agent can comply; it must name the exact command or edit that
    clears it, runnable from the state the refusal leaves behind; it must accept every reasonable spelling of compliance,
    rejecting ambiguity rather than formatting; a time-based grace window that can expire into a permanent refusal
    delays the deadlock rather than removing it; and an escape hatch only a human can operate does not satisfy the
    rule for a check meant to run unattended.
