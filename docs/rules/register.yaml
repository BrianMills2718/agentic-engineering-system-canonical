- id: no-prose-string-matching
  rule: No check may infer meaning by string-matching prose. Where a decision is semantically related to free text
    written by a model or a person, the default mechanism is a light LLM (claude-code/haiku on Claude Code, codex/gpt-5.6-luna
    on Codex; both already in the llm_client execution allowlist). Parsing structured output is permitted only where
    Brian has approved it for that specific gate, and approval is incomplete until the producing agent is instructed
    to emit the fields -- a structured path nothing emits is a dead branch behind a prose fallback. Regex, membership
    tests, and string predicates over code, configuration, identifiers, paths, and other grammar-bearing text are
    unaffected; this policy is about prose only.
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/no-prose-string-matching
  enforcement_status: partially-enforced
  enforcement_mechanism: An AST check flags regex, membership, and string-predicate operations applied to values
    recognised as carrying prose, with taint tracked one hop by name within a module. It carries its own non-vacuity
    guard - a corpus in which no known prose name appears exits 2 as NOT_CHECKED rather than 0, because a name-based
    scanner whose vocabulary misses the corpus reports a clean run while matching nothing. A reasoned '# prose-matching-exempt:'
    comment is where an approved exception becomes visible in the code; a bare marker with no reason is still a
