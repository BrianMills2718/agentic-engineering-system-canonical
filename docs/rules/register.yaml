- id: systemic-defects-preempt-local-work
  rule: 'A reproduced defect in a shared ecosystem control, capability, policy, or

    integration that can affect multiple projects or future agents takes priority

    over the current local task. The agent pauses the local task at an exact

    resumable state and immediately repairs the systemic defect when authorized

    and safe. If direct repair is outside authority or cannot proceed, the agent

    durably routes it to an explicit owner with reproduced evidence, required

    action, and exact resume event before returning to local work.


    Preemption never replaces the containing user goal. After the systemic issue

    is repaired or durably routed, the agent resumes that goal automatically from

    its recorded next action. A local inconvenience, speculative refactor,

    curiosity, or unproven possibility is not systemic and does not preempt.

    Classification must name the affected shared seam, reproduced failure, likely

    blast radius, and why continuing local work would compound the problem.

    '
