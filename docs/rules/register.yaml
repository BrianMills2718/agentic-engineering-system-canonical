    -->) and cross-references every configured default in config/*.yaml against its artefact''s declared owning_plan.
    It reports ''undeclared_owner'' where no plan link exists, and ''incomplete_owner_no_caveat'' where the owning
    plan is deferred/bounded/PoC and the default declares no provisional caveat. First run against onto-canon6 on
    2026-08-20 reported both of its configured defaults as undeclared_owner, which is the motivating case: linguistic_core
    is the default extraction vocabulary while its owning Plan 0147 is deferred-after-bounded-poc. The artefact-to-plan
