- id: outcome-first-critical-path
  rule: Every non-trivial implementation plan preserves a plain-language user outcome and one canonical behavioral
    example. Each increment is classified as vertical, direct_blocker, enabler, or hardening. Before the example
    is observed, only vertical work and demonstrated direct blockers belong on the critical path; enablers and hardening
    cannot advance product status. Behavioral evidence is reported separately from substrate/process evidence. Execution
    optimizes for expected user-visible value or decisive learning per wall-clock hour. At the earliest of roughly
    45 minutes, two consecutive non-outcome increments, or user concern about pace, a non-blocking course check
    asks what would make the result substantially more impressive or useful in the next 30–60 minutes and compares
    it with the current path. The agent switches reversible in-scope tactics when another action is materially better;
    the check creates no plan, report, approval gate, or narrower success criterion. Adversarial review attempts
    the canonical example before reviewing internal substrate claims.
