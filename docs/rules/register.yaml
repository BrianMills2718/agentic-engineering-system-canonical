- id: worktree-lifecycle-disposition
  rule: The canonical checkout remains clean on the canonical default branch and mutating task work occurs in a
    claimed in-repo linked worktree. Completed desired work defaults to verified integration into the canonical
    default branch followed by claim release, worktree removal, and safe local-branch deletion. Every non-merge
    or stale lane requires an explicit disposition before cleanup; cleanliness alone never proves a committed branch
    is safe to delete.
