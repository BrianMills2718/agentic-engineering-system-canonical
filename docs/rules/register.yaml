- id: input-surface-failure-triad
  rule: Every new input surface (file, registry, config, watched repo, API response) loads through a contained loader
    (parse failure => unit-scoped error result, never an uncaught exception; optional-and-missing => loud coverage-loss
    warning, never silence) and ships missing/malformed/valid tests in the same commit. Lifecycle state (flags/queues/cursors)
    additionally gets cycle tests that complete one full cycle and start a second.
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/input-surface-failure-triad
  enforcement_status: advisory
  enforcement_mechanism: Reference implementation + repo AGENTS.md rules in adopting repos (claimcheck); ecosystem-wide
    visibility via scripts/scan_input_surfaces.py (grade-D call-site inventory, never a gate). No blocking gate
    anywhere yet — visibility before enforcement.
  evidence:
    quote: "When adding ANY new input surface (file, registry, config, watched repo, API\n  response) to a program:\n\
      \  1. Route loading through the module's shared contained-loader (or create one):\n     parse failure => a\
      \ contained error result for that unit (file/claim/substrate),\n     never an uncaught exception; the blast\
      \ radius is the unit, never the run.\n  2. Declare the input required or optional AT THE CALL SITE. Optional\
      \ + missing\n     => a loud coverage-loss warning in the output (\"checked WITHOUT X coverage\"),\n     never\
      \ silence.\n  3. Before committing, the test suite must contain the failure triad for that\n     surface:\
      \ missing input, malformed input, valid input.\n  4. For lifecycle state (flags/queues/cursors): tests must\
      \ complete one full\n     cycle AND start a second (trigger -> resolve -> re-trigger)."
