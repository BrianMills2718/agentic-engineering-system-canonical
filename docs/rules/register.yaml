- id: workspace-root-project-manager-target-separation
  rule: 'Keep four concepts separate: the navigation or launch directory, the explicit

    read target, the claimed write target, and mutation authority. A native session

    launched from the workspace root may select one Project-Graph-registered

    repository as its read target and load that repository''s instructions without

    a claim. A read target never authorizes mutation. Mutation requires the exact

    healthy claim and claimed worktree required by the governed repository; zero

    or multiple matching claims fail closed.


    "Project Manager" is the user-facing role and may directly implement bounded

    single-writer work by default. "Orchestrator" names the internal dispatch and

    coordination mechanism. A Project Manager becomes delegation-only only when

    Brian explicitly designates the session coordinator-only.


    Portable frameworks expose generic repository-identity, read-target, and

    authorization interfaces. Brian-specific repository eligibility and ownership

    rules belong to the Project Meta adapter and must not be hard-coded into a

    portable framework.

    '
  origin: legacy-migrated
  source: project-meta/policy/registry.yaml#policies/workspace-root-project-manager-target-separation
  enforcement_status: partially-enforced
  enforcement_mechanism: Installed session-target and prewrite hooks separate read targeting from claim-derived
    mutation authority. Enforced Planning consumes a strict digest-pinned generic decision, while Project Meta's
    adapter supplies the personal repository policy.
  evidence:
    quote: "Keep four concepts separate: the navigation or launch directory, the explicit\n  read target, the claimed\
      \ write target, and mutation authority."
