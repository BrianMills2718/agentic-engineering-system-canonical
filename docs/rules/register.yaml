    not represented as live computed enforcement at promotion and remains an implementation candidate.
  evidence:
    quote: "1. Three kinds of data, three homes. (a) Prompts, ontology packs, schemas and small fixtures live in\
      \ Git with\n   the project that owns them. (b) Large or shared datasets and corpora live in one backed-up\
      \ store as\n   immutable, read-only versions identified by checksum; a version is never edited, a change is\
      \ a new version.\n   (c) Run outputs and archives live in `~/projects/data` and are backed up.\n2. A project\
      \ that uses anything from outside its own repo commits a lock entry naming it, its version and its\n   checksum.\
