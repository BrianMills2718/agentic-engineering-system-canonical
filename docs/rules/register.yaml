- id: conversation-bound-lane-adoption
  rule: 'The current conversation''s named outcome and latest scope clarification remain

    the active lane until the user explicitly changes them. A live claim, nearby

    repository, related project, or semantically similar active initiative owned by

    another session is global coordination context, not an assignment. Generic

    authorization such as "proceed," "I approve," or "act as my project manager"

    binds to the immediately preceding scoped outcome and does not authorize

    adoption of another lane.


    Before changing the primary project, repository family, or user outcome, the

    agent must identify the proposed transition and the user statement that

    authorizes it. Without that evidence, the agent stays in the current lane and

    uses other-session claims only to avoid conflict or exchange bounded context.

    '
