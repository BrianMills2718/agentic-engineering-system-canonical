- id: shared-graph-visualization-routing-and-preferences
  rule: 'Before creating or materially changing a graph UI in a Brian-owned project, agents

    identify the semantic graph model and primary operator task, inspect the registered

    graph capability owner, and reuse its typed projection or adapter seam. A project-local

    renderer declares a visible bounded exception when that owner cannot meet the need.


    View selection follows the represented meaning rather than library convenience:

    layered layouts serve directed hierarchy or flow; parent containment serves one

    primary structural hierarchy; many-to-many community membership remains an independent

    hyperedge relation and uses an overlap-aware region view whose geometry is checked

    against membership; exact high-cardinality intersections use a coordinated incidence

    or UpSet-style view instead of a literal all-set Venn diagram as the sole truth surface;

    and 3D is used only when the third dimension carries domain meaning or measured task

    benefit, not merely to escape difficult 2D overlap.


    Each graph surface records the selected graph family, layout, renderer/adapter owner,

    membership semantics, first-load insight, and active operator preference profile in

    its existing UI registry or continuity contract. Brian''s default profile preserves a

    dark unframed exploration canvas, shaded enclosing hyperedges rather than star

    expansion, exclusion of nonmembers from hyperedge regions, the established

    visualization family during iteration, an insight-bearing first load, linked

    overview/detail evidence views, and inspection before stakeholder review.

    '
