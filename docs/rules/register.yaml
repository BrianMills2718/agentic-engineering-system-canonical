schema_version: aes-rules-register/v1
about: 'The rules agents in Brian''s workspace are expected to follow, with how each is enforced and where its evidence
  is. Fields follow project-meta policy/registry.yaml (id, rule, source, enforcement_status, enforcement_mechanism,
  feedback_path); feedback-loop rules add evidence, licence key and effect. project-meta''s 263-rule register is
  legacy: docs/rules/RULES.md shows it read-only, and a legacy rule moves here only when the feedback loop gathers
  evidence for it or retires it.'
enforcement_statuses:
  enforced: a hook, gate or check refuses the violation
  partially-enforced: enforced on some paths only
  checked: a check reports violations but does not refuse them
  advisory: written instruction only
  licensed: the feedback loop licensed it from evidence and handed it to agents; not yet adopted
  withdrawn: licence withdrawn; kept for the record
rules:
- id: root-cause-over-symptom
  rule: Fix a recurring problem where it originates (the shared tool, library, hook or policy); a local workaround
    is allowed only while that fix is filed, and the agent says which it applied.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; nothing checks it.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: integrate-before-build
  rule: Adopt what already exists, else combine or fork off-the-shelf systems; build only what a landscape review
    shows nothing covers, naming why.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; nothing checks it.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: plan-nontrivial-work
  rule: Non-trivial work runs under an adopted Company Planning plan sized to it; trivial changes (at most 3 files
    and 60 lines, touching nothing that runs) need none.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: enforced
  enforcement_mechanism: 'The AES commit rule refuses a non-trivial commit without a [Goal <plan_id>] or [Plan #N]
    tag (`aes commit check`, installed on every hook path).'
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: commit-tags
  rule: 'Every commit''s first line starts with one tag: [Plan #N], [Goal <plan_id>], [Trivial], [Auto], [Unplanned]
    with an Emergency line, or [Shaping <plan_id>].'
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: enforced
  enforcement_mechanism: The AES commit rule (`aes commit check`) refuses a commit without a valid tag and names
    the fix.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: observable-fast-work
  rule: Long jobs run detached with per-step timing; an outside call that fails the same way twice is treated as
    down; only changed inputs are rebuilt.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; nothing checks it.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: md-file-cap
  rule: A repository Brian owns keeps at most 100 tracked Markdown files (unless a reasoned exception file says
    otherwise) and every reader document is reachable from wiki/index.md within two links.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: checked
  enforcement_mechanism: project-meta scripts/md_file_cap.py checks both rules and keeps one concern open while
    a repository breaks either. On 2026-10-08 no timer for it was found on the laptop.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: loud-failures-reach-an-agent
  rule: A service, timer or pipeline that errors, skips a run or misses a heartbeat tells any waiting user and opens
    a keyed concern an agent works, within minutes.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; each service implements it itself (for example, ui-index and control-publish
    open a keyed concern on failure).
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: read-the-trace
  rule: Before reporting a score or naming a cause for any graded run, open the full trace of every failing or surprising
    item and a sample of passes.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; nothing checks it.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: situation-declared-checklists
  rule: Planning, writing and representation work declare their situation as yes/no facts through the domain's command,
    then check off that situation's checklist with evidence.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: partially-enforced
  enforcement_mechanism: Portfolio articles are gated at merge and deploy by tools/check_article_review.py; Company
    Planning checks it at plan adoption (quick-adopt / adopt); Representation Router dispositions are recorded but
    not counted.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: ui-tooltips-default
  rule: Every UI control an agent builds shows a styled tooltip within about 200 ms of hover or focus, and on tap
    on phones; verified in a real browser.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; verification is the building agent's own browser test.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: recommendations-not-question-lists
  rule: Settle what checking can settle, then give Brian approvable recommendations with safe defaults, never a
    list of open questions.
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only; nothing checks it.
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: cross-owner-policy-override-protocol
  rule: 'Acting outside another project''s policy domain follows the cross-project notification protocol: find participants,
    draft, send only after exact-content approval, log the result.'
  origin: workspace-instructions
  source: projects-dotclaude AGENTS.md (the workspace instruction file every Claude Code and Codex session loads)
  enforcement_status: advisory
  enforcement_mechanism: Instruction only (procedure in WORKING_RULES.md).
  feedback_path: 'feedback record: an `obs (control)` line naming the Policy id'
- id: jev-m1-merge-reads-exit-code
  rule: Do not run `gh pr merge` after a check whose commands were joined with `;`; the check's exit code must be
    read before merging.
  origin: feedback-loop
  source: agent-skills contracts/client-config/jev/merge_guard.py (#453)
  enforcement_status: enforced
  enforcement_mechanism: Jev gate rule M1, installed at ~/.local/bin/jev-gate-merge-guard and wired into jev-gate-hook
    for Claude Code and Codex.
  evidence:
    adopted_from:
    - loop-387
    - loop-389
  effect: the effects step counts recurrences for 30 days from 2026-10-08
  feedback_path: agent-feedback-log (Feedback field lines)
- id: loop-378
  rule: Require that every replay or backtest document declares its population boundary as a structured field, and
    that every documented tool-invocation route embeds explicit environment pre-checks so an agent cannot reach
    a success-or-failure output via a path whose preconditions are unmet.
  intent: Prevent
  origin: feedback-loop
  enforcement_status: withdrawn
  enforcement_mechanism: 'Withdrawn 2026-10-08: the problem behind it joined two unrelated incidents (#202, #221)'
  evidence:
    sightings: 2
    problem: null
    concern: https://github.com/BrianMills2718/agentic-engineering-system-canonical/issues/378
  licence_key: feedback-rule-prob-01c29416f2-9addbd70
  handed_at: '2026-10-08'
  effect: not yet watched
  feedback_path: agent-feedback-log (Feedback field lines; the nightly collector files them)
- id: loop-379
