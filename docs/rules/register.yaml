    links repository-native authorities rather than copying or replacing them.

    Durable repository and document references use the unique stable ID of a

    Project Graph record whose record_kind is repository, an exact revision or

    typed digest when evidence requires one, and a repository-relative path. A

    project-composition ID cannot substitute for repository identity. Machine

    absolute paths are resolved placement, not identity or authority references.


