schema_version: "0.1-pilot"
repository:
  id: agentic-engineering-system-canonical
  protocol_status: pilot
  purpose: canonical AES convergence and dogfood implementation

adopted_methodology:
  repository: BrianMills2718/wiki_methodology
  revision: 0cddc6b1d75a9dbc39019cfa2ce6183aac790cbe
  entrypoint: docs/architecture/README.md

navigation:
  wiki_entrypoint: wiki/index.md

authorities:
  normative_roots:
    - docs/architecture/
  decision_roots:
    - docs/decisions/
  plan_roots:
    - docs/plans/

planning:
  design_provider: Company Planning
  execution_governance_provider: Enforced Planning
  active_plan: docs/plans/001_repository_context_resolution_vertical.md
  active_frontier: PLAN-001/Slice-1-followup-utility-characterization-gap-reconciliation
  bootstrap_architecture_revision: 45fa215dd977e2ab44338465d36ac37756f14e53
  bootstrap_alignment: docs/architecture/normative-component-alignment.bootstrap.yaml
  architecture_realization_profile: docs/architecture/aes-company-planning-profile.bootstrap.yaml
  architecture_realization_schema: docs/architecture/schemas/architecture-realization.bootstrap.schema.json
  d1_status: closed
  d1_record: docs/plans/001_D1_contract_surface_topology_freeze.md
  gap_ledger: docs/architecture/INITIAL_GAP_LEDGER.md
  delivery_architecture: docs/architecture/HUMAN_OBSERVABLE_DELIVERY.md
  slice_rule: human_observable_verticals_distinct_from_gaps_and_work_graphs
  experience_planning: certainty_weighted_backward_from_north_star_when_decision_useful
  feasibility_rule: non_user_facing_work_requires_demonstrated_blocker_and_return_path
  attention_checkpoint_rule: observe_when_expected_decision_value_exceeds_next_autonomous_increment
  work_graph_role: optional_coordination_after_slice_derivation

capability_resolution:
  provider: Agentic Capability Architecture
  sourcing_policy: external_first_then_aca_then_internal_donors_then_residual
  first_required_action: repository.context.resolve
  first_required_action_status: compose_native_external_substrate_plus_residual_aes_semantics
  first_provider_landscape: research/investigations/2026-09-16-repository-context-provider-landscape.md
  selected_slice1_dependencies:
    - git-cli-local-checkout
    - pydantic==2.13.5
    - pyyaml==6.0.3
    - python-standard-library
  explicitly_unselected_slice1_runtime_dependencies:
    - data-contracts
    - representation-router
    - code-map-v4

first_external_consumer:
  repository: BrianMills2718/data-contracts
  revision: 90c38998e8141bd07e49a77a49ec417aa29beee0
  mutation: forbidden

implementation:
  roots:
    - src/agentic_engineering_system/
  state: PARTIAL
  planned_entrypoint: aes-repo-context
  planned_surface_renderer: src/agentic_engineering_system/repository_context/render_html.py
  planned_surface_output: generated/repository-context/<repository-id>/<revision>/index.html
  note: >-
    Slice 1 implementation subjects exist and the branch has been refreshed onto
    the adopted bootstrap architecture. Prior authentic technical execution,
    including the pinned external consumer, was observed on exact pre-refresh
    revisions; the first A1 returned change. Follow-up utility review, fresh
    characterization, and gap recomputation remain outstanding. Do not treat
    PARTIAL as conformant or delivered.

verification:
  roots:
    - tests/repository_context/
  state: PARTIAL
  canonical_external_test: tests/repository_context/test_data_contracts_pinned.py
  planned_evidence_root: evidence/plan-001/
  note: >-
    Focused and pinned external checks were observed on prior exact revisions.
    The refreshed hosted regression run remains unavailable as code-test evidence
    because the job fails before executing steps. The pinned private consumer
    remains an explicit environment-dependent acceptance boundary and must not be
    inferred from hosted regression CI.

relationships:
  source: .agentic/relationships.yaml

events:
  root: .agentic/events/

concerns:
  research: {root: research/, status: active}
  proposals: {root: proposals/, status: unused}
  experiments: {root: experiments/, status: unused}
  evidence: {root: evidence/, status: active}
  evals: {root: evals/, status: unused}
  human_facing: {root: human-facing/, status: unused}
  deployment: {root: deployment/, status: unused}
  operations: {root: operations/, status: unused}
  datasets: {root: datasets/, status: unused}

generated:
  roots:
    - generated/
