  sourcing_policy: external_first_then_aca_then_internal_donors_then_residual
  first_required_action: repository.context.resolve
  first_required_action_status: compose_native_external_substrate_plus_residual_aes_semantics
  first_provider_landscape: research/investigations/2026-09-16-repository-context-provider-landscape.md
  selected_slice1_dependencies:
    - git-cli-local-checkout
    - pydantic==2.13.5
    - pyyaml==6.0.3
    - python-standard-library
  explicitly_unselected_slice1_runtime_dependencies:
    - data-contracts
    - representation-router
    - code-map-v4

first_external_consumer:
  repository: BrianMills2718/data-contracts
  revision: 90c38998e8141bd07e49a77a49ec417aa29beee0
  mutation: forbidden

implementation:
  roots:
    - src/agentic_engineering_system/
  state: PARTIAL
  entrypoint: aes-repo-context
  surface_renderer: src/agentic_engineering_system/repository_context/render_html.py
  surface_output: generated/repository-context/<repository-id>/<revision>/index.html
  note: >-
    The broader AES implementation remains PARTIAL. Within it, Plan 001 /
    Repository Context Slice 1 is delivered for its bounded claim. At exact AES
    revision 96fcf5e89ba98ad9ff278ec536a98c308cda3fe1, a fresh local verification
    batch executed the repository-context suite against the pinned external
    consumer and the real CLI: 15 tests passed, CLI resolution was RESOLVED,
    and the frozen batch remained valid on a clean repository. The corrected
    surface then received follow-up stakeholder disposition continue.

verification:
  roots:
    - tests/repository_context/
  state: PARTIAL
  policy: docs/decisions/0008-provider-independent-verification-with-transitive-subjects.md
  corrected_prior_evidence: evidence/plan-001/verification-boundary-correction-2026-09-18.json
  verification_batch_provider: enforced_planning/verification_batch.py
  hosted_ci: optional_manual_unfunded
  canonical_external_test: tests/repository_context/test_data_contracts_pinned.py
  planned_evidence_root: evidence/plan-001/
  note: >-
    Broader AES verification remains PARTIAL. Plan 001 / Repository Context
    technical acceptance completed at exact AES revision
    96fcf5e89ba98ad9ff278ec536a98c308cda3fe1: the full repository-context suite,
    including the pinned external consumer, reported 15 passed and the real CLI
    resolved the consumer. Enforced Planning's verification-batch check remained
    active and valid afterward. Hosted CI is not an acceptance gate.

