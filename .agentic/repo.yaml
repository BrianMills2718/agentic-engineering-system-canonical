  active_acceptance_decision: docs/decisions/0010-greenfield-v0.2-accepted.md
  active_roadmap: proposals/aes-v0.2-greenfield/25-roadmap-to-mvp-acceptance.md
  active_target: .aes/target.yaml
  active_frontier: v0.2-accepted/whygame5-runner-and-first-value-measure (Decision 0011 item 5)
