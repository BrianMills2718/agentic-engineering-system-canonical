  archived_predecessor: Inside-Success/agentic-engineering-system
  predecessor_harvest: research/synthesis/2026-09-26-inside-success-aes-harvest.md
  v0_1_active_plan: docs/plans/002_offline_policy_decision_replay.md
  v0_1_active_frontier: PLAN-002/P0-provider-access-then-V1-first-offline-replay
  last_completed_plan: docs/plans/001_repository_context_resolution_vertical.md
