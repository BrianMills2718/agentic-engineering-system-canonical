# SHAPING DRAFT v2 - validated with `aes plan validate`, NOT accepted, NOT implemented.
# Brian, 2026-10-04: "we should ahve a structure that enforceds rigorous upfront plannign so tht at
# each review point i get a workable ui. and that during th eplannign i am looking at diagrams etc."
# v2 builds on what exists instead of a new renderer: it promotes scripts/probe/render_review.py
# (the whygame5 review page) into `aes review`, as proposals/aes-v0.2-greenfield/06-open-questions.md
# section 22 said to do after a second real use. This plan is that second use. The review page of
# this plan is generated by the extended probe (see the PR body); review points: review-points.yaml.
schema_version: aes.v0_2.proposal.probe0
proposal_id: PLAN-AES-PLAN-GATE
title: Plan gate - `aes review` renders every plan, and plans end in phone-checked UI slices
rationale: >
  Brian reviews plans by looking, not by reading YAML, and wants a working UI at every review point.
  A review page already exists: scripts/probe/render_review.py rendered whygame5's target as a
  linked derivation graph (outcome to rules to criteria to evidence to proofs to files, with
  existence marks, a click-to-trace inspector and an orphan list), following Representation Router
  references/planning-review.md "Reviewing a structured proposal or target before implementation".
  Open question 22 deferred making it a command until a second real use; the plan gate is that use.
  This plan promotes it to `aes review` (target or proposal), adds what the router asks for and the
  probe lacked (execution marks from evidence status, the reference check shown with its method, a
  colour scheme that does not rely on red versus green), and adds one lens the router lists under
  Architecture: a port graph of the data passing between typed functions, laid out by ELK (the same
  layout code as the first shaping; router catalog id port-graph). `aes plan validate` and `accept`
  then refuse a proposal whose review has unresolved references (record references or port inputs
  nothing provides) and a proposal that adds components without naming 2 to 4 review points, each a
  runnable UI slice with three things to try and an automatic phone-width render check. Dropped from
  the first shaping because the review page already covers them: the separate structure view, the
  criterion-to-proof table and the sequence views. Deferred: links to custom visualizations. Until
  the review_points family exists (this plan adds it to ART-SRC-RECORDS), this plan's own review
  points are in proposals/aes-plan-gate/review-points.yaml.
closes_gaps: []
target_delta:
  add:
    outcomes:
      - id: OUT-GF-002
        actor_or_consumer: human_plan_reviewer
        statement: >
          The person who approves an AES plan reviews it on a generated page that shows how its
          outcome becomes proofs and files and what data passes between its functions, and at each
          review point the plan names opens a working UI slice that has already passed an automatic
          render check, from a phone.
        non_goals:
          - hand_drawn_or_free_text_diagrams
          - pixel_level_visual_regression_testing
          - replacing_representation_router_design_judgement
          - a_second_review_renderer_beside_aes_review
    normative_items:
      - id: GF-REQ-010
        kind: behavior
        outcome_refs:
          - OUT-GF-002
        statement: >
          `aes review` writes one self-contained HTML page (no server, opens from file://) for the
          project's target, or with `--proposal` for the target a proposal would leave, limited to
          what the proposal adds or changes and the chains they sit on. The page carries the lenses
          of Representation Router planning-review for a structured record: the pending decision
          first; the outcome; the derivation graph from outcome to rules, criteria, evidence
          requirements, verification subjects and files, with an existence mark per file and an
          execution mark per evidence requirement from `aes evidence status`; the reference check
          with its counts and method; a port graph of typed functions laid out by ELK, read from
          planned typed exports or, where a planned Python file has none, from the realized code and
          labelled so; the review points; and files under governed roots that nothing planned. Marks
          never rely on red versus green alone. The page states that it is derived and is not authority.
      - id: GF-REQ-011
        kind: constraint
        outcome_refs:
          - OUT-GF-002
        statement: >
          `aes plan validate` and `aes plan accept` refuse a proposal whose `aes review` of the
          resulting target reports an unresolved reference: a record reference that does not
          resolve, a Python source artifact the proposal adds or changes with no typed export
          (`name(args) -> ret`), or an argument type of an added or changed export that no typed
          export of the target returns and no planned artifact exports by name. A proposal that adds
          components must leave the target with 2 to 4 review points covering them, each naming a
          runnable entrypoint (a URL, a file, or a command that serves one), exactly three things
          for the reviewer to try, and the components and criteria it shows.
      - id: GF-REQ-012
        kind: constraint
        outcome_refs:
          - OUT-GF-002
        statement: >
          A review point's render check loads its entrypoint at 390 px width and records an
          observation that fails when the page is blank, is an error page, throws a script error or
          answers with HTTP 400 or above. Error pages are matched by real error-page signatures (a
          Python traceback header, an HTTP server-error or not-found page, an uncaught script error),
          never by the word "error", which a working page may contain. Before accept writes a plan,
          the plan's own `aes review` page passes the same check.
    success_criteria:
      - id: SC-GF-010
        statement: >
          `aes review` renders the planning-review lenses for a target and for a proposal from the
          records alone, and the same inputs give the same page.
        target_refs:
          - GF-REQ-010
        disproof: >
          On fixture projects, a lens is missing; a file mark or execution mark disagrees with git
          or `aes evidence status`; the port graph lacks a wire the typed signatures imply or draws
          one they do not; proposal mode shows an entry the proposal does not touch or chain to;
          the page needs a network fetch; or two renders of the same inputs differ beyond the build time.
        evidence_requirements:
          - id: ER-SC-GF-010-01
            kind: deterministic_test
            requirement: >
              A fixture target and a fixture proposal are rendered; the page carries each lens with
              the expected ids, marks and wires, makes no network request, and re-renders identically
              apart from the timestamp.
      - id: SC-GF-011
        statement: >
          The plan gate refuses proposals whose review has unresolved references or whose review
          points are missing or malformed, and accepts a complete one.
        target_refs:
          - GF-REQ-011
        disproof: >
          A fixture proposal with a dangling reference, an untyped new Python source artifact, an
          argument type nothing provides, fewer than two or more than four review points, or a
          review point without an entrypoint or three things to try is accepted; or the complete
          fixture is refused.
        evidence_requirements:
          - id: ER-SC-GF-011-01
            kind: deterministic_test
            requirement: >
              Each refusal fixture is refused with a finding naming the entry; the complete fixture
              validates.
      - id: SC-GF-012
        statement: >
          The render check passes a working page and fails a blank page, an error page and a page
          that throws.
        target_refs:
          - GF-REQ-012
        disproof: >
          A blank page, a traceback or server-error page, a page that throws a script error or an
          unreachable URL records PASS; or a working page that merely mentions errors records FAIL.
        evidence_requirements:
          - id: ER-SC-GF-012-01
            kind: deterministic_test
            requirement: >
              The render check runs against local fixture pages at 390 px - working, working but
              mentioning errors, blank, traceback, script error - and records PASS, PASS, FAIL, FAIL, FAIL.
      - id: SC-GF-013
        statement: >
          On one real plan after this one, the reviewer approves from its `aes review` page and
          opens review point 1 on a phone without reading the YAML.
        target_refs:
          - OUT-GF-002
        disproof: >
          The reviewer has to read the proposal YAML or ask what a drawing means to approve, or
          review point 1 does not open on a phone.
        evidence_requirements:
          - id: ER-SC-GF-013-01
            kind: runtime_observation
            requirement: >
              An observation of the reviewer's approval of a real plan, naming its review page and
              the review point 1 slice opened, at exact revisions.
    components:
      - id: RU-AES-REVIEW
        responsibility: >
          Render the planning-review page of a target or proposal (promoted from
          scripts/probe/render_review.py) and report the unresolved references that make a
          proposal unreviewable.
        target_refs:
          - GF-REQ-010
          - GF-REQ-011
          - SC-GF-010
          - SC-GF-011
        planned_artifact_refs:
          - ART-SRC-REVIEW
          - ART-SRC-REVIEW-ELK
          - ART-REVIEW-ELK-LICENSE
          - ART-TEST-REVIEW
      - id: RU-AES-REVIEW-POINTS
        responsibility: >
          Check review-point declarations and run and record the phone-width render check of a
          review point's UI slice and of a plan's own review page.
        target_refs:
          - GF-REQ-011
          - GF-REQ-012
          - SC-GF-011
          - SC-GF-012
        planned_artifact_refs:
          - ART-SRC-REVIEW-POINTS
          - ART-TEST-REVIEW-POINTS
    planned_artifacts:
      - id: ART-SRC-REVIEW
        locator:
          exact_path: src/agentic_engineering_system/review.py
        kind: source
        purpose: >
          `aes review`: the planning-review page of a target or proposal - derivation graph with
          file and execution marks, reference check, ELK port graph, review points, orphan files -
          and the unresolved-reference findings the plan gate applies
        semantic_justification_refs:
          - GF-REQ-010
          - GF-REQ-011
        exports:
          - "review_subject(root: Path, proposal: Proposal | None) -> ReviewSubject"
          - "derivation_lens(subject: ReviewSubject, standing: EvidenceReport) -> DerivationGraph"
          - "port_graph(subject: ReviewSubject) -> PortGraph"
          - "layout_ports(ports: PortGraph) -> PortLayout"
          - "reference_findings(subject: ReviewSubject, ports: PortGraph) -> list[GateFinding]"
          - "render_review(derivation: DerivationGraph, layout: PortLayout, findings: list[GateFinding], points: list[ReviewPoint]) -> ReviewPage"
          - "write_review(page: ReviewPage, out: Path) -> Path"
      - id: ART-SRC-REVIEW-ELK
        locator:
          exact_path: src/agentic_engineering_system/vendor/elk.bundled.js
        kind: source
        purpose: >
          vendored elkjs (Eclipse Layout Kernel, pinned release) that layout_ports runs in the
          render check's headless browser, so the written page holds a finished drawing and no script
          from the network
        semantic_justification_refs:
          - GF-REQ-010
      - id: ART-REVIEW-ELK-LICENSE
        locator:
          exact_path: src/agentic_engineering_system/vendor/ELK-LICENSE.txt
        kind: configuration
        purpose: >
          the Eclipse Public License 2.0 text and pinned elkjs version shipped beside the vendored file
        semantic_justification_refs:
          - GF-REQ-010
      - id: ART-TEST-REVIEW
        locator:
          exact_path: tests/greenfield/test_review.py
        kind: test
        purpose: >
          prove SC-GF-010 on a fixture target and proposal, and the unresolved-reference refusals
          of SC-GF-011
        semantic_justification_refs:
          - SC-GF-010
          - SC-GF-011
      - id: ART-SRC-REVIEW-POINTS
        locator:
          exact_path: src/agentic_engineering_system/review_points.py
        kind: source
        purpose: >
          review-point declaration checks, and the Playwright render check that records a review
          point's slice, or a plan's review page, as an observation
        semantic_justification_refs:
          - GF-REQ-011
          - GF-REQ-012
        exports:
          - "review_points_of(target: TargetRecord) -> list[ReviewPoint]"
          - "review_point_findings(points: list[ReviewPoint], target: TargetRecord) -> list[GateFinding]"
          - "render_check(point: ReviewPoint, out_dir: Path) -> RenderResult"
          - "observe_render(result: RenderResult, root: Path) -> Path"
      - id: ART-TEST-REVIEW-POINTS
        locator:
          exact_path: tests/greenfield/test_review_points.py
        kind: test
        purpose: >
          prove SC-GF-012 against working, error-mentioning, blank, traceback and script-error
          fixture pages, and the review-point count and shape refusals of SC-GF-011
        semantic_justification_refs:
          - SC-GF-012
          - SC-GF-011
    verification_subjects:
      - id: VS-GF-REVIEW
        criterion_refs:
          - SC-GF-010
          - SC-GF-011
        evidence_requirement_refs:
          - ER-SC-GF-010-01
          - ER-SC-GF-011-01
        proof_kind: deterministic_test
        proof_role: direct
        locator: tests/greenfield/test_review.py
        purpose: >
          fixture target and proposal render every lens with the right marks and wires and no
          network; unresolved-reference fixtures are refused by name
      - id: VS-GF-REVIEW-RENDER
        criterion_refs:
          - SC-GF-012
          - SC-GF-011
        evidence_requirement_refs:
          - ER-SC-GF-012-01
          - ER-SC-GF-011-01
        proof_kind: deterministic_test
        proof_role: direct
        locator: tests/greenfield/test_review_points.py
        purpose: >
          render check records PASS for the working fixtures and FAIL for blank, traceback and
          script-error fixtures; review-point shape fixtures are refused by name
    external_boundaries:
      - evidence_requirement_ref: ER-SC-GF-013-01
        boundary: >
          The orchestrating session records one observation when Brian approves the first real plan
          after this one from its `aes review` page and opens its review point 1 on his phone, naming
          the plan id, the page and the slice at exact revisions.
  change:
    planned_artifacts:
      - id: ART-PACKAGING-PYPROJECT
        locator:
          exact_path: pyproject.toml
        kind: configuration
        purpose: >
          Declare the installable AES distribution, supported Python range, dependencies, aes console
          entrypoint and packaging of the planning protocol, the vendored elkjs file as package data,
          and Playwright as the dependency of `aes review` and the render check. During pre-cutover
          coexistence it must not accidentally break retained v0.1 entrypoints/dependencies.
        semantic_justification_refs:
          - OUT-GF-001
          - SC-GF-001
          - GF-REQ-012
      - id: ART-SRC-RECORDS
        locator:
          exact_path: src/agentic_engineering_system/records.py
        kind: source
        purpose: >
          typed record models, strict YAML I/O primitives and semantic ref validation, including the
          optional review_points target family and the gate finding model
        semantic_justification_refs:
          - GF-REQ-002
          - GF-REQ-011
        exports:
          - "load_target(path: Path) -> TargetRecord"
          - load_project
          - parse_target
          - validate_target_refs
          - ReviewPoint
          - GateFinding
      - id: ART-SRC-PLANNING
        locator:
          exact_path: src/agentic_engineering_system/planning.py
        kind: source
        purpose: >
          planning contract models, target-delta validation and transition-plan validation; validate
          and accept apply the plan gate's review findings, and accept refuses a plan whose own review
          page fails its render check
        semantic_justification_refs:
          - GF-REQ-004
          - GF-REQ-011
        exports:
          - prepare
          - validate_proposal
          - accept_proposal
          - route_violations
          - unrouted_requirements
          - "load_proposal(path: Path) -> Proposal"
          - "gate_violations(review: list[GateFinding], points: list[GateFinding]) -> list[str]"
      - id: ART-SRC-EVIDENCE
        locator:
          exact_path: src/agentic_engineering_system/evidence.py
        kind: source
        purpose: >
          observation receipts and criterion evidence-assessment engine
        semantic_justification_refs:
          - GF-REQ-007
          - GF-REQ-008
        exports:
          - "assess(root: Path) -> EvidenceReport"
          - record
          - freshness
          - load_observations
      - id: ART-SRC-CLI
        locator:
          exact_path: src/agentic_engineering_system/cli.py
        kind: source
        purpose: >
          compose AES commands over the capability modules, including `aes review [--proposal]` and
          `aes review-point check`
        semantic_justification_refs:
          - OUT-GF-001
          - GF-REQ-010
        exports:
          - "main(argv: Sequence[str] | None) -> int"
outside_governed_roots:
  - artifact_ref: ART-PACKAGING-PYPROJECT
    reason: >
      pyproject.toml is the distribution's own manifest at the repository root; it must declare the
      Playwright dependency and the vendored elkjs package data that `aes review` needs.
