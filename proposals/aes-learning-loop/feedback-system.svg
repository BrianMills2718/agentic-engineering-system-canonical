<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif"><title id="title">How feedback becomes changes, and what it feeds</title><desc id="desc">Feedback is collected into a private log and reviewed weekly. Supported fixes become agent tasks. An agent adopts rules or adds audit checks. Daily effect observation uses later reports and explicit enforcement proof to reopen tasks on verified recurrence. Skill-use feedback uses a separate log; the new log does not feed the legacy taxonomy register by default.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#51636d"/></marker></defs><rect width="1240" height="1020" fill="white"/><text x="45" y="58" fill="#192b36" font-size="33" font-weight="700" text-anchor="start">How feedback becomes changes</text><text x="45" y="91" fill="#51636d" font-size="18" font-weight="400" text-anchor="start">And what it feeds — current implementation, 8 October 2026</text><text x="45" y="127" fill="#192b36" font-size="17" font-weight="400" text-anchor="start">Each proposed fix needs two independent, resolved observations before handoff.</text><path d="M45 151 h45" stroke="#51636d" stroke-width="2" fill="none" /><text x="102" y="157" fill="#51636d" font-size="15" font-weight="400" text-anchor="start">Automatic flow</text><path d="M310 151 h45" stroke="#51636d" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="367" y="157" fill="#51636d" font-size="15" font-weight="400" text-anchor="start">Agent applies the change</text><path d="M275 236 L330 236" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M550 236 L605 236" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M845 236 L900 236" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M1038 292 L1038 405" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M1155 236 L1195 236 L1195 746 L1155 746" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M900 425 L855 425 L855 355 L160 355 L160 405" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M900 460 L550 460" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M160 517 L160 645 L420 645 L420 690" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M440 517 L440 690" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M665 292 L665 325 L25 325 L25 746 L330 746" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><path d="M845 746 L865 746 L865 575 L1038 575 L1038 517" fill="none" stroke="#51636d" stroke-width="2" marker-end="url(#arrow)" /><g id="input"><rect x="45" y="180" width="230" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="61" y="211" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">Feedback</text><text x="61" y="237" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Your corrections</text><text x="61" y="258" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Agent observations</text><text x="61" y="279" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">and tool friction</text></g><g id="collect"><rect x="330" y="180" width="220" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="346" y="211" fill="#192b36" font-size="18" font-weight="700" text-anchor="start">Nightly collection</text><text x="346" y="237" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Keep source quotes</text><text x="346" y="258" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">and evidence links</text></g><g id="log"><rect x="605" y="180" width="240" height="112" rx="7" fill="#f5f8f9" stroke="#ccd7dc" stroke-width="1.5"/><text x="621" y="211" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">Feedback log</text><text x="621" y="237" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Private, durable reports</text><text x="621" y="258" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">with source evidence</text></g><g id="review"><rect x="900" y="180" width="255" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="916" y="211" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">Weekly review</text><text x="916" y="237" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Group repeat problems</text><text x="916" y="258" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Read proof; propose fixes</text></g><g id="rules"><rect x="45" y="405" width="230" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="61" y="436" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">New rules</text><text x="61" y="462" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Shared instructions</text><text x="61" y="483" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Adopt through planning</text></g><g id="checks"><rect x="330" y="405" width="220" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="346" y="436" fill="#192b36" font-size="18" font-weight="700" text-anchor="start">Audit checks</text><text x="346" y="462" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Agent adds checks</text><text x="346" y="483" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">to the audit skill</text></g><g id="queue"><rect x="900" y="405" width="255" height="112" rx="7" fill="#e9f5f2" stroke="#176b62" stroke-width="2"/><text x="916" y="436" fill="#176b62" font-size="19" font-weight="700" text-anchor="start">Agent work queue</text><text x="916" y="462" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Tasks to adopt a rule</text><text x="916" y="483" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">or add an audit check</text></g><g id="watch"><rect x="330" y="690" width="515" height="112" rx="7" fill="#f5f8f9" stroke="#ccd7dc" stroke-width="1.5"/><text x="346" y="721" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">Daily effect watcher</text><text x="346" y="747" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Read later reports + enforcement proof</text><text x="346" y="768" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Verified repeat: withdraw support and reopen task</text></g><g id="view"><rect x="900" y="690" width="255" height="112" rx="7" fill="white" stroke="#ccd7dc" stroke-width="1.5"/><text x="916" y="721" fill="#192b36" font-size="19" font-weight="700" text-anchor="start">Your problem view</text><text x="916" y="747" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">Ranked by impact</text><text x="916" y="768" fill="#51636d" font-size="16" font-weight="400" text-anchor="start">High-impact alerts</text></g><rect x="974.0" y="332" width="128" height="27" fill="white"/><text x="1038" y="350" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Supported fix</text><rect x="579.0" y="337" width="172" height="27" fill="white"/><text x="665" y="355" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Agent adopts a rule</text><rect x="639.5" y="442" width="171" height="27" fill="white"/><text x="725" y="460" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Agent adds a check</text><rect x="159.0" y="627" width="222" height="27" fill="white"/><text x="270" y="645" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Record enforcement proof</text><rect x="124.0" y="728" width="132" height="27" fill="white"/><text x="190" y="746" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Later feedback</text><rect x="937.0" y="557" width="202" height="27" fill="white"/><text x="1038" y="575" fill="#51636d" font-size="15" font-weight="400" text-anchor="middle">Verified repeat: reopen</text><text x="45" y="846" fill="#192b36" font-size="20" font-weight="700" text-anchor="start">Important boundaries</text><text x="45" y="878" fill="#192b36" font-size="17" font-weight="400" text-anchor="start">Skill-use feedback → separate log → agent reviews and edits skills.</text><rect x="45" y="900" width="1110" height="65" rx="7" fill="#fff7eb" stroke="#e5c9a5"/><text x="61" y="925" fill="#96550c" font-size="18" font-weight="700" text-anchor="start">No default bridge to the older learning register</text><text x="61" y="951" fill="#192b36" font-size="16" font-weight="400" text-anchor="start">The failure-pattern checklist review still reads that register, not the new feedback reports.</text><text x="45" y="995" fill="#192b36" font-size="17" font-weight="700" text-anchor="start">Recording feedback does not automatically edit instructions, skills or code.</text><metadata>{&quot;nodes&quot;:{&quot;input&quot;:[45,180,230,112,&quot;Feedback&quot;,[&quot;Your corrections&quot;,&quot;Agent observations&quot;,&quot;and tool friction&quot;]],&quot;collect&quot;:[330,180,220,112,&quot;Nightly collection&quot;,[&quot;Keep source quotes&quot;,&quot;and evidence links&quot;]],&quot;log&quot;:[605,180,240,112,&quot;Feedback log&quot;,[&quot;Private, durable reports&quot;,&quot;with source evidence&quot;]],&quot;review&quot;:[900,180,255,112,&quot;Weekly review&quot;,[&quot;Group repeat problems&quot;,&quot;Read proof; propose fixes&quot;]],&quot;rules&quot;:[45,405,230,112,&quot;New rules&quot;,[&quot;Shared instructions&quot;,&quot;Adopt through planning&quot;]],&quot;checks&quot;:[330,405,220,112,&quot;Audit checks&quot;,[&quot;Agent adds checks&quot;,&quot;to the audit skill&quot;]],&quot;queue&quot;:[900,405,255,112,&quot;Agent work queue&quot;,[&quot;Tasks to adopt a rule&quot;,&quot;or add an audit check&quot;]],&quot;watch&quot;:[330,690,515,112,&quot;Daily effect watcher&quot;,[&quot;Read later reports + enforcement proof&quot;,&quot;Verified repeat: withdraw support and reopen task&quot;]],&quot;view&quot;:[900,690,255,112,&quot;Your problem view&quot;,[&quot;Ranked by impact&quot;,&quot;High-impact alerts&quot;]]},&quot;edges&quot;:[[&quot;input&quot;,&quot;collect&quot;,[[275,236],[330,236]],false],[&quot;collect&quot;,&quot;log&quot;,[[550,236],[605,236]],false],[&quot;log&quot;,&quot;review&quot;,[[845,236],[900,236]],false],[&quot;review&quot;,&quot;queue&quot;,[[1038,292],[1038,405]],false],[&quot;review&quot;,&quot;view&quot;,[[1155,236],[1195,236],[1195,746],[1155,746]],false],[&quot;queue&quot;,&quot;rules&quot;,[[900,425],[855,425],[855,355],[160,355],[160,405]],true],[&quot;queue&quot;,&quot;checks&quot;,[[900,460],[550,460]],true],[&quot;rules&quot;,&quot;watch&quot;,[[160,517],[160,645],[420,645],[420,690]],true],[&quot;checks&quot;,&quot;watch&quot;,[[440,517],[440,690]],true],[&quot;log&quot;,&quot;watch&quot;,[[665,292],[665,325],[25,325],[25,746],[330,746]],false],[&quot;watch&quot;,&quot;queue&quot;,[[845,746],[865,746],[865,575],[1038,575],[1038,517]],false]],&quot;sources&quot;:{&quot;aes&quot;:&quot;67bee2198e06e1fd13178799e4859a9ee50d876b&quot;,&quot;agent-skills&quot;:&quot;1b8b47b32fc4e33fff4b75b7b32d3896573c7bea&quot;}}</metadata></svg>
