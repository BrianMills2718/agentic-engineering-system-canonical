l": "Q22: Where Brian watches the one tool work", "kind": "AgentQuestion", "explain": "Acceptance entries A1 to A5 need a page Brian opens to see Lockstep install, refuse a write and refuse a commit. Slices 1 to 6 are merged and no walkthrough page moved here with the code (the recorder `tests/lockstep/e2e/run.py` did; no served page exists, and A1 to A5 still read `planned`). Where is the page built, and when? Settled by: An argument settles it: the package and its recorder are here (`tests/lockstep/e2e/run.py`), so the page is built from a recorded run in this repository with the shared review-page builder; no test is needed to decide where it lives."}, {"id": "Q22-blocks", "label": "the entrypoint of acceptance entries A1 to A5, and whether any of them can be judged", "kind": "Decision", "explain": "the entrypoint of acceptance entries A1 to A5, and whether any of them can be judged"}, {"id": "Q23", "label": "Q23: Where the built tool still differs from the design", "kind": "AgentQuestion", "explain": "The built package differs from proposals/one-planning-tool/DESIGN.md in two places: its edit hook writes its log to `.pcw/hook-<date>.jsonl` (src/lockstep/hook.py:178) where the design says `.lockstep/` (DESIGN.md:48), and two projectors remain, the cog one for layout and AES-plan files and code2check's `Implements:` one (wiki/lockstep.md:35), where the design says one. Are these slices left over, or is the design to be amended? Settled by: An argument settles it: the design table (DESIGN.md:42-48) lists one projector and `.lockstep/`; reading both pieces of code shows neither was changed in slices 2 to 6; the Lockstep session says whether it plans a seventh slice or amends the design."}, {"id": "Q23-blocks", "label": "whether the design's one-projector and `.lockstep/` log rows are true, and whether \u2026", "kind": "Decision", "explain": "whether the design's one-projector and `.lockstep/` log rows are true, and whether `wiki/lockstep.md` can say the design is built"}, {"id": "edit-guard", "label": "Edit guard", "kind": "Concept", "dashed": false, "explain": "The one edit-time hook: refuses a write to a file the plan does not name and shows the plan; allows reading a planned file. Defined in proposals/one-planning-tool/DESIGN.md:30. Code: src/lockstep/hook.py:474."}, {"id": "first-docstring", "label": "First docstring", "kind": "Concept", "dashed": false, "explain": "The docstring lockstep layout writes at the top of each planned file: the requirement text, its success criteria and test names. Defined in proposals/one-planning-tool/DESIGN.md:28. Code: src/lockstep/cogtext.py:72."}], "edges": [{"id": "Q2-to-decision", "source": "Q2", "target": "Q2-blocks", "label": "blocks"}, {"id": "Q2-value-tally", "source": "Q2", "target": "value-tally", "label": "bears on"}, {"id": "Q2-one-tool", "source": "Q2", "target": "one-tool", "label": "bears on"}, {"id": "Q2-slice", "source": "Q2", "target": "slice", "label": "bears on"}, {"id": "Q3-to-decision", "source": "Q3", "target": "Q3-blocks", "label": "blocks"}, {"id": "Q4-to-decision", "source": "Q4", "target": "Q4-blocks", "label": "blocks"}, {"id": "Q4-plan-receipt", "source": "Q4", "target": "plan-receipt", "label": "bears on"}, {"id": "Q4-commit-rule", "source": "Q4", "target": "commit-rule", "label": "bears on"}, {"id": "Q5-to-decision", "source": "Q5", "target": "Q5-blocks", "label": "blocks"}, {"id": "Q5-thesis", "source": "Q5", "target": "thesis", "label": "bears on"}, {"id": "Q5-commit-rule", "source": "Q5", "target": "commit-rule", "label": "bears on"}, {"id": "Q5-pre-commit-hook", "source": "Q5", "target": "pre-commit-hook", "label": "bears on"}, {"id": "Q6-to-decision", "source": "Q6", "target": "Q6-blocks", "label": "blocks"}, {"id": "Q6-observation", "source": "Q6", "target": "observation", "label": "bears on"}, {"id": "Q6-standing", "source": "Q6", "target": "standing", "label": "bears on"}, {"id": "Q6-target", "source": "Q6", "target": "target", "label": "bears on"}, {"i <script src="graph-viewer.js"></script><script src="marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = async () => {
    await mermaid.run({querySelector: '.mermaid:not([data-processed])'});
    document.querySelectorAll('.mermaid svg').forEach(svg => {
      // Mermaid's responsive width shrinks labels with the whole drawing. Keep its
      // native coordinate size instead, and let the existing container scroll.
      const box = svg.viewBox.baseVal;
      if (!box.width || !box.height) return;
      svg.style.width = box.width + 'px';
      svg.style.height = box.height + 'px';
      const el = svg.parentElement;
      el.tabIndex = 0;
      el.setAttribute('role', 'region');
      el.setAttribute('aria-label', 'Diagram. Scroll sideways to read the whole drawing.');
      if (!el.dataset.scrollHelp) {
        const note = document.createElement('p'); note.className = 'note';
        note.textContent = 'Scroll sideways to read wide diagrams. With a keyboard, focus the drawing and use the arrow keys.';
        el.before(note);
        el.dataset.scrollHelp = 'true';
      }
    });
  };
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
