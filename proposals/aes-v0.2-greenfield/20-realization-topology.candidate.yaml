schema_version: aes.v0_2.realization_topology.candidate.v1
status: proposal_non_normative
basis:
  - 12-greenfield-mvp-semantic-instance.candidate.yaml
  - 15-planning-contract.candidate.yaml
  - 18-provider-evaluation-round-1.md
  - 19-provider-evaluation-round-2-generic-dependencies.md

# Since roadmap phase 6b (2026-09-25) the live authority for AES canonical's own
# topology is `.aes/target.yaml` (accepted through `aes plan accept
# PLAN-AES-SELF-GOVERN`); this file is kept in step with it for the entries it
# lists. Differences at that point (24-pre-probe-decisions.md section 17): the
# target merges VS-GF-TOPOLOGY-NEGATIVE/POSITIVE and VS-GF-CHARACTERIZE-DRIFT/
# BINDING into one subject per test file, maps capability refs to the GF-REQ
# items they serve, maps artifact kinds normative_authority -> source and
# documentation -> configuration (the loader's three kinds), and additionally
# plans the test fixtures and the retained v0.1 files (NI-AES-HIST).
purpose: >
  Candidate exact implementation, distribution and verification topology for the
  AES v0.2 Greenfield MVP itself. This is a planning proposal, not implementation
  authorization and not accepted target authority.

package_strategy:
  python_distribution: agentic-engineering-system
  python_package: agentic_engineering_system
  rationale: >
    Keep the existing public product/package identity rather than creating a
    version-numbered Python namespace. Existing v0.1 package contents do not
    automatically become v0.2 target merely because they share the package.
  first_supported_project_ecosystem: python_git
  proposed_cli: aes
  legacy_cli_during_probe_coexistence: aes-repo-context
  final_legacy_cli_disposition: unresolved_until_v0_2_cutover

transition_and_cutover:
  pre_cutover_probe_coexistence:
    allowed: true
    meaning: >
      Bounded implementation probes may temporarily coexist with v0.1 runtime
      artifacts on a branch while v0.1 remains current accepted architecture.
  final_v0_2_working_tree:
    rule: >
      Historical v0.1 runtime machinery has no automatic right to remain. Before
      v0.2 cutover, every pre-existing durable runtime/governance artifact must be
      explicitly retained as a v0.2 artifact, retained as historical evidence
      with a justified live-tree purpose, or removed with history preserved by
      Git.
    repository_context_disposition: unresolved
    broader_v0_1_governance_mechanism_disposition: unresolved
  dependency_consequence:
    pyyaml: >
      PyYAML remains necessary during probe coexistence while retained v0.1 code
      that imports yaml is still executable. It is not part of the clean
      Greenfield semantic-core dependency hypothesis unless a final retained v0.2
      artifact still requires it.
    ruamel_yaml: >
      Candidate parser for new v0.2 canonical AES YAML records.
  cutover_gate: >
    Do not claim final v0.2 repository conformance while undispositioned v0.1
    durable artifacts remain outside the accepted v0.2 topology.

realization_units:
  - id: RU-AES-RECORDS
    target_refs: [GF-REQ-002, SC-GF-002]
    responsibility: >
      Own typed AES record models, strict YAML loading/writing, stable semantic
      reference resolution and structural/semantic validation of canonical
      project records.
    capability_refs: [CAP-GF-TARGET]
    planned_artifact_refs:
      - ART-SRC-RECORDS
      - ART-TEST-RECORDS

  - id: RU-AES-PROJECT
    target_refs: [GF-REQ-001, SC-GF-001]
    responsibility: >
      Initialize and open the minimal .aes project control surface under the
      accepted initialization contract without creating placeholder artifacts.
    capability_refs: [CAP-GF-INIT]
    planned_artifact_refs:
      - ART-SRC-PROJECT
      - ART-TEST-PROJECT

  - id: RU-AES-PLANNING
    target_refs: [GF-REQ-004, SC-GF-004]
    responsibility: >
      Represent, validate and project the AES planning contract: target-realization
      deltas, accepted transition plans, uncertainty/probe semantics and
      criterion-linked verification topology.
    capability_refs: [CAP-GF-PLANNING]
    planned_artifact_refs:
      - ART-SRC-PLANNING
      - ART-PLANNING-PROTOCOL
      - ART-TEST-PLANNING

  - id: RU-AES-TOPOLOGY
    target_refs: [GF-REQ-003, SC-GF-003]
    responsibility: >
      Compare accepted durable topology and bounded generation rules with the
      Git-realized repository and emit actionable conformance findings.
    capability_refs: [CAP-GF-TOPOLOGY]
    planned_artifact_refs:
      - ART-SRC-TOPOLOGY
      - ART-TEST-TOPOLOGY
      - ART-TEST-SELF-GOVERNANCE

  - id: RU-AES-CHARACTERIZE
    target_refs: [GF-REQ-006, SC-GF-006]
    responsibility: >
      Produce revision-bound realized-repository characterization for the first
      Python/Git ecosystem without importing target project code or inventing
      target mappings.
    capability_refs: [CAP-GF-CHARACTERIZE]
    planned_artifact_refs:
      - ART-SRC-CHARACTERIZE
      - ART-SRC-CHARACTERIZE-PYTHON
      - ART-TEST-CHARACTERIZE

  - id: RU-AES-EVIDENCE
    target_refs: [GF-REQ-007, GF-REQ-008, SC-GF-007, SC-GF-008]
    responsibility: >
      Represent observations and compute evidence freshness, adequacy and standing
      independently from pass-like provider results.
    capability_refs: [CAP-GF-EVIDENCE]
    planned_artifact_refs:
      - ART-SRC-EVIDENCE
      - ART-TEST-EVIDENCE
      - ART-TEST-EVIDENCE-CONTROLS

  - id: RU-AES-RECONCILE
    target_refs: [GF-REQ-008, SC-GF-007, SC-GF-008]
    responsibility: >
      Derive qualified current state and target/current gaps from accepted target,
      realized characterization and evidence assessments.
    capability_refs: [CAP-GF-RECONCILE]
    planned_artifact_refs:
      - ART-SRC-RECONCILE
      - ART-TEST-RECONCILE

  - id: RU-AES-CONTEXT
    target_refs: [GF-REQ-005, SC-GF-005]
    responsibility: >
      Compile the smallest complete subject-specific working context from typed
      target refs, realized state, current/gaps, plan and verification semantics.
    capability_refs: [CAP-GF-CONTEXT]
    planned_artifact_refs:
      - ART-SRC-CONTEXT
      - ART-TEST-CONTEXT

  - id: RU-AES-CLI
    target_refs: [OUT-GF-001, GF-REQ-009, SC-GF-009]
    responsibility: >
      Expose one coherent user/agent command surface that composes the capability
      units without owning their semantics.
    capability_refs:
      - CAP-GF-INIT
      - CAP-GF-TARGET
      - CAP-GF-PLANNING
      - CAP-GF-TOPOLOGY
      - CAP-GF-CONTEXT
      - CAP-GF-CHARACTERIZE
      - CAP-GF-EVIDENCE
      - CAP-GF-RECONCILE
    # ART-TEST-CLI (tests/greenfield/test_cli.py) removed in phase 6b: it was
    # never created; every greenfield test file drives the CLI through cli.main.
    planned_artifact_refs:
      - ART-SRC-CLI

  - id: RU-AES-DISTRIBUTION
    target_refs: [OUT-GF-001, GF-REQ-001, GF-REQ-009, SC-GF-001, SC-GF-009]
    responsibility: >
      Own the installable Python distribution boundary, declared dependencies,
      console entrypoints, packaged planning resource, Greenfield getting-started
      material and clean-install verification.
    capability_refs: [CAP-GF-INIT]
    planned_artifact_refs:
      - ART-PACKAGING-PYPROJECT
      - ART-DOC-GREENFIELD-GETTING-STARTED
      - ART-SRC-HOOKS
      - ART-TEST-DISTRIBUTION

planned_artifacts:
  - id: ART-SRC-RECORDS
    locator:
      exact_path: src/agentic_engineering_system/records.py
    kind: source
    purpose: typed record models, strict YAML I/O primitives and semantic ref validation
    semantic_justification_refs: [CAP-GF-TARGET]

  - id: ART-TEST-RECORDS
    locator:
      exact_path: tests/greenfield/test_records.py
    kind: test
    purpose: structural, duplicate-key, typed-ref and semantic-invariant verification
    semantic_justification_refs: [SC-GF-002]

  - id: ART-SRC-PROJECT
    locator:
      exact_path: src/agentic_engineering_system/project.py
    kind: source
    purpose: initialization contract, project discovery and canonical AES control-surface paths
    semantic_justification_refs: [CAP-GF-INIT]

  - id: ART-TEST-PROJECT
    locator:
      exact_path: tests/greenfield/test_project.py
    kind: test
    purpose: prove minimal initialization and reject unauthorized bootstrap artifacts/private prerequisites
    semantic_justification_refs: [SC-GF-001]

  - id: ART-SRC-PLANNING
    locator:
      exact_path: src/agentic_engineering_system/planning.py
    kind: source
    purpose: planning contract models, target-delta validation and transition-plan validation
    semantic_justification_refs: [CAP-GF-PLANNING]

  - id: ART-PLANNING-PROTOCOL
    locator:
      exact_path: src/agentic_engineering_system/planning_protocol.md
    kind: normative_authority
    purpose: >
      Distributed provider-neutral AES planning instructions used by a human or
      agent planning provider; contains the actual v0.2 planning contract without
      depending on Company Planning.
    semantic_justification_refs: [CAP-GF-PLANNING]

  - id: ART-TEST-PLANNING
    locator:
      exact_path: tests/greenfield/test_planning.py
    kind: test
    purpose: validate design-delta/acceptance/execution ordering and incomplete-plan rejection
    semantic_justification_refs: [SC-GF-004]

  - id: ART-SRC-TOPOLOGY
    locator:
      exact_path: src/agentic_engineering_system/topology.py
    kind: source
    purpose: Git-backed durable artifact inventory and target-realized topology comparison
    semantic_justification_refs: [CAP-GF-TOPOLOGY]

  - id: ART-TEST-TOPOLOGY
    locator:
      exact_path: tests/greenfield/test_topology.py
    kind: test
    purpose: positive and negative controls for exact paths, orphan files and bounded generation rules
    semantic_justification_refs: [SC-GF-003]

  - id: ART-SRC-CHARACTERIZE
    locator:
      exact_path: src/agentic_engineering_system/characterize.py
    kind: source
    purpose: provider-neutral realized-repository characterization contract and aggregation
    semantic_justification_refs: [CAP-GF-CHARACTERIZE]

  - id: ART-SRC-CHARACTERIZE-PYTHON
    locator:
      exact_path: src/agentic_engineering_system/characterize_python.py
    kind: source
    purpose: Python AST characterization provider for symbols, signatures/types, docstrings and static imports
    semantic_justification_refs: [CAP-GF-CHARACTERIZE]

  - id: ART-TEST-CHARACTERIZE
    locator:
      exact_path: tests/greenfield/test_characterize.py
    kind: test
    purpose: revision binding, Python AST extraction, uncertainty and deliberate selected-symbol drift verification
    semantic_justification_refs: [SC-GF-006]

  - id: ART-SRC-EVIDENCE
    locator:
      exact_path: src/agentic_engineering_system/evidence.py
    kind: source
    purpose: observation receipts and criterion evidence-assessment engine
    semantic_justification_refs: [CAP-GF-EVIDENCE]

  - id: ART-TEST-EVIDENCE
    locator:
      exact_path: tests/greenfield/test_evidence.py
    kind: test
    purpose: prove pass-like observation is distinct from adequacy and exercise stale/insufficient states
    semantic_justification_refs: [SC-GF-007, SC-GF-008]

  # Added 2026-09-25 (roadmap phase 6a, 24-pre-probe-decisions.md section 16):
  # entry-level target dependencies and negative-control observations, kept
  # apart from test_evidence.py's standing tests.
  - id: ART-TEST-EVIDENCE-CONTROLS
    locator:
      exact_path: tests/greenfield/test_evidence_controls.py
    kind: test
    purpose: target-entry dependencies stale only on a referenced entry's change; negative controls are fresh against their base and must refute a missed mutation
    semantic_justification_refs: [SC-GF-008]

  - id: ART-SRC-RECONCILE
    locator:
      exact_path: src/agentic_engineering_system/reconcile.py
    kind: source
    purpose: deterministic current and gap materialization
    semantic_justification_refs: [CAP-GF-RECONCILE]

  - id: ART-TEST-RECONCILE
    locator:
      exact_path: tests/greenfield/test_reconcile.py
    kind: test
    purpose: exercise unrealized, implemented-unverified, supported, contradicted and stale reconciliation
    semantic_justification_refs: [SC-GF-007, SC-GF-008]

  # Added 2026-09-25 (roadmap phase 6b): AES canonical governs itself.
  - id: ART-TEST-SELF-GOVERNANCE
    locator:
      exact_path: tests/greenfield/test_self_governance.py
    kind: test
    purpose: >
      AES canonical's own target loads strictly, its governed roots hold no
      orphan at HEAD, every SC-GF evidence requirement has a route, and aes
      status exits 0 on this repository (reads the live repository on purpose)
    semantic_justification_refs: [SC-GF-003, SC-GF-004]

  - id: ART-SRC-CONTEXT
    locator:
      exact_path: src/agentic_engineering_system/context.py
    kind: source
    purpose: typed-ref-driven bounded working-context compiler with full semantic text/provenance
    semantic_justification_refs: [CAP-GF-CONTEXT]

  - id: ART-TEST-CONTEXT
    locator:
      exact_path: tests/greenfield/test_context.py
    kind: test
    purpose: prove full applicable text, provenance, boundedness and explicit unresolved context
    semantic_justification_refs: [SC-GF-005]

  - id: ART-SRC-CLI
    locator:
      exact_path: src/agentic_engineering_system/cli.py
    kind: source
    purpose: compose AES commands over the capability modules
    semantic_justification_refs: [OUT-GF-001]

  - id: ART-PACKAGING-PYPROJECT
    locator:
      exact_path: pyproject.toml
    kind: configuration
    change_mode: modify_existing
    purpose: >
      Declare the installable AES distribution, supported Python range,
      dependencies, aes console entrypoint and packaging of the planning protocol.
      During pre-cutover coexistence it must not accidentally break retained v0.1
      entrypoints/dependencies.
    semantic_justification_refs: [OUT-GF-001, SC-GF-001]

  - id: ART-DOC-GREENFIELD-GETTING-STARTED
    locator:
      exact_path: docs/greenfield/GETTING_STARTED.md
    kind: documentation
    purpose: >
      Colleague-facing installation and first Greenfield lifecycle instructions
      that require no knowledge of private historical repositories.
    semantic_justification_refs: [OUT-GF-001, SC-GF-001]

  # Added 2026-09-25 (roadmap phase 1): the consumer's pre-commit gate was
  # hand-copied and broke in linked worktrees, so the hook ships with AES.
  - id: ART-SRC-HOOKS
    locator:
      exact_path: src/agentic_engineering_system/hooks.py
    kind: source
    purpose: >
      Generate and install the consumer's pre-commit gate (target validate +
      topology check) with a worktree-safe interpreter lookup, refusing to
      overwrite a hook AES did not write.
    semantic_justification_refs: [CAP-GF-INIT]

  - id: ART-TEST-DISTRIBUTION
    locator:
      exact_path: tests/greenfield/test_distribution.py
    kind: test
    purpose: >
      Build/install the distribution in isolation, verify the aes entrypoint and
      packaged planning resource, and detect accidental dependency on a source
      checkout or private repository.
    semantic_justification_refs: [SC-GF-001, SC-GF-009]

selected_symbol_commitments:
